/* ---------- Helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Figures in passages. One line in a passage draws a simple graph:
   {{line Figure 1; x=Time (min); y=Temperature (°C); Trial A: 0,20 5,35 10,48; Trial B: 0,20 5,28}}
   {{bar Figure 2; x=Material; y=Speed (m/s); Air: 343; Water: 1480}}
   (Text arrives already HTML-escaped from rich().) */
function niceScale(lo,hi){
  if(hi===lo) hi=lo+1;
  const rough=(hi-lo)/5, mag=Math.pow(10,Math.floor(Math.log10(rough)));
  const step=[1,2,2.5,5,10].map(f=>f*mag).find(s=>s>=rough-1e-9);
  return {lo:Math.floor(lo/step+1e-9)*step, hi:Math.ceil(hi/step-1e-9)*step, step};
}
function figNum(v){ return (Math.round(v*100)/100).toLocaleString("en-US").replace("-","−"); }
function figure(line){
  const m=line.trim().match(/^\{\{(line|bar)\s+(.+)\}\}$/); if(!m) return "";
  const kind=m[1], parts=m[2].split(";").map(s=>s.trim()).filter(Boolean);
  const title=parts.shift()||"Figure"; let xl="", yl=""; const series=[];
  parts.forEach(s=>{
    if(/^x=/.test(s)) xl=s.slice(2); else if(/^y=/.test(s)) yl=s.slice(2);
    else { const i=s.indexOf(":"); if(i<0) return; series.push({n:s.slice(0,i).trim(), v:s.slice(i+1).trim()}); }
  });
  const W=360,H=240,ml=58,mr=14,mt=14,mb=46,pw=W-ml-mr,ph=H-mt-mb;
  const num=s=>+String(s).replace(/,/g,"").replace(/−/g,"-");
  let svg="", legend="";
  const yAxis=(lo,hi)=>{ const sc=niceScale(lo,hi), Y=v=>mt+ph-(v-sc.lo)/(sc.hi-sc.lo)*ph; let g="";
    for(let v=sc.lo; v<=sc.hi+sc.step/2; v+=sc.step){ const y=Y(v).toFixed(1);
      g+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${ml-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--mute)">${figNum(v)}</text>`; }
    return {g,Y}; };
  const labels=`<text x="${ml+pw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--ink)">${xl}</text><text transform="translate(13 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--ink)">${yl}</text>`;
  const axes=`<line x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+ph}" stroke="var(--mute)"/><line x1="${ml}" x2="${W-mr}" y1="${mt+ph}" y2="${mt+ph}" stroke="var(--mute)"/>`;
  if(kind==="bar"){
    const vals=series.map(s=>num(s.v)); const {g,Y}=yAxis(Math.min(0,...vals),Math.max(...vals));
    const band=pw/vals.length, bw=Math.min(46,band*0.6); let b="";
    vals.forEach((v,i)=>{ const cx=ml+band*(i+0.5), y=Y(v), y0=Y(0);
      b+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${Math.min(y,y0).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.abs(y0-y).toFixed(1)}" fill="var(--acc)" rx="2"/>`+
         `<text x="${cx.toFixed(1)}" y="${(Math.min(y,y0)-4).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--ink)">${figNum(v)}</text>`+
         `<text x="${cx.toFixed(1)}" y="${mt+ph+15}" text-anchor="middle" font-size="11" fill="var(--mute)">${series[i].n}</text>`; });
    svg=g+axes+b+labels;
  } else {
    const S=series.map(s=>({n:s.n, pts:s.v.split(/\s+/).map(p=>p.split(",").map(num)).filter(p=>p.length===2&&p.every(isFinite))}));
    const all=[].concat(...S.map(s=>s.pts)); if(!all.length) return "";
    const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
    const {g,Y}=yAxis(Math.min(0,...ys),Math.max(...ys));
    const x0=Math.min(...xs), x1=Math.max(...xs), X=v=>ml+10+(v-x0)/((x1-x0)||1)*(pw-20);
    const ux=[...new Set(xs)].sort((a,b)=>a-b);
    let xt=""; const ticks=ux.length<=8?ux:(()=>{const sc=niceScale(x0,x1),t=[];for(let v=sc.lo;v<=x1+1e-9;v+=sc.step) if(v>=x0-1e-9) t.push(v);return t;})();
    ticks.forEach(v=>{xt+=`<text x="${X(v).toFixed(1)}" y="${mt+ph+15}" text-anchor="middle" font-size="11" fill="var(--mute)">${figNum(v)}</text>`;});
    const ST=[{c:"var(--acc)",d:"",mk:"c"},{c:"var(--ink)",d:"6 4",mk:"s"},{c:"var(--warn)",d:"2 3",mk:"t"}];
    let ln="";
    S.forEach((s,i)=>{ const st=ST[i%3], P=s.pts.map(p=>[X(p[0]),Y(p[1])]);
      ln+=`<polyline points="${P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${st.c}" stroke-width="2" ${st.d?`stroke-dasharray="${st.d}"`:""}/>`;
      P.forEach(([x,y])=>{ ln+= st.mk==="c"?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${st.c}"/>`
        : st.mk==="s"?`<rect x="${(x-3.5).toFixed(1)}" y="${(y-3.5).toFixed(1)}" width="7" height="7" fill="${st.c}"/>`
        : `<path d="M${x.toFixed(1)} ${(y-4.5).toFixed(1)}l4.5 8h-9z" fill="${st.c}"/>`; });
      if(s.n) legend+=`<span><svg width="26" height="10" aria-hidden="true"><line x1="1" x2="25" y1="5" y2="5" stroke="${st.c}" stroke-width="2" ${st.d?`stroke-dasharray="${st.d}"`:""}/></svg>${s.n}</span>`; });
    svg=g+axes+xt+ln+labels;
  }
  const desc=kind==="bar"?series.map(s=>`${s.n}: ${s.v}`).join(", "):series.map(s=>(s.n?s.n+": ":"")+s.v.split(/\s+/).map(p=>"("+p.replace(",",", ")+")").join(" ")).join("; ");
  return `<figure class="fig"><figcaption>${title}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}. ${yl} versus ${xl}. ${desc}">${svg}</svg>${legend?`<div class="legend">${legend}</div>`:""}</figure>`;
}
function rich(text){
  const lines=esc(text).split("\n"); let html="", para=[], tbl=[];
  const fmt=s=>s.replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");
  const flushP=()=>{if(para.length){html+="<p>"+fmt(para.join("<br>"))+"</p>";para=[];}};
  const flushT=()=>{if(tbl.length){html+="<table>"+tbl.map((r,i)=>"<tr>"+r.split("|").map(c=>i?`<td>${fmt(c.trim())}</td>`:`<th>${fmt(c.trim())}</th>`).join("")+"</tr>").join("")+"</table>";tbl=[];}};
  lines.forEach(l=>{
    if(/^\{\{(line|bar)\s/.test(l.trim())){flushP();flushT();html+=figure(l);}
    else if(l.startsWith("~ ")){flushP();flushT();html+='<p class="src">'+fmt(l.slice(2))+'</p>';}
    else if(l.includes("|")){flushP();tbl.push(l.replace(/^\s*\||\|\s*$/g,""));}
    else if(!l.trim()){flushP();flushT();}
    else{flushT();para.push(l);}
  });
  flushP();flushT();return html;
}

const L="ABCD";
function fmtTime(s){const neg=s<0;s=Math.abs(s);return (neg?"−":"")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

/* ---------- Score check: a short mixed quiz that estimates ACT scores ----------
   Questions come in ACT order (English, Math, Reading, optional Science), balanced across easy /
   medium / hard, with passage questions kept together. No feedback until the end. The estimate
   weights harder questions more, converts the weighted percent correct to a 1-36 scale with an
   approximate curve shaped like typical ACT conversion tables, and reports a likely range that
   gets narrower with more questions. Enhanced ACT: Composite = average of English, Math and
   Reading; STEM = average of Math and Science. It's an estimate, not an official score. */
const ASSESS_W={easy:1,medium:1.5,hard:2};
const SCORE_CURVE=[[0,1],[0.2,11],[0.35,15],[0.5,19],[0.65,23],[0.75,26],[0.85,29],[0.92,32],[0.97,35],[1,36]];
function curveScore(p){
  p=Math.max(0,Math.min(1,p));
  for(let k=1;k<SCORE_CURVE.length;k++){ const [p1,s1]=SCORE_CURVE[k]; if(p<=p1){ const [p0,s0]=SCORE_CURVE[k-1]; return s0+(s1-s0)*(p-p0)/(p1-p0); } }
  return 36;
}
const clamp36=v=>Math.max(1,Math.min(36,Math.round(v)));
function aShuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
/* take k questions, mixing difficulty levels and preferring ones not seen yet */
function aBalance(list,k){
  const by={easy:[],medium:[],hard:[]};
  aShuffle(list).sort((x,y)=>(P.seen[x.id]?1:0)-(P.seen[y.id]?1:0)).forEach(q=>by[levelOf(q)].push(q));
  const out=[], order=["medium","easy","hard"]; let r=0;
  while(out.length<k&&(by.easy.length||by.medium.length||by.hard.length)){ const lv=order[r++%3]; if(by[lv].length) out.push(by[lv].shift()); }
  return out;
}
/* passage sections: whole passage sets, `sets` of them, `per` questions each, kept in passage order */
function aFromPassages(s,sets,per){
  const pool=bank().filter(q=>q.s===s), groups={};
  pool.forEach(q=>{ const k=pkey(q)||q.id; (groups[k]=groups[k]||[]).push(q); });
  const keys=aShuffle(Object.keys(groups)).sort((a,b)=>{
    const big=k=>groups[k].length>=per?0:1, fresh=k=>groups[k].filter(q=>!P.seen[q.id]).length;
    return big(a)-big(b)||fresh(b)-fresh(a);
  });
  const out=[];
  for(const k of keys){
    if(out.length>=sets*per) break;
    const take=aBalance(groups[k],Math.min(per,sets*per-out.length));
    out.push(...groups[k].filter(q=>take.includes(q)));
  }
  return out;
}
function assessPick(len,sci){
  const per=len==="full"?10:5, sets=len==="full"?2:1, pp=Math.ceil(per/sets);
  let qs=aFromPassages("english",sets,pp).concat(aBalance(bank().filter(q=>q.s==="math"),per), aFromPassages("reading",sets,pp));
  if(sci) qs=qs.concat(aFromPassages("science",sets,pp));
  return qs;
}
function startAssess(){
  const qs=assessPick(ui.aLen,ui.aSci); if(!qs.length) return;
  session={qs,i:0,ans:[],picked:null,sel:null,elim:[],timed:false,end:0,coins:0,label:"Score check",home:"plan",assess:{len:ui.aLen,sci:!!ui.aSci,start:Date.now()}};
  tab="plan"; render(); window.scrollTo(0,0);
}
function assessNext(){
  if(!session||!session.assess||session.sel==null) return;
  const q=session.qs[session.i], i=session.sel, right=i===q.a, k=tk(q);
  const st=P.stats[k]||{r:0,t:0}; P.stats[k]={r:st.r+(right?1:0),t:st.t+1};
  const se=P.seen[q.id]||{r:0,t:0}; P.seen[q.id]={r:se.r+(right?1:0),t:se.t+1};
  const gain=COIN_TRY+(right?COIN_RIGHT:0); P.coins=(P.coins||0)+gain; session.coins+=gain;
  session.ans.push({q,right,gain,bonus:0,pick:i,note:""});
  session.sel=null; session.elim=[]; session.i++;
  if(session.i>=session.qs.length) finishAssess();
  checkBadges(true); saveProfile(); showCoins(gain); render(); window.scrollTo(0,0);
}
function assessScore(ans){
  const res={sec:{}};
  ["english","math","reading","science"].forEach(s=>{
    const a=ans.filter(x=>x.q.s===s); if(!a.length) return;
    let tot=0,got=0; a.forEach(x=>{const w=ASSESS_W[levelOf(x.q)]||1; tot+=w; if(x.right) got+=w;});
    const p=got/tot, pv=Math.min(0.9,Math.max(0.1,p)), se=Math.sqrt(pv*(1-pv)/a.length);
    const lo=curveScore(p-se), hi=curveScore(p+se), mid=curveScore(p);
    res.sec[s]={score:clamp36(mid),lo:clamp36(lo),hi:clamp36(hi),se:(hi-lo)/2,r:a.filter(x=>x.right).length,n:a.length};
  });
  const S=res.sec;
  if(S.english&&S.math&&S.reading){
    const c=(S.english.score+S.math.score+S.reading.score)/3, e=Math.sqrt(S.english.se**2+S.math.se**2+S.reading.se**2)/3;
    res.comp={score:clamp36(c),lo:clamp36(c-e),hi:clamp36(c+e)};
  }
  if(S.math&&S.science) res.stem=clamp36((S.math.score+S.science.score)/2);
  return res;
}
function finishAssess(){
  session.done=true;
  const r=assessScore(session.ans); session.result=r;
  const sec={}; Object.keys(r.sec).forEach(s=>sec[s]=r.sec[s].score);
  P.assess=[{d:Date.now(),n:session.ans.length,comp:r.comp?r.comp.score:null,lo:r.comp?r.comp.lo:null,hi:r.comp?r.comp.hi:null,stem:r.stem||null,sec}].concat(P.assess||[]).slice(0,20);
  P.sessions.unshift({d:Date.now(),label:"Score check",r:session.ans.filter(a=>a.right).length,n:session.ans.length,timed:false});
  P.sessions=P.sessions.slice(0,30);
}

function renderAssessResult(){

   <div style="display:grid;gap:8px;margin-top:10px">${Object.keys(S).length?`<button class="btn" data-act="aweak">Practice my weakest section</button>`:""}<button class="btn ghost" data-act="astart">Take another score check</button><button class="btn ghost" data-act="adone">Done</button></div></div>`;

function pickQuestions(secs,n,random){
  const scored=bank().filter(q=>secs.includes(q.s)&&inLevel(q)).map(q=>{
    const seen=P.seen[q.id]; const pen=!seen?1:(seen.r<seen.t?0.7:0.15);
    const base=random?1:(weight(q.s,q.t)/100*(1-acc(tk(q)))+0.01);
    return {q,w:base*pen*(random?Math.random():(0.6+Math.random()*0.8))};
  }).sort((a,b)=>b.w-a.w);
  const picked=scored.slice(0,n||scored.length).map(o=>o.q);
  const order={}; picked.forEach((q,i)=>{const k=pkey(q)||q.id; if(!(k in order)) order[k]=i;});
  return picked.sort((a,b)=>order[pkey(a)||a.id]-order[pkey(b)||b.id]);
}
function startSession(key){

const LONG_CACHE={}, LONG_STATE={};
function longExpl(q,picked){ return q.xl || XL[q.id] || LONG_CACHE[q.id+":"+picked] || ""; }
const sameQ=(q,picked)=>session&&!session.done&&session.qs[session.i]===q&&session.picked===picked;
async function fetchLong(q,picked){
  const key=q.id+":"+picked; if(LONG_STATE[key]) return; // only try once per question + choice
  LONG_STATE[key]="wait";
  let sample=null; try{ if(typeof claude!=="undefined"&&claude.use) sample=await claude.use("sample"); }catch(e){}
  if(!sample){ LONG_STATE[key]="done"; if(sameQ(q,picked)) renderQuestion(); return; }
  if(sameQ(q,picked)) renderQuestion();
  const pass=passageOf(q);
  const prompt=`A student preparing for the ACT answered this ${BP[q.s].name} question wrong (topic: ${topicName(q.s,q.t)}).
${pass?"Passage:\n"+pass+"\n\n":""}Question: ${q.q}
${q.c.map((c,i)=>L[i]+") "+c).join("\n")}
Correct answer: ${L[q.a]}. The student chose: ${L[picked]}.${q.x?"\nNotes: "+q.x:""}
Write a clear explanation in 3 to 5 sentences, in plain friendly language for a high school student: explain why ${L[q.a]} is correct, why ${L[picked]} is wrong (the likely mistake), and one tip for spotting this kind of question on test day. Text in [[double brackets]] marks an underlined portion. Reply with only the explanation, no heading.`;
  try{ const r=await sample(prompt,{modelTier:"quick"}); if(r&&r.text) LONG_CACHE[key]=r.text.trim(); }catch(e){}
  LONG_STATE[key]="done";
  if(sameQ(q,picked)) renderQuestion();
}
function answer(i){
  if(session.assess){ session.sel=i; renderAssessQ(); return; }
  if(session.picked!=null) return;
  const q=session.qs[session.i]; session.picked=i;
  const right=i===q.a, k=tk(q);
  const st=P.stats[k]||{r:0,t:0}; P.stats[k]={r:st.r+(right?1:0),t:st.t+1};
  const se=P.seen[q.id]||{r:0,t:0}; P.seen[q.id]={r:se.r+(right?1:0),t:se.t+1};
  let gain=COIN_TRY;
  let bonus=0;
  if(right){ gain+=COIN_RIGHT; P.streak=(P.streak||0)+1; bonus=streakBonus(P.streak); gain+=bonus; P.best=Math.max(P.best||0,P.streak); }
  else P.streak=0;
  P.coins=(P.coins||0)+gain; session.coins=(session.coins||0)+gain;
  const note=right?replaceSolved(q):"";
  session.ans.push({q,right,gain,bonus,pick:i,note});
  checkBadges(true);
  saveProfile(); renderQuestion(); showCoins(gain);
  try{
    const ex=document.querySelector(".expl");
    if(ex&&ex.getBoundingClientRect().top>window.innerHeight*0.55)
      ex.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  }catch(e){}
}

}

  <label for="aXL">Detailed explanation (optional, shown when you miss it)</label><textarea id="aXL" placeholder="3–5 sentences. Leave blank and Claude will write one when you miss it."></textarea>
  <div style="margin-top:12px"><button class="btn" data-act="save">Save question</button></div><div id="addMsg">${ui.flash}</div></div>`;
  ui.flash="";
  // Patterns across tests
  const off=CUSTOM.filter(q=>q.origin==="official");
  h+=`<div class="card"><h2>Patterns across real tests</h2>`;
  if(!off.length) h+=`<p class="mute">Once you log questions from a few test dates, this shows which topics keep coming back.</p>`;
  SECS.forEach(sec=>{
    const qs=off.filter(q=>q.s===sec); if(!qs.length) return;
    const dates=[...new Set(qs.map(q=>q.testDate))].sort();
    h+=`<h3>${BP[sec].name} · ${qs.length} logged</h3><table class="grid"><tr><th>Topic</th>${dates.map(d=>`<th>${esc(d)}</th>`).join("")}<th>Share</th><th>Blueprint</th></tr>`;
    BP[sec].topics.forEach(([t,n,w])=>{
      const c=qs.filter(q=>q.t===t); if(!c.length) return;
      h+=`<tr><td>${esc(n.split(" (")[0])}</td>${dates.map(d=>`<td>${c.filter(q=>q.testDate===d).length||""}</td>`).join("")}<td>${pct(c.length/qs.length)}</td><td>${w}%</td></tr>`;});
    h+=`</table>`;
  });
  h+=`</div>`;
  // list
  const mine=CUSTOM.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  if(mine.length){
    h+=`<div class="card"><h2>Your question bank (${mine.length})</h2>`;
    mine.slice(0,40).forEach(q=>{h+=`<div class="qitem"><div class="row"><span class="tag">${q.origin==="official"?"Official "+esc(q.testDate||""):"Claude-written"}</span><button class="linkbtn danger" data-del="${esc(q.id)}">Delete</button></div><div>${esc(BP[q.s]?BP[q.s].name:q.s)} · ${esc(topicName(q.s,q.t))}</div><div class="mute small">${esc(String(q.q).replace(/\[\[|\]\]/g,"").slice(0,120))}</div></div>`;});
    if(mine.length>40) h+=`<p class="mute small">Showing the newest 40.</p>`;
    h+=`</div>`;
  }
  V.innerHTML=h;
}
async function saveOfficial(){
  const g=id=>document.getElementById(id).value.trim();
  const c=[0,1,2,3].map(i=>g("aC"+i)), msg=document.getElementById("addMsg");
  if(!g("aQ")||c.some(x=>!x)){msg.innerHTML=`<div class="err">Add the question and all four choices.</div>`;return;}
  const q={s:ui.addSec,t:g("aTopic"),d:g("aDiff"),passage:g("aPass"),q:g("aQ"),c,a:+document.querySelector("input[name=aAns]:checked").value,x:g("aX"),xl:g("aXL"),origin:"official",testDate:g("aYr")+"-"+g("aMon")};
  if(q.passage) q.pid="o"+q.testDate+"-"+q.passage.slice(0,40).replace(/[^a-z0-9]/gi,"");
  try{await addQuestion(q); ui.flash=`<div class="okmsg">Saved. Add another from the same test?</div>`; const keep={t:q.t,m:g("aMon"),y:g("aYr"),p:q.passage}; render(); document.getElementById("aTopic").value=keep.t; document.getElementById("aMon").value=keep.m; document.getElementById("aYr").value=keep.y; document.getElementById("aPass").value=keep.p;}
  catch(e){msg.innerHTML=`<div class="err">${e&&e.code==="quota_exceeded"?"Your question bank is full. Delete a few questions first.":"Couldn't save. Try again."}</div>`;}
}

function renderProgress(){
  let h="";
  const any=Object.keys(P.stats).length;
  const done=Object.values(P.stats).reduce((a,s)=>a+s.t,0), right=Object.values(P.stats).reduce((a,s)=>a+s.r,0);
  h+=`<div class="card"><div class="row"><h2>Your coins</h2><span class="coins"><span class="coin">$</span>${(P.coins||0).toLocaleString()}</span></div>
   <div class="stats3"><div><b>${done}</b><span class="mute small">questions done</span></div><div><b>${right}</b><span class="mute small">correct</span></div><div><b>${P.best||0}</b><span class="mute small">best streak</span></div></div>
   <p class="mute small" style="margin-bottom:0">Earn 10 coins per correct answer and 1 per question tried. Streak bonuses double: 3 in a row +5, 6 in a row +10, 9 in a row +20, 12 in a row +40, up to +${STREAK_CAP}. Current streak: ${P.streak||0}.</p></div>`;
  const today=dayStr(Date.now()), live=P.lastDay===today, ds=live?(P.dayStreak||0):0;
  const nextD=BADGES.find(b=>b.k==="d"&&(P.bestDay||0)<b.v);
  const wk=[...Array(7)].map((_,i)=>shiftDay(today,i-6));
  h+=`<div class="card"><div class="daycard"><span class="flame">🔥</span><div><h2 style="margin:0">${ds}-day streak</h2><div class="mute small">Best: ${P.bestDay||0} days${nextD?` · next badge at ${nextD.v} days`:""}</div></div></div>
   <div class="week">${wk.map(d=>{const on=(P.days||[]).includes(d);const [y,m,dd]=d.split("-").map(Number);return `<span><i class="${on?"on":""}">${on?"✓":""}</i>${new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:"short"})}</span>`;}).join("")}</div>
   <p class="mute small" style="margin-bottom:0">Open the app at least once a day to keep it going. Miss a day and the streak starts over at 1.</p></div>`;
  const got=BADGES.filter(b=>P.badges[b.id]).length, c=totalCorrect();
  h+=`<div class="card"><div class="row"><h2>Badges</h2><span class="mute small">${got} of ${BADGES.length}</span></div>`;
  [["c","Correct answers"],["s","Answer streaks"],["d","Daily streaks"]].forEach(([k,lab])=>{
    h+=`<h3>${lab}</h3><div class="badges">`;
    BADGES.filter(b=>b.k===k).forEach(b=>{const have=P.badges[b.id], cur=k==="c"?c:k==="s"?(P.best||0):(P.bestDay||0);
      h+=`<div class="badge ${have?"":"locked"}"><span class="ic">${b.ic}</span><b>${b.n}</b>${b.d}${have?"":`<div class="mute">${Math.min(cur,b.v)}/${b.v}</div>`}</div>`;});
    h+=`</div>`;
  });
  h+=`</div>`;
  if(!any) h+=`<div class="card"><h2>Progress</h2><p class="mute">Answer a few questions and your accuracy by topic shows up here.</p></div>`;
  SECS.forEach(s=>{
    const rows=BP[s].topics.filter(([t])=>P.stats[s+"."+t]);
    if(!rows.length) return;
    const tot=rows.reduce((a,[t])=>{const x=P.stats[s+"."+t];return{r:a.r+x.r,t:a.t+x.t};},{r:0,t:0});
    h+=`<div class="card"><div class="row"><h2>${BP[s].name}</h2><span class="mute small">${pct(tot.r/tot.t)} of ${tot.t}</span></div>`;
    rows.forEach(([t,n])=>{const x=P.stats[s+"."+t],a=x.r/x.t;
      h+=`<div class="topic"><div class="row"><span>${esc(n)}</span><span>${x.r}/${x.t}</span></div><div class="bar"><i style="width:${a*100}%;background:${a>=.8?"var(--ok)":a>=.5?"var(--acc)":"var(--bad)"}"></i></div></div>`;});
    h+=`</div>`;
  });
  if(P.sessions.length){
    h+=`<div class="card"><h2>Recent sessions</h2>`;
    P.sessions.forEach(x=>{h+=`<div class="row qitem"><span>${esc(x.label)}${x.timed?" · timed":""}<br><span class="mute small">${new Date(x.d).toLocaleDateString()}</span></span><b>${x.r}/${x.n}</b></div>`;});
    h+=`</div>`;
  }
  {
    const solved=Object.keys(P.retired||{}).length, made=(P.gen||[]).length, active=bank().length-CUSTOM.length;
    h+=`<div class="card"><h2>Question bank</h2>
     <p class="mute">When you get a question right, it leaves your bank. Math and Science questions are swapped for brand-new ones. English and Reading questions are set aside and come back once a section runs low.</p>
     <div class="row"><span>Questions in your bank now</span><b>${active}</b></div>
     <div class="row"><span>New questions made for you</span><b>${made}</b></div>
     <div class="row"><span>Starting questions you've solved</span><b>${solved}</b></div>
     ${solved||made?`<div style="margin-top:10px"><button class="linkbtn danger" data-act="restorebank" id="restoreBtn">Restore the ${BUILTIN.length} starting questions</button><p class="mute small">Brings back every starting question and removes the generated ones. Scores, coins and your own added questions stay.</p></div>`:""}</div>`;
  }
  if(any) h+=`<div class="card"><button class="linkbtn danger" data-act="reset" id="resetBtn">Reset my progress</button><p class="mute small">Clears scores, coins, answer badges and history. Your saved questions, store items and daily streak stay.</p></div>`;
  h+=assessHistoryCard();
  h+=`<div class="card"><h2>Back up or move your progress</h2>
   <p class="mute small">Your coins, scores, store items and question bank live in this browser. Copy a backup code to keep them safe, or paste it on another device (like your phone) to move everything there.</p>
   <button class="btn ghost" data-act="backup">Copy backup code</button>
   ${ui.backupCode?`<label for="bkOut">Your backup code</label><textarea id="bkOut" readonly rows="3">${esc(ui.backupCode)}</textarea>`:""}
   <label for="bkIn">Restore from a backup code</label><textarea id="bkIn" rows="3" placeholder="Paste a backup code here">${esc(ui.restoreText||"")}</textarea>
   <div style="margin-top:10px"><button class="btn ghost" data-act="restorecode" id="restoreCodeBtn">Restore</button></div>
   <div class="mute small" id="bkMsg" style="margin-top:6px">${esc(ui.bkMsg||"")}</div></div>`;
  ui.bkMsg="";
  h+=`<p class="mute small">${mode==="db"?"Your progress and questions are saved to your account and private to you.":"Progress is saved in this browser only."}</p>`;
  V.innerHTML=h;
}
function backupCode(){ return "ACTLAB1:"+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,at:Date.now(),p:P,c:CUSTOM})))); }
function readBackup(code){
  const m=String(code||"").replace(/\s+/g,"").match(/^ACTLAB1:([A-Za-z0-9+/=]+)$/); if(!m) return null;
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(m[1])))); return o&&o.p&&typeof o.p==="object"&&typeof o.p.stats==="object"?o:null; }catch(e){ return null; }
}

/* ---------- Question generation (asks Claude) ---------- */
async function generate(){
  const btn=document.getElementById("genBtn"), msg=document.getElementById("genMsg");
  const s=ui.genSec, t=document.getElementById("gt").value; ui.genTopic=t;
  let sample=null; try{ if(typeof claude!=="undefined"&&claude.use) sample=await claude.use("sample"); }catch(e){}
  if(!sample){msg.innerHTML=`<div class="err">Question writing isn't available in this view.</div>`;return;}
  btn.disabled=true; btn.textContent="Writing questions…"; msg.innerHTML="";
  const rules={
    english:"Write one original essay passage of 180-260 words. Then write questions about it. For each question that tests a specific word, phrase or punctuation mark, the question field must quote the full sentence from the passage with the tested portion wrapped in [[double brackets]], and the first choice must be exactly \"NO CHANGE\". Questions about the essay as a whole (adding/deleting a sentence, the writer's purpose, placement) need no brackets.",
    math:"No passage: set passage to an empty string. Mix difficulty from easy to hard. Use exact values (fractions, radicals, π) rather than long decimals. Use plain Unicode for math (x², √, π, ≤), no LaTeX.",
    reading:"Write one original passage of 400-550 words in the style of an ACT Reading passage (literary narrative, social science, humanities, or natural science). Number nothing. All questions are about this passage.",
    science:"Write one original passage describing an experiment or two competing scientific viewpoints, with data. Present each data table as plain text with columns separated by | and one row per line, first row as headers. All questions are about this passage and must be answerable from the data or text."
  }[s];
  const prompt=`You write ORIGINAL practice questions for the enhanced ACT (the format used since spring 2025). Never copy or closely paraphrase real ACT questions.
Section: ${BP[s].name}
Topic to test: ${topicName(s,t)}
Difficulty: ${(ui.genDiff||"mix")==="mix"?"make 2 easy, 2 medium and 1 hard question":"make all 5 questions "+(ui.genDiff).toUpperCase()}. Easy = a single, common rule or step most students get right. Medium = two steps or a classic trap answer. Hard = like the last questions of a real ACT section: multi-step reasoning, less common rules, or very tempting wrong answers. Tag each question with "difficulty": "easy", "medium" or "hard".
Write exactly 5 multiple-choice questions on this topic with exactly 4 answer choices each, one clearly correct answer, and plausible wrong answers that reflect common student mistakes.
${rules}
For each question write two explanations in plain, friendly language for a high school student:
- "explanation_short": 1-2 sentences saying why the correct answer is right (shown when the student gets it right).
- "explanation_long": 3-5 sentences explaining why the correct answer is right, why each tempting wrong answer is wrong (the likely mistake), and a tip for spotting this question type (shown when the student gets it wrong).
Return ONLY JSON in this shape: {"passage": string, "questions": [{"question": string, "choices": [string, string, string, string], "answer": 0-3 index of correct choice, "difficulty": "easy"|"medium"|"hard", "explanation_short": string, "explanation_long": string}]}`;
  try{
    const out=await sample.json(prompt,{modelTier:"default"});
    const qs=(out&&Array.isArray(out.questions)?out.questions:[]).filter(q=>q&&q.question&&Array.isArray(q.choices)&&q.choices.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);
    if(!qs.length) throw {code:"bad"};
    const pid="g"+Date.now(), passage=typeof out.passage==="string"?out.passage:"";
    const keep=qs.map(q=>({s,t,pid:passage?pid:"",passage,q:String(q.question),c:q.choices.map(String),a:q.answer,d:LEVELS[q.difficulty]?q.difficulty:((ui.genDiff&&ui.genDiff!=="mix")?ui.genDiff:"medium"),x:String(q.explanation_short||q.explanation||""),xl:String(q.explanation_long||""),origin:"generated"})).filter(q=>actCheck(q).ok);
    if(!keep.length) throw {code:"bad"};
    for(const q of keep){ await addQuestion(q); }
    ui.flash=`<div class="okmsg">Added ${keep.length} new ${esc(topicName(s,t).split(" (")[0])} questions to your bank.</div>`;
    ui.secs=[s]; if(!session) render();
  }catch(e){
    btn.disabled=false; btn.textContent="Write 5 new questions";
    msg.innerHTML=`<div class="err">${e&&e.code==="not_granted"?"Question writing wasn't allowed. You can still practice and add your own.":e&&e.code==="rate_limited"?"Too many requests right now. Try again in a minute.":e&&e.code==="quota_exceeded"?"Your question bank is full. Delete some questions first.":"Couldn't write questions this time. Try again."}</div>`;
  }
}

/* ---------- Events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(typeof location!=="undefined"&&location.hash==="#check")history.replaceState(null,"",location.pathname);tab=b.dataset.tab;render();window.scrollTo(0,0);});
window.addEventListener("hashchange",()=>render());
let resetArmed=false, delArmed=null, restoreArmed=false;
V.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.sec){ui.secs=[d.sec];render();}
  else if(d.len){ui.len=+d.len;render();}
  else if(d.mode){ui.mode=d.mode;render();}
  else if(d.smode){ui.stemMode=d.smode;render();}
  else if(d.diff){ui.diff=d.diff;render();}
  else if(d.gdiff){ui.genDiff=d.gdiff;render();}
  else if(d.adiff){ui.addDiff=d.adiff;render();}
  else if(d.timed){ui.timed=d.timed==="1";render();}
  else if(d.gsec){ui.genSec=d.gsec;ui.genTopic="";render();}
  else if(d.asec){ui.addSec=d.asec;render();}
  else if(d.alen){ui.aLen=d.alen;render();}
  else if(d.asci){ui.aSci=d.asci==="1";render();}
  else if(d.pick!=null){answer(+d.pick);}
  else if(d.elim!=null){ const i=+d.elim, el=session.elim||[]; session.elim=el.includes(i)?el.filter(x=>x!==i):el.concat(i); renderQuestion(); }
  else if(d.buy){
    if(buyArmed!==d.buy){buyArmed=d.buy;render();return;}
    buyArmed=null;
    const [kind,id]=d.buy.split(":"), it=SHOP[kind].find(x=>x.id===id);
    if(!it||owns(kind,id)||(P.coins||0)<it.cost){render();return;}
    P.coins-=it.cost; P.owned.push(d.buy); P.look[kind]=id;
    saveProfile(); applyLook(); showCoins(); render(); toast("🛍️","Unlocked: "+it.n,"Now in use");
  }
  else if(d.use){
    const [kind,id]=d.use.split(":"); if(!owns(kind,id)) return;
    buyArmed=null; P.look[kind]=id; saveProfile(); applyLook(); render();
  }
  else if(d.del){
    if(delArmed!==d.del){delArmed=d.del;b.textContent="Tap again to delete";return;}
    delArmed=null;b.disabled=true;deleteQuestion(d.del).catch(()=>{b.disabled=false;b.textContent="Couldn't delete";});
  }
  else if(d.act){
    switch(d.act){
      case "smart": ui.secs=["smart"]; ui.diff="any"; startSession("smart"); break;
      case "start": startSession(ui.secs[0]); break;
      case "next": next(); break;
      case "quit": if(session.assess){ if(session.ans.length){ session.qs=session.qs.slice(0,session.ans.length); session.i=session.qs.length; finishAssess(); saveProfile(); } else session=null; render(); window.scrollTo(0,0); break; }
        if(session.ans.length){session.qs=session.qs.slice(0,session.i+(session.picked!=null?1:0));session.i=session.qs.length-1;session.picked=0;next();}else{session=null;render();} break;
      case "stemstart": startSession("stem"); break;
      case "again": {const k=session&&session.home==="stem"?"stem":ui.secs[0]; session=null; startSession(k);} break;
      case "done": session=null; render(); break;
      case "astart": session=null; startAssess(); break;
      case "anext": assessNext(); break;
      case "adone": session=null; tab="plan"; render(); window.scrollTo(0,0); break;
      case "aweak": {
        const S=(session.result||assessScore(session.ans)).sec, ks=Object.keys(S); if(!ks.length) break;
        const w=ks.sort((a,b)=>S[a].score-S[b].score)[0];
        session=null; ui.secs=[w]; ui.mode="focus"; ui.diff="any"; startSession(w); window.scrollTo(0,0); } break;
      case "redo": {
        const m=session.ans.filter(a=>!a.right).map(a=>a.q); if(!m.length) break;
        session={qs:m,i:0,ans:[],picked:null,elim:[],timed:false,end:0,label:session.label.replace(/ · Missed$/,"")+" · Missed",home:session.home||"practice"};
        tab=session.home; render(); window.scrollTo(0,0); } break;
      case "pfull": session.pfull=!session.pfull; renderQuestion(); break;
      case "jumpq": { const el=document.getElementById("qtext"); if(el&&el.scrollIntoView) el.scrollIntoView({block:"start"}); } break;
      case "backup": {
        ui.backupCode=backupCode();
        const done=ok=>{ ui.bkMsg=ok?"Copied! Paste it somewhere safe, like a note or a message to yourself.":"Select the code above and copy it."; render(); };
        try{ navigator.clipboard.writeText(ui.backupCode).then(()=>done(true),()=>done(false)); }catch(e){ done(false); }
      } break;
      case "restorecode": {
        const box=document.getElementById("bkIn"); ui.restoreText=box?box.value:ui.restoreText;
        const o=readBackup(ui.restoreText);
        if(!o){ restoreArmed=false; ui.bkMsg="That doesn't look like a backup code. Copy the whole code, starting with ACTLAB1:"; render(); break; }
        if(restoreArmed!=="code"){ restoreArmed="code"; b.textContent="Tap again to replace this browser's progress"; break; }
        restoreArmed=false;
        P=Object.assign({stats:{},seen:{},sessions:[]},o.p); CUSTOM=Array.isArray(o.c)?o.c:[];
        session=null; ui.restoreText=""; ui.backupCode=""; pruneGen(); fixCoins(); saveProfile(); applyLook(); showCoins(); render();
        toast("✅","Progress restored","Backup from "+new Date(o.at||Date.now()).toLocaleDateString()); } break;
      case "gen": generate(); break;
      case "save": saveOfficial(); break;
      case "reset":
        if(!resetArmed){resetArmed=true;b.textContent="Tap again to clear all scores";return;}
        resetArmed=false; P={stats:{},seen:{},sessions:[],coins:0,streak:0,best:0,badges:{},owned:P.owned,look:P.look,lastDay:P.lastDay,dayStreak:P.dayStreak,bestDay:P.bestDay,days:P.days,retired:P.retired,gen:P.gen}; checkBadges(false); saveProfile(); showCoins(); render(); break;
      case "restorebank":
        if(restoreArmed!==true){restoreArmed=true;b.textContent="Tap again to restore the starting questions";return;}
        restoreArmed=false; P.retired={}; P.gen=[]; saveProfile(); render(); toast("📚","Starting questions restored","All "+BUILTIN.length+" are back in your bank"); break;
    }
  }
});
/* Keyboard shortcuts: A-D or 1-4 to answer, Enter / N / → for the next question. */
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if(!session||session.done||tab!==session.home) return;
  if(typeof location!=="undefined"&&location.hash==="#check") return;
  const k=String(e.key||"").toLowerCase(), map={a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(session.assess){
    if(k in map){ e.preventDefault(); answer(map[k]); }
    else if(session.sel!=null&&(k==="enter"||k==="n"||k==="arrowright")){ if(k==="enter"&&t&&t.tagName==="BUTTON") return; e.preventDefault(); assessNext(); }
    return;
  }
  if(session.picked==null&&k in map){ e.preventDefault(); answer(map[k]); }
  else if(session.picked!=null&&(k==="enter"||k==="n"||k==="arrowright")){
    if(k==="enter"&&t&&t.tagName==="BUTTON") return;   // the focused button handles Enter itself
    e.preventDefault(); next();
  }
});
V.addEventListener("input",e=>{ if(e.target.id==="bkIn") ui.restoreText=e.target.value; });
V.addEventListener("change",e=>{
  if(e.target.id==="gt") ui.genTopic=e.target.value;
  if(e.target.id==="pName"){const v=e.target.value.trim().slice(0,24); if(v!==P.look.name){P.look.name=v; saveProfile();}}
});

render();
init();
</script>
