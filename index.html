<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACT Study Lab</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16202e;--mute:#5d6b7d;--line:#e2e6ec;--acc:#1f5eff;--acc2:#e8efff;--ok:#12805c;--okbg:#e5f6ef;--bad:#c4321f;--badbg:#fdecea;--warn:#a15c00}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--ink:#e8edf3;--mute:#9aa8b8;--line:#2a3441;--acc:#6f9bff;--acc2:#1d2a44;--ok:#4cc79a;--okbg:#14302a;--bad:#ff7a66;--badbg:#3a1f1c;--warn:#f0b057}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
header{padding:16px 16px 4px;max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#saveNote{font-size:12px;color:var(--mute)}
main{max-width:720px;margin:0 auto;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.mute{color:var(--mute);font-size:14px}
.small{font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:180px;background:none;border:0;color:var(--mute);font:600 13px/1.2 inherit;padding:8px 4px;border-radius:10px;cursor:pointer}
nav button.on{color:var(--acc);background:var(--acc2)}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 15px inherit;cursor:pointer;width:100%}
button.btn.ghost{background:var(--acc2);color:var(--acc)}
button.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 14px inherit;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.topic{padding:6px 0}
.topic .row span:last-child{font-size:13px;color:var(--mute);white-space:nowrap}
.pri{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.pri:last-child{border:0}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;display:grid;place-items:center;font-size:13px}
.passage{background:var(--bg);border-radius:10px;padding:4px 14px;font-size:15px;max-height:46vh;overflow:auto;border:1px solid var(--line)}
.passage table{border-collapse:collapse;margin:8px 0;font-size:14px}
.passage td,.passage th{border:1px solid var(--line);padding:4px 8px;text-align:center}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;margin-bottom:6px}
.q{font-size:17px;margin:12px 0}
u{text-decoration-thickness:2px;text-underline-offset:3px}
.choice{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:7px 0;font:16px/1.4 inherit;cursor:pointer}
.choice b{flex:none;width:24px}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.choice:disabled{cursor:default}
.expl{border-left:3px solid var(--acc);padding:6px 12px;margin:12px 0;background:var(--acc2);border-radius:0 10px 10px 0;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc2);color:var(--acc);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.late{color:var(--bad)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:15px inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.choiceIn{display:flex;gap:8px;align-items:center;margin:6px 0}
.choiceIn input[type=radio]{width:auto;flex:none}
.big{font-size:40px;font-weight:800;letter-spacing:-.02em}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid td,table.grid th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
table.grid td:first-child,table.grid th:first-child{text-align:left}
.notice{font-size:13px;color:var(--warn);margin:6px 0}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.okmsg{color:var(--ok);font-size:14px;margin-top:8px}
.linkbtn{background:none;border:0;color:var(--acc);font:600 14px inherit;cursor:pointer;padding:4px 0}
.linkbtn.danger{color:var(--bad)}
.qitem{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.coins{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fff4c2,#ffe07a);color:#6b4a00;border:1px solid #e9b934;border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c9 0,#ffd23f 35%,#d99a00 100%);border:1.5px solid #b07a00;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);flex:none;display:grid;place-items:center;font-size:11px;color:#8a5c00;font-weight:900}
.coins.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{position:absolute;right:6px;top:-4px;color:#c98a00;font-weight:900;font-size:15px;animation:pop 1.1s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.hdr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.coinline{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700;color:#b07a00}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 div{background:var(--bg);border-radius:10px;padding:10px 4px}
.stats3 b{display:block;font-size:22px}
.lvl{font-weight:700;font-size:12px;padding:1px 7px;border-radius:999px}
.lvl-easy{color:var(--ok);background:var(--okbg)}
.lvl-medium{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.lvl-hard{color:var(--bad);background:var(--badbg)}
.day{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(180deg,#ffe3d1,#ffb48a);color:#7a2e00;border:1px solid #f08a4b;border-radius:999px;padding:3px 10px 3px 7px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.day.off{filter:grayscale(1);opacity:.6}
.daycard{display:flex;align-items:center;gap:14px}
.daycard .flame{font-size:44px;line-height:1}
.week{display:flex;gap:6px;margin-top:10px}
.week span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.week i{display:block;height:28px;border-radius:8px;background:var(--line);margin-bottom:3px;font-style:normal;line-height:28px;font-size:14px}
.week i.on{background:linear-gradient(180deg,#ffb48a,#f0703b)}
.ava{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);font-size:19px;flex:none;border:3px solid transparent;line-height:1}
.ava.lg{width:64px;height:64px;font-size:38px;border-width:4px}
.f-none{border-color:var(--line)}
.f-silver{border-color:#b9c2cc}
.f-gold{border-color:#e9b934}
.f-emerald{border-color:#1fae73}
.f-rainbow{background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(#ff4d4d,#ffa31a,#ffe14d,#3ccf6e,#3d8bff,#a05cff,#ff4d4d) border-box}
.me{display:flex;align-items:center;gap:8px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.item.active{border-color:var(--acc)}
.item .nm{font-weight:700;font-size:14px}
.sw{height:34px;border-radius:8px;display:flex;overflow:hidden}
.sw i{flex:1}
.ibtn{border:0;border-radius:8px;padding:8px;font:700 13px inherit;cursor:pointer;background:var(--acc);color:#fff}
.ibtn.own{background:var(--acc2);color:var(--acc)}
.ibtn:disabled{opacity:.55;cursor:default}
.ibtn.cur{background:none;color:var(--ok);border:1px solid var(--ok)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{text-align:center;padding:10px 6px;border-radius:12px;background:var(--bg);font-size:12px;line-height:1.3}
.badge .ic{font-size:30px;display:block;margin-bottom:4px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge b{display:block;font-size:13px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120%);background:var(--card);border:1px solid #e9b934;box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:9;transition:transform .35s ease;max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .ic{font-size:30px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (prefers-reduced-motion:reduce){.coins.bump,.pop{animation:none}.pop{display:none}}
</style>
</head>
<body>
<header><h1>ACT Study Lab</h1><div class="hdr"><div class="me"><span id="hAva" class="ava f-none">🦉</span><span class="day" id="day" title="Days in a row"><span>🔥</span><span id="dayN">0</span></span><span class="coins" id="coins" aria-live="polite"><span class="coin">$</span><span id="coinN">0</span></span></div><span id="saveNote">Loading…</span></div></header>
<div id="toast" role="status" aria-live="polite"></div>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="plan" class="on">Plan</button>
  <button data-tab="practice">Practice</button>
  <button data-tab="stem">STEM</button>
  <button data-tab="add">Add</button>
  <button data-tab="store">Store</button>
  <button data-tab="progress">Progress</button>
</nav>
<script>
"use strict";
/* ---------- Blueprint: what the enhanced ACT tends to test ----------
   English percentages follow ACT's published reporting-category ranges
   (Production of Writing 38-43%, Knowledge of Language 18-23%,
   Conventions 38-43%). Subtopic splits and the Math/Reading/Science
   splits are estimates from prep-company frequency analyses. */
const BP = {
  english:{name:"English",count:50,sec:42,topics:[
    ["punct","Punctuation (commas, semicolons, colons, apostrophes)",18,"Conventions"],
    ["sent","Sentence structure (run-ons, fragments, splices)",10,"Conventions"],
    ["usage","Usage (agreement, verb tense, pronouns)",12,"Conventions"],
    ["trans","Transitions & logic",12,"Production of Writing"],
    ["adddel","Add / delete / relevance",14,"Production of Writing"],
    ["org","Organization & sentence placement",7,"Production of Writing"],
    ["purpose","Writer's purpose & main idea",7,"Production of Writing"],
    ["concise","Concision & redundancy",10,"Knowledge of Language"],
    ["word","Word choice & tone",10,"Knowledge of Language"]]},
  math:{name:"Math",count:45,sec:67,topics:[
    ["ies","Essential skills (percents, rates, ratios, word problems)",28],
    ["alg","Algebra (equations, inequalities, systems)",15],
    ["func","Functions (graphs, quadratics, exponentials)",15],
    ["geo","Geometry (area, triangles, circles, coordinates)",14],
    ["stat","Statistics & probability",12],
    ["num","Number & quantity (exponents, fractions)",10],
    ["trig","Trigonometry",6]]},
  reading:{name:"Reading",count:36,sec:67,topics:[
    ["infer","Inference",25],
    ["integ","Comparing passages & integrating ideas",20],
    ["main","Main idea & summary",15],
    ["detail","Supporting details",15],
    ["craft","Purpose, point of view & structure",15],
    ["vocab","Words in context",10]]},
  science:{name:"Science",count:40,sec:60,topics:[
    ["data","Interpreting data (graphs & tables)",45],
    ["models","Evaluating models & viewpoints",30],
    ["design","Experimental design",25]]}
};
const SECS = Object.keys(BP);
const topicName = (s,t)=> (BP[s].topics.find(x=>x[0]===t)||[t,t])[1];

/* ---------- Built-in original questions ---------- */
const PASS = {
lib:`The Millbrook Public Library opened in 1912 in a single room above the post office. Its first collection was 300 donated books, most of them almanacs and farming manuals.

By 1950, the collection had outgrown the space. Residents held bake sales, car washes, and a town-wide auction, and within three years they had raised enough money for a separate brick building on Main Street. That building still serves the town today.`,
bees:`On the roofs of a dozen office buildings downtown, honeybee hives now sit beside air-conditioning units. The city's rooftop beekeeping program began six years ago with two hives and a single volunteer, Rosa Delgado, a retired chemistry teacher who had kept bees on her family's farm as a child. Delgado assumed the project would last a season or two. Instead, building managers began calling her, asking whether their roofs could host hives as well.

Supporters point out that city bees often thrive. Parks, street trees, and balcony gardens bloom at different times, giving bees a steady supply of nectar from early spring to late fall. Some rural areas, by contrast, are planted with a single crop that flowers for only a few weeks.

Not everyone is convinced the program helps. Dr. Aaron Pike, an entomologist at the state university, notes that honeybees are not native to North America and may compete with wild bee species for the same flowers. "Adding honeybees is a bit like opening a new restaurant in a neighborhood that already has plenty," he said. "If there isn't enough food to go around, someone goes hungry." Pike argues that cities would do more for pollinators by planting native flowers than by adding hives.

Delgado does not dismiss the concern. This year, the program began requiring every building that hosts a hive to plant native wildflowers in nearby planters. "The bees got people's attention," she said. "Now we can use that attention to help all pollinators, not just ours."`,
seeds:`Students studied how temperature affects the germination of radish seeds. For each temperature, 50 seeds were placed on damp paper towels in a sealed container kept in the dark. After 5 days, the students counted how many seeds had sprouted.

Temperature (°C) | Seeds germinated (%)
10 | 12
15 | 46
20 | 78
25 | 90
30 | 84
35 | 40`
};
const BUILTIN = [
 {id:"b-e1",s:"english",t:"punct",q:"The museum's newest exhibit [[features three artists, each of whom]] works with recycled materials.",c:["NO CHANGE","features three artists; each of whom","features, three artists each of whom","features three artists each, of whom"],a:0,x:"The comma correctly sets off the nonessential phrase \"each of whom works…\". A semicolon (B) needs a complete sentence on both sides, and C and D put commas where no pause belongs."},
 {id:"b-e2",s:"english",t:"sent",q:"Maya had practiced the piece for weeks, [[she still felt]] nervous before the recital.",c:["NO CHANGE","but she still felt","she, still, felt","and she, still felt"],a:1,x:"Two complete sentences joined by only a comma is a comma splice. Adding the conjunction \"but\" fixes it and shows the contrast."},
 {id:"b-e3",s:"english",t:"punct",q:"All twenty of the [[students' projects]] were displayed in the hallway for parents to see.",c:["NO CHANGE","student's projects","students projects","students projects'"],a:0,x:"The projects belong to many students, so the plural possessive \"students'\" is correct."},
 {id:"b-e4",s:"english",t:"usage",q:"The collection of rare coins [[are]] stored in a climate-controlled vault.",c:["NO CHANGE","were","is","have been"],a:2,x:"The subject is \"collection\" (singular), not \"coins.\" Ignore the prepositional phrase: the collection is stored."},
 {id:"b-e5",s:"english",t:"usage",q:"Last summer, the town [[builds]] a new skate park near the library.",c:["NO CHANGE","will build","built","is building"],a:2,x:"\"Last summer\" signals the past, so the past tense \"built\" is needed."},
 {id:"b-e6",s:"english",t:"trans",q:"The trail is steep and rocky. [[Therefore,]] thousands of hikers complete it every year.",c:["NO CHANGE","Nevertheless,","Similarly,","For example,"],a:1,x:"The second sentence contrasts with the first (hard trail, yet many finish), so a contrast transition like \"Nevertheless\" fits."},
 {id:"b-e7",s:"english",t:"concise",q:"Because of the storm, the meeting was postponed [[until a later time in the future]].",c:["NO CHANGE","until later in the future","to a future time later on","until later"],a:3,x:"\"Later\" already means \"in the future.\" The ACT rewards the shortest choice that keeps the meaning and is grammatical."},
 {id:"b-e8",s:"english",t:"adddel",p:"lib",q:"The writer is considering adding the following sentence after the first paragraph:\n\"My cousin prefers e-books to printed books.\"\nShould the writer make this addition?",c:["Yes, because it shows how libraries have changed over time.","Yes, because it adds a personal detail that engages the reader.","No, because it is unrelated to the history of the Millbrook library.","No, because it contradicts the claim that the library had 300 books."],a:2,x:"The essay is about the library's history. A cousin's reading preference is off-topic, and the reason in C says exactly why."},
 {id:"b-e9",s:"english",t:"word",q:"The scientist's findings were [[super cool and stuff]], earning praise from researchers worldwide.",c:["NO CHANGE","groundbreaking","kind of awesome","pretty neat"],a:1,x:"The essay's tone is formal. \"Groundbreaking\" matches that tone and fits \"earning praise from researchers worldwide.\""},
 {id:"b-e10",s:"english",t:"purpose",p:"lib",q:"Suppose the writer's goal had been to describe how a community worked together to support a local institution. Would this essay accomplish that goal?",c:["Yes, because it describes residents raising money for a new library building.","Yes, because it lists the kinds of books in the first collection.","No, because it focuses mainly on the post office.","No, because it gives only the year the library opened."],a:0,x:"The second paragraph shows residents holding fundraisers to build the library, which is community support for an institution."},
 {id:"b-e11",s:"english",t:"punct",q:"The recipe calls for only three [[ingredients: flour,]] sugar, and butter.",c:["NO CHANGE","ingredients; flour,","ingredients, flour:","ingredients flour;"],a:0,x:"A colon can introduce a list after a complete sentence (\"The recipe calls for only three ingredients\")."},
 {id:"b-m1",s:"math",t:"ies",q:"A jacket regularly priced at $80 is on sale for 25% off. A sales tax of 8% is then applied to the sale price. What is the total cost?",c:["$58.40","$64.80","$66.00","$86.40"],a:1,x:"Sale price: 80 × 0.75 = $60. With tax: 60 × 1.08 = $64.80."},
 {id:"b-m2",s:"math",t:"alg",q:"If 3x − 7 = 2x + 5, what is the value of x?",c:["−12","−2","2","12"],a:3,x:"Subtract 2x from both sides: x − 7 = 5, so x = 12."},
 {id:"b-m3",s:"math",t:"alg",q:"If x + y = 10 and x − y = 4, what is the value of xy?",c:["16","21","24","28"],a:1,x:"Add the equations: 2x = 14, so x = 7 and y = 3. Then xy = 21."},
 {id:"b-m4",s:"math",t:"func",q:"If f(x) = 2x² − 3x + 1, what is f(−2)?",c:["−1","3","11","15"],a:3,x:"2(−2)² − 3(−2) + 1 = 8 + 6 + 1 = 15."},
 {id:"b-m5",s:"math",t:"geo",q:"A right triangle has legs of length 6 and 8. What is its area?",c:["10","24","30","48"],a:1,x:"Area = ½ × 6 × 8 = 24. (48 forgets the ½; 10 is the hypotenuse.)"},
 {id:"b-m6",s:"math",t:"geo",q:"A circle has an area of 49π square units. What is its circumference?",c:["7π","14π","49π","98π"],a:1,x:"πr² = 49π, so r = 7. Circumference = 2πr = 14π."},
 {id:"b-m7",s:"math",t:"stat",q:"The mean of 5 numbers is 12. Four of the numbers are 10, 14, 9, and 15. What is the fifth number?",c:["10","11","12","13"],a:2,x:"The total is 5 × 12 = 60. The four numbers sum to 48, so the fifth is 60 − 48 = 12."},
 {id:"b-m8",s:"math",t:"stat",q:"A bag contains 4 red, 6 blue, and 5 green marbles. One marble is chosen at random. What is the probability it is NOT blue?",c:["4/15","1/3","2/5","3/5"],a:3,x:"9 of the 15 marbles are not blue: 9/15 = 3/5. (2/5 is the chance it IS blue.)"},
 {id:"b-m9",s:"math",t:"num",q:"Which expression is equivalent to (2x³)² · x⁴ ?",c:["2x¹⁰","4x⁹","4x¹⁰","4x²⁴"],a:2,x:"(2x³)² = 4x⁶. Then 4x⁶ · x⁴ = 4x¹⁰. Add exponents when multiplying, multiply when raising a power to a power."},
 {id:"b-m10",s:"math",t:"trig",q:"In a right triangle, the side opposite angle θ is 5 and the hypotenuse is 13. What is tan θ?",c:["5/13","12/13","5/12","12/5"],a:2,x:"The adjacent side is √(13² − 5²) = 12. tan θ = opposite/adjacent = 5/12."},
 {id:"b-m11",s:"math",t:"func",q:"What is the slope of the line through (2, 3) and (6, 11)?",c:["1/2","2","4","8"],a:1,x:"Slope = (11 − 3)/(6 − 2) = 8/4 = 2."},
 {id:"b-m12",s:"math",t:"ies",q:"A car travels 150 miles in 2.5 hours. At the same rate, how far will it travel in 4 hours?",c:["200 miles","220 miles","240 miles","375 miles"],a:2,x:"Rate = 150 ÷ 2.5 = 60 mph. In 4 hours: 60 × 4 = 240 miles."},
 {id:"b-r1",s:"reading",t:"main",p:"bees",q:"The passage mainly focuses on:",c:["the growth of a rooftop beekeeping program and a debate about its effects.","the chemistry of how honeybees produce honey.","reasons rural farms are better places for bees than cities.","step-by-step instructions for starting a beehive."],a:0,x:"The passage traces the program's growth, presents Pike's criticism, and ends with Delgado's response. Only A covers the whole passage."},
 {id:"b-r2",s:"reading",t:"detail",p:"bees",q:"According to the passage, city bees often thrive because:",c:["rooftops stay warmer than rural fields.","city plants bloom at different times, providing food over a long season.","cities have fewer predators than rural areas.","beekeepers feed the bees sugar water in winter."],a:1,x:"Paragraph 2 says parks, trees, and gardens bloom at different times, giving bees nectar from spring to fall."},
 {id:"b-r3",s:"reading",t:"infer",p:"bees",q:"It can reasonably be inferred that Delgado views Pike's concern as:",c:["completely false.","something she had never heard before.","worth taking steps to address.","relevant only to rural beekeepers."],a:2,x:"She \"does not dismiss the concern\" and added a native-wildflower requirement, which is a step taken in response."},
 {id:"b-r4",s:"reading",t:"vocab",p:"bees",q:"As it is used in the final paragraph, the word \"dismiss\" most nearly means:",c:["disregard.","fire from a job.","release from class.","send away."],a:0,x:"Delgado doesn't ignore Pike's concern, so \"dismiss\" means to disregard."},
 {id:"b-r5",s:"reading",t:"craft",p:"bees",q:"Pike's comparison to opening a new restaurant mainly serves to:",c:["suggest that bees prefer city flowers to rural ones.","illustrate how added honeybees could reduce the food available to wild bees.","argue against building restaurants near rooftop hives.","show how quickly the number of hives has grown."],a:1,x:"The analogy explains competition: more \"diners\" (honeybees) for the same food can leave others (wild bees) hungry."},

glass:`[1] Glassblowing begins with a blob of molten glass gathered on the end of a long metal pipe. [2] The artist then blows gently into the pipe, forming a bubble. [3] Finally, the finished piece is placed in a special oven to cool slowly over many hours. [4] While the bubble is still hot, the artist shapes it by rolling it on a steel table and using wooden tools.`,
lantern:`My grandfather kept a lantern on the windowsill of his workshop, though the building had electric lights for as long as I could remember. It was a plain thing, dented brass with a cracked glass chimney, and it never held any oil. When I asked him why he kept it, he only said that it had been useful once.

The summer I turned fifteen, he asked me to help him repair a rowboat that had sat behind the shed for a decade. I expected to sand and paint for an afternoon. Instead, we worked every morning for six weeks, replacing rotted planks one at a time. He measured each board three times before cutting it, and when I complained about the pace, he handed me the tape measure without a word.

On the last day, we carried the boat down to the lake. It floated, and for a moment neither of us spoke. Then he told me about the winter his father's fishing boat failed to return before dark, and how his mother had set that lantern in the window and kept it burning until dawn, when the boat finally appeared through the fog.

"I keep it to remember that waiting is a kind of work, too," he said.

I understood, then, why he had never hurried me, and why he had never hurried the boat.`,
ice:`Two students explain why ice floats on liquid water.

Student 1: Ice floats because it is less dense than liquid water. When water freezes, its molecules lock into a rigid structure with more open space between them, so a given mass of ice takes up more volume than the same mass of liquid water.

Student 2: Ice floats because air bubbles become trapped in it as it freezes. The trapped air makes the ice lighter. Ice with no air bubbles in it would sink in liquid water.

Table 1 (densities at 1 atmosphere of pressure):
Substance | Density (g/cm³)
Liquid water at 4°C | 1.000
Liquid water at 0°C | 0.9998
Ice at 0°C, no bubbles | 0.917
Vegetable oil at 20°C | 0.920`

 {id:"b-e12",s:"english",t:"punct",d:"hard",q:"The festival's headliner [[— a jazz trio from New Orleans,]] drew the largest crowd in the event's history.",c:["NO CHANGE","— a jazz trio from New Orleans —",", a jazz trio from New Orleans —","a jazz trio from New Orleans —"],a:1,x:"An interrupting phrase must open and close with the same punctuation, so a phrase that starts with a dash has to end with a dash.",xl:"The phrase \"a jazz trio from New Orleans\" interrupts the sentence to describe the headliner, so it needs matching punctuation on both sides. You can use two commas or two dashes, but never one of each. Since the phrase already starts with a dash and that dash isn't part of your choices to change, it must end with a dash too, which makes B correct. A and C mix a dash with a comma, and D drops the opening punctuation entirely. Whenever you see one dash in a sentence, look for its partner."},
 {id:"b-e13",s:"english",t:"usage",d:"medium",q:"The coach gave the awards to Priya and [[I]] at the banquet.",c:["NO CHANGE","me","myself","mine"],a:1,x:"\"To\" needs an object pronoun, and \"me\" is the object form. Drop \"Priya and\" to check: the coach gave the awards to me.",xl:"Pronouns change form depending on their job in the sentence: \"I\" is a subject, while \"me\" is an object. Here the pronoun comes after the preposition \"to,\" so it is an object and must be \"me.\" The quickest check is to remove the other person: \"The coach gave the awards to I\" sounds wrong, but \"to me\" sounds right. \"Myself\" (C) is only correct when the subject also does the action (\"I gave myself a break\"), and \"mine\" (D) shows possession. Many students pick \"I\" because \"Priya and I\" sounds formal, which is exactly the trap."},
 {id:"b-e14",s:"english",t:"usage",d:"hard",q:"Neither the players nor the coach [[were]] ready for the sudden rainstorm.",c:["NO CHANGE","was","have been","are"],a:1,x:"With \"neither … nor,\" the verb agrees with the closer subject, \"coach,\" which is singular, so \"was\" is right.",xl:"When two subjects are joined by \"either … or\" or \"neither … nor,\" the verb agrees with whichever subject is closer to it. Here the closer subject is \"the coach,\" which is singular, so the verb must be singular too. \"Was\" is singular and past tense, matching the sudden rainstorm that already happened. \"Were,\" \"have been\" and \"are\" are all plural forms that would only fit if the sentence ended with a plural subject, like \"nor the players.\" This is a rule many people break in everyday speech, which is why the ACT likes to test it."},
 {id:"b-e15",s:"english",t:"sent",d:"hard",q:"[[Walking into the auditorium, the stage lights blinded the nervous performers.]]",c:["NO CHANGE","Walking into the auditorium, the nervous performers were blinded by the stage lights.","The stage lights, walking into the auditorium, blinded the nervous performers.","Walking into the auditorium blinded the nervous performers and the stage lights."],a:1,x:"An opening phrase like \"Walking into the auditorium\" must be followed by whoever is walking, which is the performers.",xl:"This is a dangling (misplaced) modifier question. The opening phrase \"Walking into the auditorium\" describes someone, and the ACT expects the noun right after the comma to be the one doing it. In the original, that noun is \"the stage lights,\" which makes it sound like the lights walked in. Only B puts \"the nervous performers\" right after the comma, so it's clear they were walking. C makes the same mistake in a different order, and D turns the walking into something that blinds both the performers and the lights, which makes no sense."},
 {id:"b-e16",s:"english",t:"sent",d:"medium",q:"Because the bridge was closed for [[repairs. Drivers]] had to take a long detour.",c:["NO CHANGE","repairs, drivers","repairs; drivers","repairs: drivers"],a:1,x:"\"Because the bridge was closed for repairs\" can't stand alone, so it attaches to the main sentence with a comma.",xl:"A clause that starts with \"because,\" \"although,\" \"when\" or a similar word is dependent: it can't be a sentence on its own. In the original, \"Because the bridge was closed for repairs.\" is a fragment because the period cuts it off from the main idea. The fix is to join it to the independent clause with a comma, as in B. A semicolon (C) needs complete sentences on both sides, and a colon (D) needs a complete sentence before it, so both fail for the same reason. When a sentence opens with a dependent clause, expect a comma before the main clause."},
 {id:"b-e17",s:"english",t:"concise",d:"medium",q:"The two scientists [[collaborated together jointly]] on the research.",c:["NO CHANGE","collaborated jointly together","collaborated","worked collaboratively together"],a:2,x:"\"Collaborate\" already means \"work together,\" so \"together\" and \"jointly\" are redundant.",xl:"To collaborate means to work together with someone, so adding \"together\" or \"jointly\" repeats the same idea. The original uses both extra words, which is doubly redundant. B just reorders the same redundant words, and D swaps the verb but still adds \"together\" to a word that already means it. \"Collaborated\" by itself says everything needed. If an answer is shorter and still grammatical and complete, it usually beats the wordier options."},
 {id:"b-e18",s:"english",t:"trans",d:"hard",q:"Many people assume that bats are blind. [[In fact,]] most bat species can see quite well, and some can even see in color.",c:["NO CHANGE","As a result,","Likewise,","In other words,"],a:0,x:"The second sentence corrects a common belief, and \"In fact\" is the transition for correcting a misconception.",xl:"The first sentence states a common belief, and the second shows that the belief is wrong. \"In fact\" is the right transition for correcting a misconception, so NO CHANGE is correct. \"As a result\" (B) would mean bats see well because people think they're blind, which is illogical. \"Likewise\" (C) signals a similar idea and \"In other words\" (D) signals a restatement, but the second sentence contradicts the first. Remember that NO CHANGE is correct about as often as any other choice, so don't avoid it just because it feels too easy."},
 {id:"b-e19",s:"english",t:"org",d:"hard",p:"glass",q:"For the sake of logic and cohesion, Sentence 4 should be placed:",c:["where it is now.","before Sentence 1.","after Sentence 1.","after Sentence 2."],a:3,x:"Sentence 4 shapes \"the bubble,\" so it must come after Sentence 2 creates the bubble and before Sentence 3's \"Finally.\"",xl:"Placement questions are solved by following the order of events and looking for clue words. Sentence 4 says \"while the bubble is still hot,\" so it must come after the bubble is formed in Sentence 2. It also can't come after Sentence 3, because \"Finally\" signals the last step of the process. That leaves only one spot: after Sentence 2 and before Sentence 3. Look for words like \"the bubble,\" \"then\" and \"finally\" that tie a sentence to what comes before and after it."},
 {id:"b-e20",s:"english",t:"word",d:"medium",q:"The new policy will [[effect]] how students register for classes.",c:["NO CHANGE","affect","infect","effecting"],a:1,x:"\"Affect\" is the verb meaning \"to influence,\" which is what the policy does to registration.",xl:"\"Affect\" is usually a verb meaning to influence or change something, while \"effect\" is usually a noun meaning a result. The sentence needs a verb after \"will\" that means the policy changes how students register, so \"affect\" is correct. \"Effect\" as a verb exists but means to bring about (\"effect change\"), which doesn't fit here. \"Infect\" has the wrong meaning, and \"effecting\" is the wrong form after \"will.\" A memory trick: Affect is the Action, and Effect is the End result."},
 {id:"b-e21",s:"english",t:"adddel",d:"medium",p:"glass",q:"If the writer were to delete Sentence 3, the paragraph would primarily lose:",c:["a description of the final step in the glassblowing process.","an explanation of why glass must be heated.","a detail about the tools glassblowers use.","the writer's opinion about glassblowing."],a:0,x:"Sentence 3 begins with \"Finally\" and describes the cooling step, which is the last step of the process.",xl:"For \"what would be lost\" questions, reread just the sentence in question and describe its job in a few words. Sentence 3 starts with \"Finally\" and explains that the finished piece cools slowly in an oven, the last step of the process. So deleting it removes the final step, which is A. The sentence never explains why glass is heated (B), never mentions tools (C, which are in Sentence 4), and states no opinion (D). Match the answer to what the sentence actually says, not to what the essay talks about elsewhere."},
 {id:"b-m13",s:"math",t:"func",d:"medium",q:"What is the minimum value of f(x) = x² − 6x + 5 ?",c:["−9","−4","3","5"],a:1,x:"The vertex is at x = −b/(2a) = 3, and f(3) = 9 − 18 + 5 = −4.",xl:"A parabola that opens upward (positive x² term) has its minimum at the vertex. The x-coordinate of the vertex is −b/(2a) = −(−6)/(2·1) = 3. Plug that in to get the minimum value: f(3) = 9 − 18 + 5 = −4. Choice 3 is the x-value where the minimum happens, not the minimum value itself, which is a common trap. Choice 5 is just the y-intercept, f(0)."},
 {id:"b-m14",s:"math",t:"func",d:"medium",q:"A town's population is 2,000 and doubles every 5 years. What will the population be in 15 years?",c:["6,000","8,000","16,000","32,000"],a:2,x:"15 years is three doubling periods: 2,000 → 4,000 → 8,000 → 16,000.",xl:"Exponential growth multiplies by the same factor each period instead of adding the same amount. Fifteen years contains 15 ÷ 5 = 3 doubling periods. So the population is 2,000 × 2³ = 2,000 × 8 = 16,000. Choice 6,000 comes from adding 2,000 three times (linear thinking), and 8,000 comes from doubling only twice. The formula P = P₀ · 2^(t/5) works for any number of years."},
 {id:"b-m15",s:"math",t:"alg",d:"medium",q:"A theater sold 50 tickets for a total of $520. Adult tickets cost $12 and child tickets cost $8. How many adult tickets were sold?",c:["20","25","30","35"],a:2,x:"Solve a + c = 50 and 12a + 8c = 520 to get a = 30.",xl:"Set up two equations: a + c = 50 for the number of tickets and 12a + 8c = 520 for the money. From the first equation, c = 50 − a. Substitute: 12a + 8(50 − a) = 520, which becomes 4a + 400 = 520, so a = 30. Check it: 30 adults × $12 = $360 and 20 children × $8 = $160, which add to $520. You can also test each answer choice, starting with the middle values, if setting up the system feels slow."},
 {id:"b-m16",s:"math",t:"alg",d:"hard",q:"Which of the following is the solution set of |2x − 3| < 7 ?",c:["−2 < x < 5","x < 5","−5 < x < 2","x < −2 or x > 5"],a:0,x:"|2x − 3| < 7 means −7 < 2x − 3 < 7, which simplifies to −2 < x < 5.",xl:"An absolute value less than a number means the expression is trapped between the negative and positive of that number. So |2x − 3| < 7 becomes −7 < 2x − 3 < 7. Add 3 to all three parts to get −4 < 2x < 10, then divide by 2 to get −2 < x < 5. Choice D is the answer for \"greater than,\" which splits into two separate pieces. Choice B forgets the negative side, and C flips the signs."},
 {id:"b-m17",s:"math",t:"geo",d:"medium",q:"What are the center and radius of the circle (x − 2)² + (y + 3)² = 25 ?",c:["Center (2, −3), radius 5","Center (−2, 3), radius 5","Center (2, −3), radius 25","Center (−2, 3), radius 25"],a:0,x:"In (x − h)² + (y − k)² = r², the center is (h, k) and the radius is √25 = 5.",xl:"The standard form of a circle is (x − h)² + (y − k)² = r², where (h, k) is the center. Because the formula subtracts h and k, (x − 2) means h = 2, and (y + 3) = (y − (−3)) means k = −3. The number on the right is r², not r, so the radius is √25 = 5. Choice B flips the signs of the center, and C and D forget to take the square root. Both traps are very common, so check signs and the square root every time."},
 {id:"b-m18",s:"math",t:"trig",d:"hard",q:"If sin θ = 3/5 and θ is in Quadrant II, what is cos θ ?",c:["−4/5","4/5","−3/4","3/4"],a:0,x:"A 3-4-5 triangle gives |cos θ| = 4/5, and cosine is negative in Quadrant II.",xl:"Start with the reference triangle: if sin θ = 3/5, the opposite side is 3 and the hypotenuse is 5, so the adjacent side is 4 (a 3-4-5 triangle). That makes the size of cos θ equal to 4/5. Now think about the sign: in Quadrant II, x-values are negative, and cosine follows x, so cos θ = −4/5. Choice B ignores the quadrant, and C and D are tangent values (opposite over adjacent). Remember \"All Students Take Calculus\": in Quadrants I through IV, the positive functions are all, sine, tangent and cosine."},
 {id:"b-m19",s:"math",t:"num",d:"hard",q:"If log₂(x) = 5, what is the value of x?",c:["7","10","25","32"],a:3,x:"log₂(x) = 5 means 2⁵ = x, so x = 32.",xl:"A logarithm asks what exponent you need: log₂(x) = 5 means \"2 raised to the 5th power equals x.\" Rewrite it in exponential form: x = 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. Choice 10 comes from multiplying 2 × 5, 7 from adding them, and 25 from computing 5² instead of 2⁵. To convert, the base of the log becomes the base of the power, and the answer to the log becomes the exponent."},
 {id:"b-m20",s:"math",t:"stat",d:"hard",q:"Two fair six-sided dice are rolled. What is the probability that the sum is 8?",c:["1/9","5/36","1/6","7/36"],a:1,x:"There are 36 equally likely outcomes, and 5 of them sum to 8: (2,6), (3,5), (4,4), (5,3), (6,2).",xl:"With two dice there are 6 × 6 = 36 equally likely outcomes, because each die is separate. List the pairs that add to 8: (2,6), (3,5), (4,4), (5,3) and (6,2). That's 5 outcomes, so the probability is 5/36. A common mistake is counting (3,5) and (5,3) as the same, which gives 3 outcomes; another is assuming every sum is equally likely, which gives 1/11. Listing the combinations takes 20 seconds and prevents both errors."},
 {id:"b-m21",s:"math",t:"num",d:"hard",q:"Which of the following is equivalent to (3 + 2i)(1 − i), where i = √−1 ?",c:["1 − i","3 − 2i","5 + i","5 − i"],a:3,x:"FOIL gives 3 − 3i + 2i − 2i², and since i² = −1 that's 3 − i + 2 = 5 − i.",xl:"Multiply complex numbers the same way you FOIL binomials. First: 3·1 = 3. Outer: 3·(−i) = −3i. Inner: 2i·1 = 2i. Last: 2i·(−i) = −2i². Combine to get 3 − i − 2i², and since i² = −1, −2i² becomes +2, giving 5 − i. Choice 5 + i comes from a sign error on the i terms, and 1 − i comes from treating i² as +1."},
 {id:"b-m22",s:"math",t:"ies",d:"easy",q:"There are 12 inches in 1 foot. How many inches are in 4.5 feet?",c:["13.5","45","48","54"],a:3,x:"4.5 × 12 = 54 inches.",xl:"To change feet to inches, multiply by 12, since each foot has 12 inches. So 4.5 × 12 = 4 × 12 + 0.5 × 12 = 48 + 6 = 54. Choice 48 forgets the half foot, and 45 just moves the decimal point. Choice 13.5 divides instead of multiplying. When converting to a smaller unit, you should end up with a bigger number."},
 {id:"b-m23",s:"math",t:"stat",d:"medium",q:"The data set 3, 7, 8, 12, 15 has a median of 8. If the value 20 is added to the set, what is the new median?",c:["8","10","11","12"],a:1,x:"With six values, the median is the average of the middle two: (8 + 12) ÷ 2 = 10.",xl:"The median is the middle value of an ordered list. Adding 20 gives six values: 3, 7, 8, 12, 15, 20. With an even number of values there is no single middle, so you average the two middle ones, 8 and 12: (8 + 12) ÷ 2 = 10. Choice 8 is the old median, and 12 picks just one of the middle values. Choice 11 is the mean of the original five values, not a median."},
 {id:"b-m24",s:"math",t:"func",d:"medium",q:"If f(x) = 3x − 1 and g(x) = x² + 1, what is f(g(2)) ?",c:["10","12","14","26"],a:2,x:"Work inside out: g(2) = 5, then f(5) = 14.",xl:"For a composite function, start with the inside function and work outward. First find g(2) = 2² + 1 = 5. Then plug that result into f: f(5) = 3(5) − 1 = 14. Choice 26 is g(f(2)), which does the functions in the wrong order: f(2) = 5, then g(5) = 26. Always evaluate the function closest to the x first."},
 {id:"b-r6",s:"reading",t:"craft",d:"easy",p:"lantern",q:"The passage is told from the point of view of:",c:["a narrator recalling time spent with their grandfather.","the grandfather, describing his own childhood.","an outside observer who never meets the grandfather.","the grandfather's mother, waiting for her husband."],a:0,x:"The narrator uses \"I\" and \"my grandfather\" and looks back on the summer they turned fifteen.",xl:"Point-of-view questions ask who is telling the story. The passage opens with \"My grandfather kept a lantern,\" so the narrator is the grandchild, speaking in first person. Phrases like \"The summer I turned fifteen\" show the narrator is looking back on a memory. The grandfather speaks only in one quoted line, so B is wrong, and C is wrong because the narrator works with him for six weeks. The mother appears only in the grandfather's story, so D is wrong too."},
 {id:"b-r7",s:"reading",t:"detail",d:"medium",p:"lantern",q:"According to the passage, the lantern was once used to:",c:["light the workshop before it had electricity.","guide home a fishing boat that was out after dark.","help the grandfather see while repairing boats.","decorate the windowsill of the family's house."],a:1,x:"The grandfather's mother kept it burning in the window until his father's fishing boat returned at dawn.",xl:"The answer is in the third paragraph, where the grandfather tells his story. His father's fishing boat did not return before dark, and his mother kept the lantern burning in the window until the boat appeared at dawn. That makes B correct. A is a tempting trap because the passage mentions electric lights, but it never says the lantern lit the workshop. C and D are reasonable guesses about a lantern, but the passage doesn't support them, and on the ACT reasonable-sounding isn't enough."},
 {id:"b-r8",s:"reading",t:"infer",d:"medium",p:"lantern",q:"When the narrator complains about the slow pace, the grandfather hands over the tape measure \"without a word.\" This most strongly suggests that he:",c:["is angry and wants the narrator to leave.","expects the narrator to keep working carefully instead of rushing.","has forgotten how to measure the boards himself.","thinks the narrator should finish the boat alone."],a:1,x:"Handing over the tape measure quietly tells the narrator to keep measuring carefully, matching his patient approach.",xl:"Inference questions ask what the details imply, so connect the action to the rest of the passage. The grandfather measures each board three times and never hurries; when the narrator complains, he silently hands over the measuring tool. That's a quiet way of saying \"keep doing it carefully,\" which matches B. Nothing suggests anger (A) or that he forgot how to measure (C), and the two of them keep working together, so D is wrong. The final line, about why he never hurried the narrator, confirms the reading."},
 {id:"b-r9",s:"reading",t:"craft",d:"hard",p:"lantern",q:"The final paragraph of the passage mainly serves to:",c:["introduce a new conflict between the narrator and the grandfather.","show the narrator connecting the lantern story to the grandfather's patience.","describe what the repaired rowboat looked like on the lake.","reveal that the lantern could no longer be lit."],a:1,x:"The narrator realizes the grandfather's slow, patient work on the boat reflects the lesson of the lantern.",xl:"Questions about a paragraph's purpose ask what job it does in the passage as a whole. The final paragraph comes right after the grandfather explains that \"waiting is a kind of work,\" and the narrator says, \"I understood, then, why he had never hurried me.\" So the paragraph ties the lantern story to the grandfather's patience during the six weeks of repairs, which is B. There is no new conflict (A), no description of the boat (C), and the lantern's condition was described back in the first paragraph (D). Final paragraphs in literary passages often deliver the narrator's realization, so look for that."},
 {id:"b-r10",s:"reading",t:"vocab",d:"hard",p:"lantern",q:"In context, the grandfather's statement that \"waiting is a kind of work, too\" most nearly suggests that:",c:["patience can take real effort and purpose.","most jobs involve long breaks between tasks.","his mother was paid to watch for the boat.","waiting is usually a waste of time."],a:0,x:"His mother's all-night watch with the lantern was an effortful, purposeful act, so waiting can be real work.",xl:"This question asks you to interpret a line in context, not define words literally. The grandfather says this right after describing his mother keeping the lantern lit all night while waiting for the boat, which was a tiring and meaningful effort. He also works on the boat slowly and patiently for weeks. Together, these suggest waiting takes effort and has a purpose, which matches A. B and C read \"work\" too literally as a job, and D contradicts the respectful way the passage treats waiting."},
 {id:"b-s6",s:"science",t:"data",d:"easy",p:"ice",q:"According to Table 1, which substance has the greatest density?",c:["Liquid water at 4°C","Liquid water at 0°C","Ice at 0°C, no bubbles","Vegetable oil at 20°C"],a:0,x:"Liquid water at 4°C has a density of 1.000 g/cm³, the largest value in the table.",xl:"Compare the numbers in the density column: 1.000, 0.9998, 0.917 and 0.920. The largest is 1.000 g/cm³, for liquid water at 4°C. Choice B is a close trap, since 0.9998 is very slightly smaller than 1.000. When values are this close, compare them digit by digit after the decimal point. Science questions like this reward reading the table carefully rather than knowing outside facts."},
 {id:"b-s7",s:"science",t:"models",d:"medium",p:"ice",q:"The density of bubble-free ice in Table 1 best supports which student's explanation?",c:["Student 1, because ice with no bubbles is less dense than liquid water.","Student 1, because ice with no bubbles is denser than liquid water.","Student 2, because ice with no bubbles is less dense than liquid water.","Student 2, because air bubbles increase the density of ice."],a:0,x:"Bubble-free ice (0.917) is still less dense than liquid water (0.9998), so it floats without air, as Student 1 says.",xl:"Student 2 claims ice floats only because of trapped air, so ice with no bubbles should sink. But Table 1 shows that bubble-free ice has a density of 0.917 g/cm³, less than liquid water's 0.9998 g/cm³, so it would still float. That supports Student 1, who says ice is simply less dense than water because of its open molecular structure. Choice B gets the comparison backward, and C pairs the correct fact with the wrong student. For conflicting-viewpoint questions, check both the student and the reason, since each can be wrong separately."},
 {id:"b-s8",s:"science",t:"models",d:"medium",p:"ice",q:"Student 2 would most likely predict that a cube of bubble-free ice placed in liquid water at 0°C would:",c:["sink.","float.","dissolve immediately.","float halfway submerged."],a:0,x:"Student 2 says ice floats only because of trapped air, so ice with no bubbles would sink.",xl:"This question asks what Student 2 would predict, not what actually happens. Student 2's last sentence says that ice with no air bubbles would sink in liquid water. So by Student 2's reasoning, a bubble-free cube would sink, which is A. Choice B is what really happens according to Table 1, which is the trap: the question is about the student's model, not the data. Always answer \"would predict\" questions using only that person's stated reasoning."},
 {id:"b-s9",s:"science",t:"data",d:"hard",p:"ice",q:"Based on Table 1, if a cube of bubble-free ice were placed in vegetable oil at 20°C, it would most likely initially:",c:["float, because the ice is slightly less dense than the oil.","sink, because the ice is denser than the oil.","float, because the ice is denser than the oil.","sink, because the oil is less dense than water."],a:0,x:"Ice (0.917 g/cm³) is slightly less dense than the oil (0.920 g/cm³), so it would float.",xl:"An object floats in a liquid when it is less dense than that liquid. Table 1 gives 0.917 g/cm³ for bubble-free ice and 0.920 g/cm³ for vegetable oil, so the ice is very slightly less dense and would float. Choice B misreads the comparison, and C states the floating rule backward: denser things sink. Choice D compares the oil to water, which doesn't tell you anything about the ice. Close numbers like 0.917 and 0.920 are deliberate, so compare them carefully."},
 {id:"b-s10",s:"science",t:"design",d:"hard",p:"ice",q:"Which experiment would best test Student 2's explanation?",c:["Freeze water that has had its dissolved air removed, then see whether the ice floats in liquid water.","Measure the density of liquid water at several different temperatures.","Freeze water in containers of several different shapes.","Compare how fast ice melts in vegetable oil and in liquid water."],a:0,x:"Student 2's key claim is that air bubbles make ice float, so the best test makes ice without air and checks whether it floats.",xl:"A good test of a hypothesis changes the one factor the hypothesis depends on. Student 2's whole explanation depends on trapped air, so the best experiment removes the air and sees whether the ice still floats. If bubble-free ice floats, Student 2 is wrong; if it sinks, Student 2 is supported. B tests liquid water only, C tests container shape, and D tests melting speed, and none of those involves air bubbles. When a question asks how to test someone's idea, find the specific cause they name and change only that."}

mural:`[1] Every spring, students at Lincoln High paint a mural on the long brick wall behind the cafeteria. [2] Before anyone picks up a brush, the art club holds a vote to choose a theme. [3] Once the paint dries, a clear coating is brushed over the entire wall to protect it from rain. [4] Volunteers then sketch the winning design in chalk, square by square, and fill it in with paint over several weekends. [5] Last year's mural, a river winding through all four seasons, drew visitors from across town.`,
maps:`Passage A

For most of history, travelers found their way by studying a map before they set out and checking it along the route. That habit, some researchers argue, did more than prevent wrong turns. In studies of London taxi drivers, who must memorize thousands of streets to earn a license, scientists found that a brain region linked to spatial memory grew larger as the drivers trained. People who follow turn-by-turn directions from a phone rarely build that kind of mental picture. Ask a GPS user to sketch the route they drove that morning, and many cannot. The phone has done the remembering for them.

None of this means people should throw away their phones. But a few minutes spent looking at the whole map before a trip, noticing which way the river runs or where the highway bends, may keep sharp a skill we are in danger of losing.

Passage B

When my family moved to a new city, my father refused to use the navigation app on his phone. He had driven for forty years with a road atlas, he said, and he wasn't about to stop. Within a week he had missed my sister's soccer game, circled the same hospital parking garage three times, and arrived an hour late to his first day at a new job.

Navigation apps are easy to mock, but they solve real problems. They reroute drivers around accidents, warn of closed roads, and let a nervous new driver focus on traffic instead of street signs. For people with poor eyesight or a weak sense of direction, they can mean the difference between going out and staying home.

My father uses the app now, though he still keeps the atlas under his seat. "Just in case," he says. I suspect he likes knowing he could still find his way without it.`,
