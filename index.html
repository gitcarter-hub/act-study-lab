 {id:"b-e22",s:"english",t:"org",d:"medium",p:"mural",q:"For the sake of logic and cohesion, Sentence 3 should be placed:",c:["where it is now.", "after Sentence 1.", "after Sentence 4.", "after Sentence 5."],a:2,x:"Sentence 3 begins \"Once the paint dries,\" so it must come after Sentence 4, where the volunteers paint the design.",xl:"Placement questions are easiest when you follow the order of events and look for clue words. Sentence 3 begins \"Once the paint dries,\" so it has to come after the sentence that mentions painting, which is Sentence 4. Right now it comes before the design is even sketched, which makes no sense. Putting it after Sentence 5 would separate it from the painting step and interrupt the closing sentence about last year's mural. Circle time words like \"then,\" \"once\" and \"finally,\" since they usually tell you exactly where a sentence belongs."},
 {id:"b-e23",s:"english",t:"adddel",d:"easy",p:"mural",q:"The writer is considering adding the following sentence after Sentence 1:\n\"The cafeteria was renovated three years ago and now seats four hundred students.\"\nShould the writer make this addition?",c:["Yes, because it explains why the art club chose that wall.", "Yes, because it adds a specific number that makes the paragraph more precise.", "No, because it shifts the focus from the mural to an unrelated detail about the cafeteria.", "No, because it repeats information already given in Sentence 1."],a:2,x:"The paragraph is about how the mural is made. Details about the cafeteria's seating are off-topic.",xl:"For add/delete questions, first decide what the paragraph is about, then check whether the new sentence serves that focus. This paragraph describes how students create the mural, step by step. The cafeteria's renovation and seating don't help explain the mural, so the sentence should not be added. Choice B is a common trap: a specific number isn't helpful if it's about the wrong topic. Choice D is wrong because Sentence 1 mentions the cafeteria only as a location and says nothing about seating or renovation."},
 {id:"b-e24",s:"english",t:"purpose",d:"medium",p:"mural",q:"Suppose the writer's goal had been to explain the steps students follow to create the mural. Would this paragraph accomplish that goal?",c:["Yes, because it describes choosing a theme, sketching, painting and protecting the mural.", "Yes, because it describes last year's design in detail.", "No, because it focuses mainly on how popular the mural has become.", "No, because it never explains who does the painting."],a:0,x:"The paragraph walks through the process: vote on a theme, sketch in chalk, paint, then add a protective coating.",xl:"\"Writer's goal\" questions ask whether the passage as a whole does what the goal describes, and the reason matters as much as the yes or no. Four of the five sentences describe a step in making the mural: the vote, the chalk sketch, the painting and the clear coating. That is exactly an explanation of the steps, so the answer is Yes. Choice B gives the wrong reason, since one sentence about last year's design isn't a set of steps. Choice D is false, because Sentence 4 says volunteers do the painting."},
 {id:"b-e25",s:"english",t:"punct",d:"medium",q:"The recipe calls for only three [[ingredients: flour,]] water, and salt.",c:["NO CHANGE", "ingredients; flour,", "ingredients, flour,", "ingredients flour,"],a:0,x:"A colon correctly introduces a list after a complete sentence: \"The recipe calls for only three ingredients.\"",xl:"A colon can introduce a list, but only when the words before it form a complete sentence. \"The recipe calls for only three ingredients\" is complete, so the colon works and NO CHANGE is right. A semicolon (B) must join two complete sentences, and \"flour, water, and salt\" is not a sentence. A comma (C) makes it look like a list of four things, with \"ingredients\" as the first item. Leaving out punctuation (D) runs the list straight into the sentence with nothing to introduce it."},
 {id:"b-e26",s:"english",t:"punct",d:"easy",q:"Every bird in the flock constantly adjusts [[it's]] position to save energy during the long flight.",c:["NO CHANGE", "its", "its'", "their"],a:1,x:"\"It's\" means \"it is.\" The possessive form, meaning \"belonging to it,\" is \"its\" with no apostrophe.",xl:"\"It's\" is always a contraction of \"it is\" or \"it has,\" so test it by substituting: \"adjusts it is position\" makes no sense. The possessive is \"its,\" with no apostrophe, just like \"his\" and \"hers.\" \"Its'\" (C) is never correct in English. \"Their\" (D) is plural, but the subject is \"every bird,\" which is singular. Whenever you see \"it's\" underlined, do the \"it is\" substitution test."},
 {id:"b-e27",s:"english",t:"sent",d:"medium",q:"The trail was steep and [[rocky; making]] the hike much slower than we expected.",c:["NO CHANGE", "rocky, making", "rocky. Making", "rocky; it making"],a:1,x:"\"Making the hike much slower\" isn't a complete sentence, so it attaches with a comma, not a semicolon or period.",xl:"A semicolon works like a period: both sides must be complete sentences. \"Making the hike much slower than we expected\" has no subject and no main verb, so it can't stand on its own after a semicolon (A) or a period (C). A comma correctly attaches this descriptive phrase to the main sentence. Choice D adds \"it,\" but \"it making\" still isn't a proper verb, so it's still not a complete sentence. When a phrase starts with an -ing word, it usually attaches with a comma."},
 {id:"b-e28",s:"english",t:"trans",d:"easy",q:"The new bus route was supposed to save riders time. [[Therefore,]] the average commute grew by five minutes during the route's first month.",c:["NO CHANGE", "However,", "For example,", "Similarly,"],a:1,x:"The second sentence says the opposite of what was expected, so it needs a contrast word like \"However.\"",xl:"To choose a transition, decide how the two sentences relate. The first says the route was supposed to save time, and the second says commutes got longer, which is the opposite of what was expected. That calls for a contrast transition, and \"However\" is the only one offered. \"Therefore\" (A) would mean the longer commute was caused by the plan to save time, which is illogical. \"For example\" (C) and \"Similarly\" (D) signal ideas that support or match each other, not ideas that conflict."},
 {id:"b-e29",s:"english",t:"concise",d:"easy",q:"[[In my personal opinion, I think]] the school day should start an hour later.",c:["NO CHANGE", "In my opinion, I personally think", "I think", "Personally, in my opinion, I believe"],a:2,x:"\"In my opinion\" and \"I think\" say the same thing. \"I think\" alone is shortest and loses no meaning.",xl:"Concision questions reward the shortest choice that keeps the meaning and is grammatically correct. \"In my personal opinion\" and \"I think\" both tell the reader this is the writer's view, so using both is redundant, and \"personal\" adds a third repetition. Choices B and D just rearrange the same repeated words. \"I think\" says everything the longer versions say. On the ACT, when every choice means the same thing, the shortest correct one is usually right."},
 {id:"b-e30",s:"english",t:"word",d:"hard",q:"The museum guide [[implied]] that the painting might be a forgery, though she never said so directly.",c:["NO CHANGE", "inferred", "stated", "declared"],a:0,x:"To \"imply\" is to suggest something without saying it outright, which matches \"never said so directly.\"",xl:"\"Imply\" and \"infer\" are easy to mix up. The speaker implies (hints at) something, and the listener infers (figures it out). The guide is the speaker, and the sentence says she never said it directly, so \"implied\" is exactly right and NO CHANGE is correct. \"Inferred\" (B) would mean the guide figured something out from clues, which doesn't fit. \"Stated\" (C) and \"declared\" (D) both mean saying something directly, which contradicts the end of the sentence. Always check the rest of the sentence for clues that rule out a word's meaning."},
 {id:"b-e31",s:"english",t:"usage",d:"medium",q:"The teacher [[who's]] class raised the most money for the food drive was honored at the assembly.",c:["NO CHANGE", "whose", "who", "whom"],a:1,x:"The class belongs to the teacher, so the possessive \"whose\" is needed. \"Who's\" means \"who is.\"",xl:"\"Who's\" is a contraction of \"who is\" or \"who has\": \"the teacher who is class raised\" makes no sense. The sentence needs to show that the class belongs to the teacher, and the possessive form is \"whose.\" \"Who\" (C) and \"whom\" (D) aren't possessive, so they leave \"class\" without a connection to the teacher. This works just like \"it's\" vs. \"its\": the version with an apostrophe is always a contraction. Try expanding the contraction, and if it sounds wrong, choose the possessive."},
 {id:"b-m25",s:"math",t:"ies",d:"medium",q:"A jacket regularly costs $80. It is on sale for 25% off, and then 5% sales tax is added to the sale price. What is the total cost?",c:["$60.00", "$63.00", "$64.00", "$84.00"],a:1,x:"Sale price: $80 × 0.75 = $60. With tax: $60 × 1.05 = $63.",xl:"Work in the order the problem gives. First take 25% off: 25% of $80 is $20, so the sale price is $60 (or multiply $80 × 0.75). Then add 5% tax to the sale price: 5% of $60 is $3, giving $63. Choice C comes from subtracting 25% − 5% = 20% from $80, but the tax is calculated on the new price, not the original. Choice A forgets the tax and D forgets the discount."},
 {id:"b-m26",s:"math",t:"ies",d:"easy",q:"A car travels 150 miles in 2.5 hours. At the same rate, how far will it travel in 4 hours?",c:["60 miles", "150 miles", "200 miles", "240 miles"],a:3,x:"Rate = 150 ÷ 2.5 = 60 miles per hour, so in 4 hours it goes 60 × 4 = 240 miles.",xl:"First find the rate: distance divided by time is 150 ÷ 2.5 = 60 miles per hour. Then multiply by the new time: 60 × 4 = 240 miles. Choice A is the rate itself, a common trap when you stop one step early. You can also set up a proportion: 150/2.5 = x/4, so x = 240. Always reread the question to check you've answered what it asked: here, distance, not speed."},
 {id:"b-m27",s:"math",t:"ies",d:"easy",q:"The ratio of boys to girls in a class of 40 students is 3 : 5. How many girls are in the class?",c:["15", "24", "25", "30"],a:2,x:"3 + 5 = 8 parts, so each part is 40 ÷ 8 = 5 students. Girls = 5 × 5 = 25.",xl:"A ratio of 3 : 5 means the class splits into 3 + 5 = 8 equal parts. Each part is 40 ÷ 8 = 5 students. The girls get 5 parts, so there are 5 × 5 = 25 girls (and 15 boys). Choice A is the number of boys, so watch which group the question asks about. Choice B comes from 3/5 of 40, which treats the ratio as a fraction of the whole class."},
 {id:"b-m28",s:"math",t:"alg",d:"medium",q:"If x + y = 10 and x − y = 4, what is the value of xy?",c:["21", "24", "28", "40"],a:0,x:"Add the equations: 2x = 14, so x = 7. Then y = 3, and xy = 21.",xl:"When one equation has +y and the other has −y, adding them cancels y: (x + y) + (x − y) = 10 + 4, so 2x = 14 and x = 7. Substitute into x + y = 10 to get y = 3. The question asks for the product xy, which is 7 × 3 = 21. Choice D is 10 × 4, multiplying the right sides, which isn't the same thing. Always check: 7 + 3 = 10 and 7 − 3 = 4, so the values work."},
 {id:"b-m29",s:"math",t:"alg",d:"medium",q:"Which of the following is the solution set of 3 − 2x > 11?",c:["x > −4", "x < −4", "x > 4", "x < 4"],a:1,x:"Subtract 3: −2x > 8. Dividing by −2 flips the sign: x < −4.",xl:"Solve it like an equation, with one extra rule. Subtract 3 from both sides to get −2x > 8. Now divide both sides by −2, and because you're dividing by a negative number, the inequality sign flips: x < −4. Choice A is what you get if you forget to flip the sign, which is by far the most common mistake. Check with a number: x = −5 gives 3 + 10 = 13, which is greater than 11, so it works."},
 {id:"b-m30",s:"math",t:"func",d:"easy",q:"If f(x) = 2x² − 3, what is f(−2)?",c:["−11", "−5", "5", "13"],a:2,x:"f(−2) = 2(−2)² − 3 = 2(4) − 3 = 5.",xl:"Substitute −2 for x and follow the order of operations: exponents come before multiplication. (−2)² = 4, because a negative times a negative is positive. Then 2 × 4 = 8, and 8 − 3 = 5. Choice A comes from treating (−2)² as −4. Choice D comes from squaring 2x as a whole, (2 × −2)² = 16, then subtracting 3. Put negative numbers in parentheses when you substitute so the sign is squared too."},
 {id:"b-m31",s:"math",t:"func",d:"medium",q:"What is the vertex of the parabola y = (x − 3)² + 2?",c:["(−3, 2)", "(3, 2)", "(3, −2)", "(2, 3)"],a:1,x:"In vertex form y = (x − h)² + k, the vertex is (h, k). Here h = 3 and k = 2.",xl:"This equation is in vertex form, y = (x − h)² + k, where the vertex is (h, k). Matching it up, h = 3 and k = 2, so the vertex is (3, 2). The trap is choice A: the minus sign inside the parentheses means h is positive 3, not −3. You can check by plugging in x = 3: y = 0 + 2 = 2, and since a square is never negative, 2 is the lowest y-value, so (3, 2) is the bottom of the parabola."},
 {id:"b-m32",s:"math",t:"geo",d:"medium",q:"A circle has a circumference of 10π. What is its area?",c:["5π", "10π", "20π", "25π"],a:3,x:"C = 2πr = 10π, so r = 5. Area = πr² = 25π.",xl:"Start with the circumference formula: C = 2πr. Setting 2πr = 10π gives r = 5. Then use the area formula: A = πr² = π(5)² = 25π. Choice A stops at the radius, and B just repeats the circumference. A common error is to use the diameter (10) in the area formula, which gives 100π. Write both circle formulas at the top of your work so you don't mix them up."},
 {id:"b-m33",s:"math",t:"num",d:"easy",q:"What is the value of (2³)(2⁴) ÷ 2⁵?",c:["2", "4", "16", "128"],a:1,x:"Multiply by adding exponents and divide by subtracting: 2^(3 + 4 − 5) = 2² = 4.",xl:"With the same base, multiplying means adding exponents and dividing means subtracting them. So (2³)(2⁴) = 2⁷, and 2⁷ ÷ 2⁵ = 2². That's 4. Choice D, 128, is 2⁷, from forgetting to divide. You can check by computing directly: 8 × 16 = 128, and 128 ÷ 32 = 4."},
 {id:"b-m34",s:"math",t:"trig",d:"medium",q:"In right triangle ABC, angle C is the right angle and sin A = 3/5. What is tan A?",c:["3/4", "4/5", "4/3", "5/3"],a:0,x:"sin A = 3/5 means opposite = 3 and hypotenuse = 5, so adjacent = 4 and tan A = 3/4.",xl:"Remember SOH CAH TOA: sine is opposite over hypotenuse, so the side opposite A is 3 and the hypotenuse is 5. By the Pythagorean theorem (or the 3-4-5 triangle you should know by heart), the adjacent side is 4. Tangent is opposite over adjacent, so tan A = 3/4. Choice B is cos A, and C is the tangent of the other acute angle, B. Sketching the triangle and labeling sides takes 10 seconds and prevents these mix-ups."},
 {id:"b-m35",s:"math",t:"stat",d:"medium",q:"The mean of five numbers is 12. Four of the numbers are 10, 11, 14 and 15. What is the fifth number?",c:["8", "10", "12", "13"],a:1,x:"The five numbers must total 5 × 12 = 60. The four given add to 50, so the fifth is 10.",xl:"Mean = sum ÷ count, so the sum of all five numbers is 5 × 12 = 60. The four known numbers add up to 10 + 11 + 14 + 15 = 50. That leaves 60 − 50 = 10 for the fifth number. Choice C assumes the missing number must equal the mean, which is only true if the others already balance out. For any \"missing number\" mean problem, turn the mean into a total first."},
 {id:"b-m36",s:"math",t:"stat",d:"hard",q:"A bag holds 4 red marbles and 6 blue marbles. Two marbles are drawn at random without replacement. What is the probability that both are red?",c:["2/15", "4/25", "1/5", "2/5"],a:0,x:"First draw: 4/10. Second draw (3 red left out of 9): 3/9. Multiply: 4/10 × 3/9 = 12/90 = 2/15.",xl:"\"Without replacement\" means the first marble stays out, so the second draw has fewer marbles. The chance the first is red is 4/10. If it was red, 3 red marbles remain out of 9, so the chance the second is also red is 3/9. Multiply the two: (4/10)(3/9) = 12/90 = 2/15. Choice B, 4/25, comes from (4/10)(4/10), which would be correct only with replacement. Choice D is just the chance of one red marble."},
 {id:"b-m37",s:"math",t:"geo",d:"hard",q:"What is the distance between the points (1, 2) and (7, 10) in the coordinate plane?",c:["8", "10", "14", "100"],a:1,x:"The horizontal change is 6 and the vertical change is 8, so the distance is √(6² + 8²) = √100 = 10.",xl:"The distance formula is the Pythagorean theorem in disguise. The horizontal change is 7 − 1 = 6, and the vertical change is 10 − 2 = 8. Those are the legs of a right triangle, so the distance is √(6² + 8²) = √(36 + 64) = √100 = 10. Choice C adds the legs (6 + 8), and D forgets the square root. Spotting a 3-4-5 triangle (here doubled to 6-8-10) can save you the calculation."},
 {id:"b-r11",s:"reading",t:"main",d:"medium",p:"maps",q:"The main purpose of Passage A is to:",c:["suggest that relying only on turn-by-turn directions may weaken a navigation skill worth keeping.", "argue that people should stop using navigation apps entirely.", "explain how London taxi drivers earn their licenses.", "describe the history of maps from ancient times to today."],a:0,x:"Passage A presents evidence that maps build spatial memory, then suggests studying the map before trips, without giving up phones.",xl:"Main-purpose questions need an answer that covers the whole passage, not just one part. Passage A uses the taxi-driver studies and the sketching example to show that maps build a mental picture that phones don't. Then it says people shouldn't throw away their phones but should glance at the whole map to keep the skill sharp. Choice B is too extreme, since the passage directly says not to give up phones. Choice C is just one supporting detail, and D describes something the passage barely touches."},
 {id:"b-r12",s:"reading",t:"vocab",d:"medium",p:"maps",q:"As it is used in the last paragraph of Passage A, the word \"sharp\" most nearly means:",c:["pointed.", "strong and ready to use.", "sudden.", "harsh."],a:1,x:"Keeping a skill \"sharp\" means keeping it in good working condition, so \"strong and ready to use\" fits.",xl:"Words-in-context questions test what a word means in this sentence, not its most common meaning. The passage says glancing at a map \"may keep sharp a skill we are in danger of losing,\" so \"sharp\" describes a skill that is well practiced instead of fading. \"Pointed\" (A) is the everyday meaning, for knives and pencils, but skills don't have points. \"Sudden\" (C) fits phrases like \"a sharp turn,\" and \"harsh\" (D) fits \"a sharp tone.\" Try plugging each choice into the sentence and see which one keeps the meaning."},
 {id:"b-r13",s:"reading",t:"detail",d:"easy",p:"maps",q:"According to Passage B, during his first week in the new city, the narrator's father:",c:["got lost driving to the airport.", "arrived an hour late to his first day at a new job.", "bought a new road atlas.", "asked his daughter for directions."],a:1,x:"The passage lists three mishaps, including arriving \"an hour late to his first day at a new job.\"",xl:"Detail questions are answered directly in the text, so go back and find the line. Passage B says that within a week the father \"missed my sister's soccer game, circled the same hospital parking garage three times, and arrived an hour late to his first day at a new job.\" Choice B matches the last item exactly. The passage never mentions an airport, a new atlas, or asking for directions. Wrong choices on detail questions often sound reasonable, so always confirm the answer in the passage."},
 {id:"b-r14",s:"reading",t:"infer",d:"medium",p:"maps",q:"The last paragraph of Passage B most strongly suggests that the father:",c:["still takes pride in his ability to navigate without technology.", "plans to stop using the navigation app soon.", "regrets ever having learned to read a map.", "believes the app is usually wrong."],a:0,x:"He keeps the atlas \"just in case,\" and the narrator suspects he likes knowing he could still find his way without the app.",xl:"Inference questions ask what the passage strongly suggests, so the answer still needs clear support in the text. The father uses the app now but keeps the atlas under his seat, and the narrator says, \"I suspect he likes knowing he could still find his way without it.\" That points to pride in his old skill. Choice B contradicts \"My father uses the app now,\" and nothing supports C or D. Pick the inference that needs the smallest leap from what's actually written."},
 {id:"b-r15",s:"reading",t:"integ",d:"medium",p:"maps",q:"Both passages agree that navigation apps:",c:["are useful in at least some situations.", "cause the brain to shrink.", "are less reliable than paper maps.", "should be used only by new drivers."],a:0,x:"Passage A says not to \"throw away\" phones, and Passage B lists problems apps solve, so both see some value in them.",xl:"For \"both passages agree\" questions, each part of the answer must be supported by both passages. Passage A says, \"None of this means people should throw away their phones,\" and Passage B says apps \"solve real problems\" like rerouting around accidents. So both authors accept that apps are useful at least some of the time. Choice B goes far beyond Passage A, which talks about a brain region growing in taxi drivers, not shrinking in app users. Choices C and D aren't claimed by either passage."},
 {id:"b-r16",s:"reading",t:"integ",d:"medium",p:"maps",q:"Which statement best describes a difference in how the two passages support their points?",c:["Passage A relies mainly on research and general observations, while Passage B relies mainly on a personal family story.", "Passage A relies mainly on a personal story, while Passage B relies mainly on scientific studies.", "Passage A uses statistics, while Passage B uses no examples at all.", "Both passages rely mainly on interviews with experts."],a:0,x:"Passage A cites studies of taxi drivers, while Passage B is built around the narrator's father.",xl:"This question is about the type of evidence each author uses. Passage A cites studies of London taxi drivers and makes a general observation about GPS users, so it relies on research. Passage B is told in the first person and centers on the narrator's father's experiences, a personal story. Choice B reverses the two passages, a common trap on comparison questions. Neither passage quotes expert interviews (D), and Passage B is full of examples (C)."},
 {id:"b-r17",s:"reading",t:"integ",d:"hard",p:"maps",q:"The father's habit of keeping the road atlas \"just in case\" (Passage B) most closely reflects which idea from Passage A?",c:["People can keep using their phones while still preserving their map-reading skills.", "Taxi drivers must memorize thousands of streets.", "Most GPS users cannot sketch the route they drove that morning.", "Maps were invented to prevent wrong turns."],a:0,x:"Passage A recommends keeping phones but staying in touch with maps, which is what the father does by using the app and keeping the atlas.",xl:"To connect the passages, describe the father's behavior in general terms first: he uses the app but holds on to his old map skills. Passage A's conclusion recommends almost exactly that: don't throw away your phone, but take a few minutes with the map to keep the skill sharp. Choices B and C are real details from Passage A, but they don't match what the father does. Choice D isn't stated in Passage A at all. On integration questions, match the idea, not just shared words like \"map.\""},
 {id:"b-s11",s:"science",t:"data",d:"easy",p:"pend",q:"In Experiment 1, what was the period of the pendulum with a 100 cm string?",c:["1.42 s", "2.00 s", "2.01 s", "2.46 s"],a:2,x:"The Experiment 1 table lists a period of 2.01 s for a length of 100 cm.",xl:"Find the right table first. Experiment 1 is the one where length was varied, and the 100 cm row shows a period of 2.01 s. Choice B, 2.00 s, appears in Experiment 2, where the 100 g bob was tested, so it's a trap for students who read the wrong table. Choices A and D are the periods for 50 cm and 150 cm. On Science questions, check which experiment the question names before reading any numbers."},
 {id:"b-s12",s:"science",t:"data",d:"hard",p:"pend",q:"Based on Experiment 1, the period of a pendulum with a 300 cm string, released under the same conditions, would most likely be closest to:",c:["2.9 s", "3.5 s", "4.3 s", "5.7 s"],a:1,x:"The period keeps rising with length, but by less each time (about 0.4 s per 50 cm near 200 cm), so 300 cm gives about 3.5 s.",xl:"Extending a trend means looking at how the values change, not just which way they go. From 150 to 200 cm, the period rose from 2.46 to 2.84 s, about 0.38 s, and the increases are getting smaller each time. Adding two more steps of a little under 0.38 s each takes you from 2.84 s to about 3.5 s at 300 cm. Choice A barely increases, while C and D assume the period grows as fast as or faster than length. You can also notice that 4 times the length (25 to 100 cm) doubles the period, so the period grows much more slowly than the length."},
 {id:"b-s13",s:"science",t:"data",d:"hard",p:"pend",q:"According to Experiment 1, when the string length was doubled from 50 cm to 100 cm, the period:",c:["stayed about the same.", "increased by a factor of about 1.4.", "doubled.", "quadrupled."],a:1,x:"The period went from 1.42 s to 2.01 s, and 2.01 ÷ 1.42 ≈ 1.4.",xl:"To find a factor, divide the new value by the old one: 2.01 ÷ 1.42 is about 1.4. So doubling the length did not double the period (C), which would have required about 2.84 s. In fact, 2.84 s is the period at 200 cm, so you need four times the length to double the period. Choice A is wrong because 1.42 to 2.01 is a clear increase. Questions about \"how much\" a value changes usually need a quick division, not just a comparison."},
 {id:"b-s14",s:"science",t:"design",d:"medium",p:"pend",q:"Why did the students time 10 full swings and divide by 10, rather than timing a single swing?",c:["To reduce the effect of small errors in starting and stopping the stopwatch", "To make the pendulum swing faster", "To keep the release angle the same in every trial", "To increase the period of the pendulum"],a:0,x:"Timing many swings spreads any stopwatch reaction error over 10 swings, so each period is more accurate.",xl:"Human reaction time adds an error of a fraction of a second every time you start or stop a stopwatch. A single swing lasts only 1 to 3 seconds, so that error would be a large part of the measurement. Timing 10 swings makes the total much longer while the reaction error stays about the same size, so dividing by 10 shrinks the error per swing. The method doesn't change how the pendulum swings (B, D), and it has nothing to do with the release angle (C). Repeating or extending measurements to reduce error is a common ACT design idea."},
 {id:"b-s15",s:"science",t:"design",d:"easy",p:"pend",q:"Which two variables were held constant in Experiment 2?",c:["Mass and string length", "String length and release angle", "Mass and release angle", "Period and mass"],a:1,x:"Experiment 2 kept the length at 100 cm and the release angle at 10° while changing the mass.",xl:"In a controlled experiment, one variable is changed on purpose and the others are kept the same. Experiment 2's description says \"Length 100 cm, released from 10°. Mass varied,\" so length and angle were held constant. Mass was the variable being changed, which rules out A, C and D. Period is what was measured (the result), so it can't be held constant either."},
 {id:"b-s16",s:"science",t:"models",d:"medium",p:"pend",q:"The results of Experiment 2 support the prediction of:",c:["Student A only, because the period increased as mass increased.", "Student B, because changing the mass had almost no effect on the period.", "both students, because the period changed slightly.", "neither student, because the period decreased as mass increased."],a:1,x:"Going from 50 g to 400 g, the period stayed at about 2.0 s, so mass didn't matter, as Student B predicted.",xl:"Student A predicted that heavier bobs would have longer periods, and Student B predicted that mass wouldn't matter. In Experiment 2, the mass increased eightfold, from 50 g to 400 g, but the period stayed between 2.00 and 2.01 s. A change of 0.01 s is within measurement error, so the results show no real effect of mass, which supports Student B. Choice A misreads the table, and choice D is false because the period didn't consistently decrease. Treat tiny wobbles in data as \"no change\" unless the values follow a clear trend."},
 {id:"b-s17",s:"science",t:"models",d:"hard",p:"pend",q:"Do the results of Experiment 3 fully support Student B's prediction?",c:["Yes, because the period was the same at every release angle.", "Yes, because release angle is a type of length.", "No, because the period increased noticeably at larger release angles.", "No, because the period decreased at larger release angles."],a:2,x:"Student B said only length matters, but at 60° the period rose to 2.15 s, so release angle had some effect.",xl:"Student B claimed that only the string length affects the period. In Experiment 3 the length stayed at 100 cm, yet the period rose from 2.01 s at 10° to 2.15 s at 60°. That increase follows a steady trend, so it isn't just measurement error, and it shows release angle matters too, at least for large angles. Choice A misreads the table, and D gets the direction wrong. Watch for the word \"only\" in a hypothesis: one counterexample is enough to show it isn't fully supported."}
);

/* Detailed explanations shown after a wrong answer (3-5 sentences) */
const XL = {
"b-e1":"The phrase \"each of whom works with recycled materials\" adds extra information about the three artists, so it is set off from the main clause with a comma. A semicolon (B) can only join two complete sentences, and \"each of whom works with recycled materials\" cannot stand alone as a sentence. Choice C puts a comma between the verb \"features\" and its object, which the ACT never allows. Choice D breaks up \"each of whom,\" which works as a single unit. When the original already follows the comma rules, NO CHANGE is a perfectly good answer.",
"b-e2":"Both \"Maya had practiced the piece for weeks\" and \"she still felt nervous\" are complete sentences. Joining two complete sentences with only a comma creates a comma splice, one of the ACT's favorite errors. You can fix a splice with a period, a semicolon, or a comma plus a FANBOYS conjunction (for, and, nor, but, or, yet, so). \"But\" works here because feeling nervous after weeks of practice is a contrast. Choices C and D add commas that break up the sentence without fixing the splice.",
"b-e3":"\"All twenty of the students\" tells you there are many students, so you need the plural possessive. To make a regular plural noun possessive, write the plural first (students) and then add an apostrophe after the s: students'. \"Student's\" (B) would mean the projects belong to one student, which contradicts \"all twenty.\" Choice C drops the apostrophe, so nothing shows ownership. Choice D wrongly puts the apostrophe on \"projects,\" as if the projects owned something.",
"b-e4":"The ACT often puts a plural noun right before the verb to trick your ear. The real subject here is \"collection,\" and \"of rare coins\" is just a prepositional phrase describing it. Cross out the phrase and read \"The collection … is stored,\" which is clearly singular. \"Are,\" \"were\" and \"have been\" are all plural forms, so they don't agree with \"collection.\" A good habit: whenever a verb is underlined, find its subject first and ignore phrases that begin with of, in, with and similar words.",
"b-e5":"The phrase \"Last summer\" places the action firmly in the past, so the verb needs to be past tense. \"Built\" is the simple past form of \"build.\" \"Builds\" (A) is present tense, \"will build\" (B) is future, and \"is building\" (D) describes something happening now. On verb-tense questions, look for time clues like dates, \"yesterday\" or \"next year,\" and check the tense of the verbs in nearby sentences.",
"b-e6":"Transition questions test the logical relationship between two ideas. The first sentence says the trail is steep and rocky, which suggests it's hard. The second says thousands of people complete it anyway, which is the opposite of what you'd expect, so the relationship is contrast. \"Therefore\" signals cause and effect, \"Similarly\" signals a comparison and \"For example\" signals an illustration, so none of them fits. \"Nevertheless\" means \"despite that,\" which matches the contrast exactly.",
"b-e7":"\"Later\" already means \"at a future time,\" so adding \"in the future\" or \"a later time\" says the same thing twice. The ACT treats redundancy as an error even when the sentence is grammatically correct. Choices A, B and C all repeat the idea of the future in some way. \"Until later\" keeps the full meaning in the fewest words. When every choice is grammatical, the shortest one that keeps the meaning is very often correct.",
"b-e8":"For add-or-delete questions, first decide what the paragraph or essay is about, then check whether the new sentence supports that focus. This essay is about the history of the Millbrook library: when it opened, its first books and how residents funded a new building. A cousin's preference for e-books has nothing to do with that history, so the sentence should not be added. Choice A sounds reasonable, but nothing in the sentence shows the library itself changing. Always choose the answer whose reason is actually true about the passage.",
"b-e9":"The rest of the sentence (\"earning praise from researchers worldwide\") is formal and serious, so the underlined words need to match that tone. \"Super cool and stuff,\" \"kind of awesome\" and \"pretty neat\" are casual, conversational phrases that don't belong in an academic essay. \"Groundbreaking\" is formal, and its meaning (new and important) also explains why researchers would praise the findings. On tone questions, decide whether the passage is formal or casual, then pick the word that fits both the tone and the meaning.",
"b-e10":"\"Did the essay accomplish this goal?\" questions ask you to compare the goal to what the essay actually does. This essay's second paragraph shows residents holding bake sales, car washes and an auction to pay for a new library building, which is a community supporting a local institution. So the answer is Yes, and the reason in A is accurate. B is wrong because a list of books is not community support. C and D describe the essay inaccurately, since the post office is only mentioned briefly and the essay covers far more than the founding date.",
"b-e11":"A colon can introduce a list, but only when the words before it form a complete sentence. \"The recipe calls for only three ingredients\" is complete, so the colon before \"flour, sugar, and butter\" is correct. A semicolon (B) needs a complete sentence on both sides, and \"flour, sugar, and butter\" is not a sentence. Choice C moves the colon to the wrong spot, splitting the list itself. Choice D both removes the needed punctuation and adds a semicolon inside the list.",
"b-m1":"Apply each change in order. First take 25% off: $80 × 0.75 = $60 (or $80 − $20). Then add 8% tax to the sale price, not the original price: $60 × 1.08 = $64.80. A common mistake is applying the tax to $80, which gives $86.40, or subtracting 25% and 8% together, which gives $58.40. Read percent problems carefully to see which amount each percent applies to.",
"b-m2":"To solve, get all the x-terms on one side and the numbers on the other. Subtract 2x from both sides to get x − 7 = 5. Then add 7 to both sides to get x = 12. Choice −12 comes from a sign error, and ±2 comes from combining the wrong terms. You can always check by plugging in: 3(12) − 7 = 29 and 2(12) + 5 = 29, so the answer works.",
"b-m3":"When two equations have +y and −y, adding them cancels y. (x + y) + (x − y) = 10 + 4 gives 2x = 14, so x = 7. Substituting back into x + y = 10 gives y = 3. The question asks for xy, the product, which is 7 × 3 = 21. A common trap is stopping after finding x, so always reread what the question actually asks for.",
"b-m4":"Substitute −2 for every x and use parentheses so the negative signs stay correct. (−2)² = 4, so 2(4) = 8. Then −3(−2) = +6, because a negative times a negative is positive. Adding the pieces gives 8 + 6 + 1 = 15. The most common mistakes are treating (−2)² as −4 or getting −6 instead of +6, which leads to choices like −1 or 3.",
"b-m5":"The legs of a right triangle are perpendicular, so one leg works as the base and the other as the height. The area of a triangle is ½ × base × height = ½ × 6 × 8 = 24. Choice 48 forgets the ½, which is the most common mistake on triangle area. Choice 10 is the hypotenuse (a 6-8-10 triangle, a multiple of 3-4-5), not the area. Choice 30 doesn't come from a correct formula.",
"b-m6":"Start from the area to find the radius: πr² = 49π means r² = 49, so r = 7. The circumference is 2πr = 2π(7) = 14π. Choice 7π uses πr instead of 2πr, and 49π just repeats the area. Choice 98π doubles the area instead of using the radius. On circle problems, finding r first almost always unlocks everything else.",
"b-m7":"The mean equals the sum divided by the count, so the sum equals the mean times the count. Five numbers with a mean of 12 add up to 5 × 12 = 60. The four known numbers add to 10 + 14 + 9 + 15 = 48. The missing number must be 60 − 48 = 12. This \"find the total first\" approach works on almost every missing-value average question on the ACT.",
"b-m8":"There are 4 + 6 + 5 = 15 marbles in total. \"Not blue\" means red or green, which is 4 + 5 = 9 marbles. The probability is 9/15, which simplifies to 3/5. Choice 2/5 is the probability that the marble IS blue, a classic trap when a question includes the word NOT. You can also use 1 − P(blue) = 1 − 6/15 = 9/15.",
"b-m9":"When you raise a power to a power, multiply the exponents, and the coefficient gets raised too. So (2x³)² = 2² · x⁶ = 4x⁶. When you multiply powers with the same base, add the exponents: x⁶ · x⁴ = x¹⁰. That gives 4x¹⁰. Choice 2x¹⁰ forgets to square the 2, 4x⁹ comes from an addition error, and 4x²⁴ multiplies the exponents when they should be added.",
"b-m10":"Remember SOH-CAH-TOA: tangent is opposite over adjacent. You know the opposite side (5) and the hypotenuse (13), so use the Pythagorean theorem to find the adjacent side: √(13² − 5²) = √144 = 12. Then tan θ = 5/12. Choice 5/13 is sin θ, 12/13 is cos θ, and 12/5 flips the ratio. Recognizing the 5-12-13 triangle can save you time.",
"b-m11":"Slope is the change in y divided by the change in x: (y₂ − y₁)/(x₂ − x₁). Here that's (11 − 3)/(6 − 2) = 8/4 = 2. Choice 1/2 puts x over y, which is the most common slope mistake. Choices 4 and 8 use only the change in x or only the change in y. Keep the points in the same order in both the top and the bottom.",
"b-m12":"First find the unit rate: 150 miles ÷ 2.5 hours = 60 miles per hour. At 60 miles per hour, 4 hours of driving covers 60 × 4 = 240 miles. You could also set up a proportion: 150/2.5 = x/4, which gives x = 240. Choice 375 comes from multiplying 150 by 2.5, and the other choices come from guessing instead of computing the rate.",
"b-r1":"Main-idea questions want the answer that covers the whole passage, not just one part of it. This passage describes how the rooftop program grew, explains why supporters think city bees thrive, presents Dr. Pike's criticism and ends with Delgado's response. Only A includes both the program's growth and the debate. B and D describe topics the passage never covers. C is wrong because the passage says some rural areas offer bees fewer flowers, which is the opposite of claiming farms are better.",
"b-r2":"Detail questions are answered directly in the text, so go back and find the line. Paragraph 2 says parks, street trees and balcony gardens \"bloom at different times,\" giving bees nectar from early spring to late fall. That matches B almost word for word. The passage never mentions rooftop temperatures, predators or sugar water, so A, C and D bring in outside ideas. On the ACT, an answer that sounds true in real life but isn't in the passage is wrong.",
"b-r3":"An inference has to be strongly supported by the text, even if it isn't stated outright. The passage says Delgado \"does not dismiss the concern\" and then describes a new rule requiring native wildflowers, a direct response to Pike's point about wild bees. That shows she thinks the concern is worth acting on. A contradicts \"does not dismiss,\" and nothing suggests she had never heard the concern (C) or thought it applied only to rural areas (D).",
"b-r4":"Words-in-context questions test the meaning of a word in this specific sentence, not its most common meaning. To \"dismiss\" can mean to fire someone or let a class go, but those don't make sense for a concern. The sentence says Delgado does not dismiss Pike's concern, and then she takes action on it, so \"dismiss\" here means to ignore or disregard. Try replacing the word with each choice: \"Delgado does not disregard the concern\" keeps the meaning.",
"b-r5":"Questions about why an author includes a comparison want the job it does in the argument. Pike compares adding honeybees to opening another restaurant in a neighborhood that already has plenty: more diners competing for the same food means someone goes hungry. That illustrates his point that honeybees may take flowers that wild bees need. B, C and D take the restaurant comparison too literally or tie it to the wrong part of the passage.",
"b-s1":"Find the column for percent germinated and look for the largest number. The values are 12, 46, 78, 90, 84 and 40, so the highest is 90%, at 25°C. Choice 30°C is a close trap because 84% is high, but it is still lower than 90%. Choice 35°C may tempt you if you assume hotter always means more germination, but the data show the opposite above 25°C.",
"b-s2":"Follow the numbers from the coldest temperature to the hottest: 12 → 46 → 78 → 90 → 84 → 40. Germination rises up to 25°C, then falls at 30°C and 35°C. That pattern is \"increased, then decreased.\" Choice A would require every value to be bigger than the one before, which fails after 25°C. Trend questions reward reading the whole table, not just the first and last values.",
"b-s3":"For a value the students didn't test, look at the two closest tested values on either side. 22°C falls between 20°C (78%) and 25°C (90%). Because the data rise steadily through that range, the result at 22°C should land between 78% and 90%. Choices A and B are too low (those values match colder temperatures), and D goes above the highest value anywhere in the data.",
"b-s4":"The variable the scientists change on purpose is the independent variable. In this study, every group had 50 radish seeds, damp paper towels, darkness and 5 days. Only the temperature differed from group to group, so temperature is what was intentionally changed. Seed number, seed type and number of days were held constant (controlled) so they couldn't affect the results. The percent germinated is the dependent variable, the result that gets measured.",
"b-s5":"To test a claim against data, check whether the claim holds across the entire range. The claim says warmer temperatures always lead to more germination. That's true from 10°C to 25°C, but germination drops to 84% at 30°C and 40% at 35°C, so the claim fails. A only compares two points and ignores the drop, and B is false because the warmest temperature (35°C) actually had one of the lowest results. D is false because the values clearly differ."

/* Daily streak: days in a row the app was opened (local time) */
const dayStr=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const shiftDay=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return dayStr(new Date(y,m-1,d+n,12));};
function checkIn(announce){
  const today=dayStr(Date.now());
  if(P.lastDay===today) return false;
  const prev=P.dayStreak||0;
  P.dayStreak = P.lastDay===shiftDay(today,-1) ? prev+1 : 1;

/* ---------- Prediction model ---------- */
function officialCounts(sec){
  const qs=CUSTOM.filter(q=>q.s===sec&&q.origin==="official");
  const m={}; qs.forEach(q=>m[q.t]=(m[q.t]||0)+1);
  return {n:qs.length,m};
}
// Blend ACT's blueprint with the topics you see on real tests once you've logged 10+ official questions
function weight(sec,t){
  const base=(BP[sec].topics.find(x=>x[0]===t)||[0,0,5])[2];
  const oc=officialCounts(sec);
  if(oc.n<10) return base;
  return 0.5*base + 0.5*(100*(oc.m[t]||0)/oc.n);
}
function acc(key){const s=P.stats[key];return s?(s.r+1)/(s.t+2):0.5;}
function rawAcc(key){const s=P.stats[key];return s&&s.t?s.r/s.t:null;}
function priorities(secs){
  const out=[];
  secs.forEach(s=>BP[s].topics.forEach(([t,name])=>{
    out.push({s,t,name,w:weight(s,t),p:weight(s,t)*(1-acc(s+"."+t))});
  }));
  return out.sort((a,b)=>b.p-a.p);
}

function rich(text){
  const lines=esc(text).split("\n"); let html="", para=[], tbl=[];
  const fmt=s=>s.replace(/\[\[(.+?)\]\]/g,"<u>$1</u>");
  const flushP=()=>{if(para.length){html+="<p>"+fmt(para.join("<br>"))+"</p>";para=[];}};
  const flushT=()=>{if(tbl.length){html+="<table>"+tbl.map((r,i)=>"<tr>"+r.split("|").map(c=>i?`<td>${fmt(c.trim())}</td>`:`<th>${fmt(c.trim())}</th>`).join("")+"</tr>").join("")+"</table>";tbl=[];}};
  lines.forEach(l=>{
    if(l.includes("|")){flushP();tbl.push(l.replace(/^\s*\||\|\s*$/g,""));}
    else if(!l.trim()){flushP();flushT();}
    else{flushT();para.push(l);}
  });
  flushP();flushT();return html;
}

function pickQuestions(secs,n,random){
  const scored=bank().filter(q=>secs.includes(q.s)&&inLevel(q)).map(q=>{
    const seen=P.seen[q.id]; const pen=!seen?1:(seen.r<seen.t?0.7:0.15);
    const base=random?1:(weight(q.s,q.t)/100*(1-acc(tk(q)))+0.01);
    return {q,w:base*pen*(random?Math.random():(0.6+Math.random()*0.8))};
  }).sort((a,b)=>b.w-a.w);
  const picked=scored.slice(0,n||scored.length).map(o=>o.q);
  const order={}; picked.forEach((q,i)=>{const k=pkey(q)||q.id; if(!(k in order)) order[k]=i;});
  return picked.sort((a,b)=>order[pkey(a)||a.id]-order[pkey(b)||b.id]);
}
function startSession(key){

  const total=qs.reduce((a,q)=>a+BP[q.s].sec,0);
  const base=key==="smart"?"Smart mix":key==="mixed"?"Mixed":stem?"STEM"+(full?" · Full mix":""):BP[secs[0]].name+(full?" · Full mix":"");
  session={qs,i:0,ans:[],picked:null,timed:ui.timed,end:Date.now()+total*1000,label:base+(ui.diff==="any"?"":" · "+LEVELS[ui.diff]),home:stem?"stem":"practice"};
  tab=session.home; render();
}

  const q=session.qs[session.i], pass=passageOf(q), answered=session.picked!=null;
  const lv=levelOf(q);
  let h=`<div class="card"><div class="row"><span class="mute small">${esc(session.label)} · ${session.i+1} of ${session.qs.length} · ${q.s!==session.qs[0].s||session.label.startsWith("Mixed")||session.label.startsWith("Smart")||session.home==="stem"?esc(BP[q.s].name)+" · ":""}<span class="lvl lvl-${lv}">${LEVELS[lv]}</span></span>${session.timed?`<span id="timer" class="timer"></span>`:""}<button class="linkbtn" data-act="quit">End</button></div>`;
  if(pass) h+=`<details ${q.s!=="english"||!answered?"open":""}><summary>Passage</summary><div class="passage">${rich(pass)}</div></details>`;
  h+=`<div class="q">${rich(q.q)}</div>`;
  q.c.forEach((c,i)=>{
    let cls=""; if(answered){ if(i===q.a) cls="ok"; else if(i===session.picked) cls="bad"; }
    h+=`<button class="choice ${cls}" data-pick="${i}" ${answered?"disabled":""}><b>${L[i]}</b><span>${rich(c).replace(/^<p>|<\/p>$/g,"")}</span></button>`;
  });
  if(answered){
    const right=session.picked===q.a;
    const last=session.ans[session.ans.length-1], g=last.gain, nb=nextBonusAt(P.streak);
    h+=`<div class="coinline"><span class="coin">$</span>+${g} coin${g>1?"s":""}${right&&P.streak>=2?` · 🔥 ${P.streak} in a row`:""}${last.bonus?` — streak bonus +${last.bonus}!`:""}</div>
    <div class="mute small">${right?`Next bonus at ${nb.n} in a row: +${nb.b}`:"Streak reset. 3 in a row starts the bonus again."}</div>`;
    let body;
    if(right) body=esc(q.x||"");
    else {
      const lx=longExpl(q,session.picked);
      const key=q.id+":"+session.picked;
      body = lx ? esc(lx) : `${esc(q.x||"")} <div class="mute small" style="margin-top:6px">${LONG_STATE[key]==="wait"?"Writing a detailed explanation…":""}</div>`;
      if(!lx && !LONG_STATE[key]) setTimeout(()=>fetchLong(q,session.picked),0);
    }
    h+=`<div class="expl"><b>${right?"Correct!":"Not quite — you picked "+L[session.picked]+", but the answer is "+L[q.a]+"."}</b> ${body}<div style="margin-top:6px"><span class="tag">${esc(topicName(q.s,q.t))}</span>${q.origin==="official"?` <span class="tag">Official${q.testDate?" · "+esc(q.testDate):""}</span>`:""}</div></div>
    <button class="btn" data-act="next">${session.i+1<session.qs.length?"Next":"See results"}</button>`;
  }
  h+=`</div>`;
  V.innerHTML=h;
  if(session.timed){const tick=()=>{const el=document.getElementById("timer");if(!el)return;const s=Math.round((session.end-Date.now())/1000);el.textContent=s>=0?fmtTime(s):"Time's up "+fmtTime(-s);el.classList.toggle("late",s<0);};tick();timerId=setInterval(tick,1000);}
}
/* Detailed explanations for wrong answers */
const LONG_CACHE={}, LONG_STATE={};
function longExpl(q,picked){ return q.xl || XL[q.id] || LONG_CACHE[q.id+":"+picked] || ""; }
const sameQ=(q,picked)=>session&&!session.done&&session.qs[session.i]===q&&session.picked===picked;
async function fetchLong(q,picked){
  const key=q.id+":"+picked; if(LONG_STATE[key]) return; // only try once per question + choice
  LONG_STATE[key]="wait";
  let sample=null; try{ if(typeof claude!=="undefined"&&claude.use) sample=await claude.use("sample"); }catch(e){}
  if(!sample){ LONG_STATE[key]="done"; if(sameQ(q,picked)) renderQuestion(); return; }
  if(sameQ(q,picked)) renderQuestion();
  const pass=passageOf(q);
  const prompt=`A student preparing for the ACT answered this ${BP[q.s].name} question wrong (topic: ${topicName(q.s,q.t)}).
${pass?"Passage:\n"+pass+"\n\n":""}Question: ${q.q}
${q.c.map((c,i)=>L[i]+") "+c).join("\n")}
Correct answer: ${L[q.a]}. The student chose: ${L[picked]}.${q.x?"\nNotes: "+q.x:""}
Write a clear explanation in 3 to 5 sentences, in plain friendly language for a high school student: explain why ${L[q.a]} is correct, why ${L[picked]} is wrong (the likely mistake), and one tip for spotting this kind of question on test day. Text in [[double brackets]] marks an underlined portion. Reply with only the explanation, no heading.`;
  try{ const r=await sample(prompt,{modelTier:"quick"}); if(r&&r.text) LONG_CACHE[key]=r.text.trim(); }catch(e){}
  LONG_STATE[key]="done";
  if(sameQ(q,picked)) renderQuestion();
}
function answer(i){
  if(session.picked!=null) return;
  const q=session.qs[session.i]; session.picked=i;
  const right=i===q.a, k=tk(q);
  const st=P.stats[k]||{r:0,t:0}; P.stats[k]={r:st.r+(right?1:0),t:st.t+1};
  const se=P.seen[q.id]||{r:0,t:0}; P.seen[q.id]={r:se.r+(right?1:0),t:se.t+1};
  let gain=COIN_TRY;
  let bonus=0;
  if(right){ gain+=COIN_RIGHT; P.streak=(P.streak||0)+1; bonus=streakBonus(P.streak); gain+=bonus; P.best=Math.max(P.best||0,P.streak); }
  else P.streak=0;
  P.coins=(P.coins||0)+gain; session.coins=(session.coins||0)+gain;
  session.ans.push({q,right,gain,bonus,pick:i});
  checkBadges(true);
  saveProfile(); renderQuestion(); showCoins(gain);
}
function next(){
  session.picked=null; session.i++;
  if(session.i>=session.qs.length){
    session.done=true;
    const r=session.ans.filter(a=>a.right).length;
    P.sessions.unshift({d:Date.now(),label:session.label,r,n:session.ans.length,timed:session.timed});
    P.sessions=P.sessions.slice(0,30); saveProfile();
  }
  render(); window.scrollTo(0,0);
}

async function generate(){
  const btn=document.getElementById("genBtn"), msg=document.getElementById("genMsg");
  const s=ui.genSec, t=document.getElementById("gt").value; ui.genTopic=t;
  let sample=null; try{ if(typeof claude!=="undefined"&&claude.use) sample=await claude.use("sample"); }catch(e){}
  if(!sample){msg.innerHTML=`<div class="err">Question writing isn't available in this view.</div>`;return;}
  btn.disabled=true; btn.textContent="Writing questions…"; msg.innerHTML="";
  const rules={
    english:"Write one original essay passage of 180-260 words. Then write questions about it. For each question that tests a specific word, phrase or punctuation mark, the question field must quote the full sentence from the passage with the tested portion wrapped in [[double brackets]], and the first choice must be exactly \"NO CHANGE\". Questions about the essay as a whole (adding/deleting a sentence, the writer's purpose, placement) need no brackets.",
    math:"No passage: set passage to an empty string. Mix difficulty from easy to hard. Use exact values (fractions, radicals, π) rather than long decimals. Use plain Unicode for math (x², √, π, ≤), no LaTeX.",
    reading:"Write one original passage of 400-550 words in the style of an ACT Reading passage (literary narrative, social science, humanities, or natural science). Number nothing. All questions are about this passage.",
    science:"Write one original passage describing an experiment or two competing scientific viewpoints, with data. Present each data table as plain text with columns separated by | and one row per line, first row as headers. All questions are about this passage and must be answerable from the data or text."
  }[s];
  const prompt=`You write ORIGINAL practice questions for the enhanced ACT (the format used since spring 2025). Never copy or closely paraphrase real ACT questions.
Section: ${BP[s].name}
Topic to test: ${topicName(s,t)}
Difficulty: ${(ui.genDiff||"mix")==="mix"?"make 2 easy, 2 medium and 1 hard question":"make all 5 questions "+(ui.genDiff).toUpperCase()}. Easy = a single, common rule or step most students get right. Medium = two steps or a classic trap answer. Hard = like the last questions of a real ACT section: multi-step reasoning, less common rules, or very tempting wrong answers. Tag each question with "difficulty": "easy", "medium" or "hard".
Write exactly 5 multiple-choice questions on this topic with exactly 4 answer choices each, one clearly correct answer, and plausible wrong answers that reflect common student mistakes.
${rules}
For each question write two explanations in plain, friendly language for a high school student:
- "explanation_short": 1-2 sentences saying why the correct answer is right (shown when the student gets it right).
- "explanation_long": 3-5 sentences explaining why the correct answer is right, why each tempting wrong answer is wrong (the likely mistake), and a tip for spotting this question type (shown when the student gets it wrong).
Return ONLY JSON in this shape: {"passage": string, "questions": [{"question": string, "choices": [string, string, string, string], "answer": 0-3 index of correct choice, "difficulty": "easy"|"medium"|"hard", "explanation_short": string, "explanation_long": string}]}`;
  try{
    const out=await sample.json(prompt,{modelTier:"default"});
    const qs=(out&&Array.isArray(out.questions)?out.questions:[]).filter(q=>q&&q.question&&Array.isArray(q.choices)&&q.choices.length===4&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4);
    if(!qs.length) throw {code:"bad"};
    const pid="g"+Date.now(), passage=typeof out.passage==="string"?out.passage:"";
    for(const q of qs){ await addQuestion({s,t,pid:passage?pid:"",passage,q:String(q.question),c:q.choices.map(String),a:q.answer,d:LEVELS[q.difficulty]?q.difficulty:((ui.genDiff&&ui.genDiff!=="mix")?ui.genDiff:"medium"),x:String(q.explanation_short||q.explanation||""),xl:String(q.explanation_long||""),origin:"generated"}); }
    ui.flash=`<div class="okmsg">Added ${qs.length} new ${esc(topicName(s,t).split(" (")[0])} questions to your bank.</div>`;
    ui.secs=[s]; if(!session) render();
  }catch(e){
    btn.disabled=false; btn.textContent="Write 5 new questions";
    msg.innerHTML=`<div class="err">${e&&e.code==="not_granted"?"Question writing wasn't allowed. You can still practice and add your own.":e&&e.code==="rate_limited"?"Too many requests right now. Try again in a minute.":e&&e.code==="quota_exceeded"?"Your question bank is full. Delete some questions first.":"Couldn't write questions this time. Try again."}</div>`;
  }
}

    if(!it||owns(kind,id)||(P.coins||0)<it.cost){render();return;}
    P.coins-=it.cost; P.owned.push(d.buy); P.look[kind]=id;
    saveProfile(); applyLook(); showCoins(); render(); toast("🛍️","Unlocked: "+it.n,"Now in use");
  }
  else if(d.use){
    const [kind,id]=d.use.split(":"); if(!owns(kind,id)) return;
    buyArmed=null; P.look[kind]=id; saveProfile(); applyLook(); render();
  }
  else if(d.del){
    if(delArmed!==d.del){delArmed=d.del;b.textContent="Tap again to delete";return;}
    delArmed=null;b.disabled=true;deleteQuestion(d.del).catch(()=>{b.disabled=false;b.textContent="Couldn't delete";});
  }
  else if(d.act){
    switch(d.act){
      case "smart": ui.secs=["smart"]; ui.diff="any"; startSession("smart"); break;
      case "start": startSession(ui.secs[0]); break;
      case "next": next(); break;
      case "quit": if(session.ans.length){session.qs=session.qs.slice(0,session.i+(session.picked!=null?1:0));session.i=session.qs.length-1;session.picked=0;next();}else{session=null;render();} break;
      case "stemstart": startSession("stem"); break;
      case "again": {const k=session&&session.home==="stem"?"stem":ui.secs[0]; session=null; startSession(k);} break;
      case "done": session=null; render(); break;
      case "gen": generate(); break;
      case "save": saveOfficial(); break;
      case "reset":
        if(!resetArmed){resetArmed=true;b.textContent="Tap again to clear all scores";return;}
        resetArmed=false; P={stats:{},seen:{},sessions:[],coins:0,streak:0,best:0,badges:{},owned:P.owned,look:P.look,lastDay:P.lastDay,dayStreak:P.dayStreak,bestDay:P.bestDay,days:P.days}; checkBadges(false); saveProfile(); showCoins(); render(); break;
    }
  }
});
V.addEventListener("change",e=>{
  if(e.target.id==="gt") ui.genTopic=e.target.value;
  if(e.target.id==="pName"){const v=e.target.value.trim().slice(0,24); if(v!==P.look.name){P.look.name=v; saveProfile();}}
});

render();
init();
</script>
</body>
</html>
