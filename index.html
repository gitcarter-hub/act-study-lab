 {id:"b-m38",s:"math",t:"ies",d:"easy",q:"The price of a concert ticket rose from $40 to $50. By what percent did the price increase?",c:["10%", "20%", "25%", "50%"],a:2,x:"The increase is $10, and $10 is 25% of the original $40.",xl:"Percent change = (new − old) ÷ old × 100%. The change is $50 − $40 = $10, and you divide by the original price: $10 ÷ $40 = 0.25, or 25%. Choice B, 20%, comes from dividing by the new price ($10 ÷ $50), a very common mistake. Choice A just uses the dollar amount as a percent. Always divide by the starting value for percent increase or decrease."},
 {id:"b-m39",s:"math",t:"ies",d:"medium",q:"A toy car travels at 3 feet per second. What is its speed in inches per minute?",c:["36", "180", "2,160", "10,800"],a:2,x:"3 ft/s × 12 in/ft = 36 in/s, and 36 in/s × 60 s/min = 2,160 in/min.",xl:"Convert one unit at a time. First feet to inches: 3 feet per second × 12 inches per foot = 36 inches per second. Then seconds to minutes: there are 60 seconds in a minute, so 36 × 60 = 2,160 inches per minute. Choice A stops after converting feet, and B converts only seconds (3 × 60). Writing the units in each step and canceling them makes conversion problems much safer."},
 {id:"b-m40",s:"math",t:"ies",d:"hard",q:"Pipe A can fill a tank in 6 hours. Pipe B can fill the same tank in 3 hours. Working together, how many hours will it take both pipes to fill the empty tank?",c:["1.5", "2", "4.5", "9"],a:1,x:"Together they fill 1/6 + 1/3 = 1/2 of the tank per hour, so they need 2 hours.",xl:"For work problems, add rates, not times. Pipe A fills 1/6 of the tank per hour and Pipe B fills 1/3 (which is 2/6) per hour. Together that's 3/6 = 1/2 of the tank per hour, so filling the whole tank takes 2 hours. Choice C averages the times and D adds them, but working together must be faster than either pipe alone, so the answer must be less than 3 hours. That quick check rules out C and D right away."},
 {id:"b-m41",s:"math",t:"alg",d:"medium",q:"Which equation describes the line that passes through the points (2, 5) and (6, 13)?",c:["y = 2x + 1", "y = 2x + 3", "y = 4x − 3", "y = ½x + 4"],a:0,x:"Slope = (13 − 5)/(6 − 2) = 2. Then 5 = 2(2) + b gives b = 1.",xl:"Find the slope first: rise over run is (13 − 5) ÷ (6 − 2) = 8 ÷ 4 = 2. Then substitute one point into y = 2x + b: 5 = 2(2) + b, so b = 1, giving y = 2x + 1. Check with the other point: 2(6) + 1 = 13. ✓ Choice C works for (2, 5) but gives 21 at x = 6, so always test both points. Choice D flips the slope fraction to run over rise."},
 {id:"b-m42",s:"math",t:"alg",d:"easy",q:"If 2(x − 3) = x + 4, what is the value of x?",c:["−2", "1", "7", "10"],a:3,x:"Distribute: 2x − 6 = x + 4. Subtract x and add 6: x = 10.",xl:"Start by distributing the 2 to both terms in the parentheses: 2x − 6 = x + 4. Subtract x from both sides to get x − 6 = 4, then add 6 to get x = 10. Choice C comes from forgetting to multiply the −3 by 2 (writing 2x − 3 = x + 4). Check your answer by plugging in: 2(10 − 3) = 14 and 10 + 4 = 14. ✓"},
 {id:"b-m45",s:"math",t:"geo",d:"medium",q:"A rectangle has a perimeter of 30 inches, and its length is twice its width. What is its area, in square inches?",c:["30", "45", "50", "200"],a:2,x:"Let width = w, length = 2w. Then 2w + 2(2w) = 6w = 30, so w = 5 and l = 10. Area = 50.",xl:"Set up the perimeter with a variable. If the width is w, the length is 2w, and the perimeter is w + 2w + w + 2w = 6w. Setting 6w = 30 gives w = 5, so the length is 10. The area is length × width = 10 × 5 = 50 square inches. A common mistake is writing the perimeter as just w + 2w = 30, which gives w = 10 and an area of 200 (choice D). Remember that a rectangle's perimeter counts each side twice."},
 {id:"b-m46",s:"math",t:"geo",d:"easy",q:"In an isosceles triangle, the angle between the two equal sides measures 40°. What is the measure of each of the other two angles?",c:["20°", "40°", "50°", "70°"],a:3,x:"The angles of a triangle add to 180°. The two equal base angles share 180° − 40° = 140°, so each is 70°.",xl:"Every triangle's angles add up to 180°. In an isosceles triangle, the two angles opposite the equal sides are equal. Subtract the given angle: 180° − 40° = 140°, then split it evenly: 140° ÷ 2 = 70° each. Choice B assumes all the angles match the one given. Sketching the triangle and marking the equal sides helps you see which angles are the same."},
 {id:"b-m48",s:"math",t:"num",d:"easy",q:"What is (3 × 10⁴)(2 × 10³)?",c:["5 × 10⁷", "6 × 10⁷", "6 × 10¹²", "5 × 10¹²"],a:1,x:"Multiply the numbers (3 × 2 = 6) and add the exponents (4 + 3 = 7): 6 × 10⁷.",xl:"In scientific notation, multiply the front numbers and handle the powers of 10 separately. 3 × 2 = 6, and 10⁴ × 10³ = 10⁷, because multiplying powers with the same base means adding exponents. So the answer is 6 × 10⁷. Choices A and D add the 3 and 2 instead of multiplying them. Choices C and D multiply the exponents (4 × 3 = 12), which is the rule for a power raised to a power, not for multiplying."},
 {id:"b-m49",s:"math",t:"trig",d:"hard",q:"A 10-foot ladder leans against a vertical wall, making a 60° angle with the level ground. How high up the wall does the ladder reach?",c:["5 feet", "5√3 feet", "10√3 feet", "20 feet"],a:1,x:"The height is opposite the 60° angle and the ladder is the hypotenuse: height = 10 sin 60° = 10(√3/2) = 5√3.",xl:"Draw the right triangle: the ladder is the hypotenuse (10 ft), the ground is one leg, and the wall height is the leg opposite the 60° angle. Sine is opposite over hypotenuse, so height = 10 × sin 60° = 10 × (√3/2) = 5√3, about 8.7 feet. Choice A uses sin 30° (or cos 60°), which gives the distance along the ground instead. Choices C and D are longer than the ladder itself, which is impossible for a leg of a right triangle. Knowing the 30-60-90 side ratios (1 : √3 : 2) lets you solve this without a calculator."},
 {id:"b-m50",s:"math",t:"stat",d:"medium",q:"What is the median of the data set 3, 8, 5, 12, 7, 9?",c:["7", "7⅓", "7.5", "8"],a:2,x:"In order: 3, 5, 7, 8, 9, 12. With six values, the median is the average of the middle two: (7 + 8)/2 = 7.5.",xl:"To find a median, first put the numbers in order: 3, 5, 7, 8, 9, 12. With an even number of values, there are two middle numbers, here 7 and 8, so the median is their average: 7.5. Choice B is the mean (44 ÷ 6 = 7⅓), not the median. Choice A or D comes from picking just one of the middle values, and a common mistake is forgetting to sort the list before choosing the middle."},
 {id:"b-r18",s:"reading",t:"craft",d:"easy",p:"clock",q:"The passage is narrated from the point of view of:",c:["Nadia, speaking in the first person.", "several family members, each taking a turn.", "the clerk, looking back on the day Nadia visited.", "a third-person narrator who closely follows Nadia."],a:3,x:"The narrator calls Nadia \"she\" but shares her thoughts, such as what she promised herself and what she realized at the end.",xl:"Look at the pronouns: the passage says \"Nadia had promised herself\" and \"She did,\" never \"I,\" so it isn't first person (A). It's a third-person narrator, but one that knows Nadia's private thoughts, like her promise not to cry and her final realization about the quiet apartment. We never learn the clerk's thoughts, only his words and actions, which rules out C. Only one perspective is used, so B is wrong. For point-of-view questions, check the pronouns first, then whose thoughts the narrator reveals."},
 {id:"b-r19",s:"reading",t:"detail",d:"easy",p:"clock",q:"According to the passage, the dent near the base of the clock was caused when:",c:["Nadia dropped the clock on the bus.", "the clerk examined it too roughly.", "Nadia's grandmother knocked it off a shelf while rushing to answer the phone.", "the clock's mainspring broke."],a:2,x:"The passage says the grandmother knocked it off the shelf \"the night Nadia's mother was born, rushing to answer the phone.\"",xl:"Detail questions are answered directly in the text. After the clerk taps the dent, the passage explains that Nadia's grandmother \"had knocked the clock off the shelf the night Nadia's mother was born, rushing to answer the phone.\" That matches C. Nadia carefully holds the clock on the bus (A), the clerk handles it gently \"as if it were a sleeping animal\" (B), and the mainspring is a separate problem that affects how the clock runs (D). Go back to the passage to confirm details instead of relying on memory."},
 {id:"b-r20",s:"reading",t:"infer",d:"medium",p:"clock",q:"When the clerk says, \"The question is whether you want me to,\" he most likely means that:",c:["he isn't sure Nadia can afford the repair.", "he would rather buy the clock from Nadia.", "the clock is too damaged to be worth fixing.", "Nadia should decide whether the clock should be made to look new or keep its signs of age."],a:3,x:"He goes on to explain that some customers want clocks to look new and then feel they're no longer theirs, so he's asking what kind of repair she wants.",xl:"To interpret a puzzling line, read what the character says next. The clerk explains that some people have their clocks polished and refaced, and afterward \"it doesn't feel like theirs anymore.\" Then he points to the dent and asks if she knows its story. So his question is really about whether Nadia wants the clock restored to look new or kept with the marks that hold her family's memories. Nothing in the passage mentions cost (A), and he clearly says \"I can\" fix it, ruling out C. Choice B has no support at all."},
 {id:"b-r21",s:"reading",t:"vocab",d:"medium",p:"clock",q:"As it is used in the passage, the phrase \"worn as smooth as the brass\" suggests that the family story had:",c:["caused arguments within the family.", "become faded and partly forgotten.", "been written down and displayed beside the clock.", "been told so often that it had become familiar and comfortable."],a:3,x:"Like brass rubbed smooth by handling, the story was smoothed by being told \"so many times,\" making it familiar and treasured.",xl:"This phrase compares the story to the clock's brass, which becomes smooth after years of handling. The passage says the family \"had told the story so many times\" before using the phrase, so \"worn\" here means smoothed by repeated use, not damaged. That makes the story familiar, polished and comfortable, as in D. Choice B confuses \"worn\" with \"worn out,\" but Nadia knows the story perfectly. Choices C and A aren't supported anywhere. With figurative language, look at what's being compared and the words right before it."},
 {id:"b-r22",s:"reading",t:"main",d:"medium",p:"clock",q:"Which choice best states the central idea of the passage?",c:["A clerk convinces a reluctant customer to pay for an expensive restoration.", "Nadia learns how mechanical clocks work by watching a repair.", "Nadia chooses to keep the clock's imperfections because they carry her family's memories.", "Nadia decides to sell her grandmother's clock after it is repaired."],a:2,x:"The key moment is Nadia saying \"Leave the dent,\" choosing to keep the mark that tells a family story.",xl:"The passage builds toward Nadia's decision. The clerk explains that full restorations can make a clock stop feeling like the owner's, points to the dent, and Nadia, remembering its story, says \"Leave the dent.\" The ending, with the familiar ticking filling her apartment, confirms that keeping the clock as it was matters to her. Choice A gets the clerk's role backward, since he's glad she chooses the simpler repair. Choice B overstates the technical details, and D contradicts the ending, where she brings the clock home."},
 {id:"b-r23",s:"reading",t:"craft",d:"medium",p:"clock",q:"The detail that the clerk smiles \"for the first time\" mainly serves to show that he:",c:["approves of Nadia's decision to keep the dent.", "is relieved the repair will be easy.", "finds Nadia's grandmother's story funny.", "is usually rude to customers."],a:0,x:"He smiles right after Nadia says \"Leave the dent\" and he answers \"Good,\" showing he approves.",xl:"Look at what happens right before the smile: Nadia says \"Leave the dent,\" the clerk answers \"Good,\" and only then does he smile for the first time. The timing links the smile to her choice, showing he approves of keeping the clock's history. Choice B ignores that the repair work is the same either way. Nothing suggests he finds the story funny (C), and being serious isn't the same as being rude (D). When a question asks why a detail is included, connect it to the events around it."},
 {id:"b-r24",s:"reading",t:"infer",d:"hard",p:"clock",q:"The last sentence of the passage (\"She hadn't realized how quiet the place had been\") most strongly suggests that:",c:["Nadia's apartment is in a noisy neighborhood.", "Nadia plans to return the clock to the shop.", "Nadia regrets that the clock is too loud.", "the clock's ticking fills a sense of absence Nadia hadn't noticed before."],a:3,x:"The ticking brings back something familiar, and Nadia realizes only then how empty the silence had felt.",xl:"The final paragraph describes the ticking filling the apartment \"exactly as she remembered,\" and then Nadia realizes how quiet things had been. The clock belonged to her grandmother, so the silence suggests a loss she had been living with without fully noticing. The sound of the clock fills that gap. Choice A contradicts the idea that the place was quiet, and C misreads \"a little loud\" as a complaint. Endings in literary passages often reveal a feeling the character hasn't stated directly, so look for what the image suggests."},
 {id:"b-r32",s:"reading",t:"main",d:"medium",p:"diners",q:"The passage is primarily concerned with:",c:["how Calder's diner photographs were misunderstood and what her real subject was.", "the history of diners in the United States.", "the technical methods Calder used to develop her film.", "why many small-town diners closed in the 1980s."],a:0,x:"The passage contrasts critics' views (nostalgic, then a record of a disappearing America) with Calder's own focus on attention and waiting.",xl:"The passage opens with critics calling the work nostalgic, then explains what Calder was really doing: capturing \"a sense of waiting\" and \"a kind of attention.\" It ends with viewers relabeling the work and Calder rejecting that label too. So the passage is about the gap between how the work was seen and what she was focused on. It doesn't trace diner history (B), discuss film technique (C), or explain why diners closed (D). The passage's repeated pattern of \"critics said ... but Calder ...\" points to the main idea."},
 {id:"b-r33",s:"reading",t:"detail",d:"easy",p:"diners",q:"According to the passage, Calder usually photographed diners:",c:["late at night, after closing.", "during the busy lunch hour.", "just after dawn, before the breakfast crowd arrived.", "only on holidays."],a:2,x:"The passage says she worked \"almost always at the same hour, just after dawn, before the breakfast crowd arrived.\"",xl:"Paragraph 2 states that Calder photographed \"almost always at the same hour, just after dawn, before the breakfast crowd arrived,\" and that the timing was deliberate. That matches C exactly. The passage never mentions night (A), lunch (B), or holidays (D). Detail questions reward going back to the text rather than guessing based on what seems likely."},
 {id:"b-r34",s:"reading",t:"craft",d:"medium",p:"diners",q:"The comparison to \"photographing a typewriter\" in the first paragraph mainly conveys the critics' view that diners were:",c:["complicated machines that were hard to photograph.", "modern inventions that would soon replace older restaurants.", "valuable antiques worth preserving in museums.", "outdated objects that might be charming but weren't serious art."],a:3,x:"The critics called diners \"relics\" and said photographing them was \"charming, perhaps, but not art,\" like photographing an old typewriter.",xl:"The comparison appears right after critics call diners \"relics,\" meaning outdated leftovers from the past. A typewriter is an old-fashioned machine, and the sentence ends \"charming, perhaps, but not art.\" Together, these show the critics saw diners as quaint but not worthy of serious art, which is choice D. Choice A focuses on mechanics, which isn't the point, and C and B contradict the critics' dismissive tone. To interpret a comparison, ask what quality the two things share in the writer's eyes."},
 {id:"b-r35",s:"reading",t:"vocab",d:"easy",p:"diners",q:"As it is used in the third paragraph, the phrase \"absorbed in\" most nearly means:",c:["soaked by.", "confused by.", "taken over by.", "fully focused on."],a:3,x:"The workers aren't looking at the camera because they're concentrating completely on their small tasks.",xl:"The sentence describes the cook and waitress as \"absorbed in small, repeated tasks\" right after noting they \"are rarely looking at the camera.\" That means their attention is completely on their work, so \"fully focused on\" fits. \"Soaked by\" (A) is the literal meaning of \"absorb,\" like a sponge with water. \"Taken over by\" (C) and \"confused by\" (B) add ideas the passage doesn't suggest. The surrounding sentences, especially \"a kind of attention,\" confirm the meaning."},
 {id:"b-r36",s:"reading",t:"infer",d:"medium",p:"diners",q:"The passage suggests that viewers' opinion of the series changed mainly because:",c:["Calder explained her goals in many interviews.", "critics discovered the photographs were staged.", "Calder began photographing famous monuments instead.", "about a third of the diners had closed by the time the full series was shown."],a:3,x:"Once many diners had closed, viewers began calling the work \"a record of a disappearing America.\"",xl:"The last paragraph links the events directly: by the time the series was exhibited in full, about a third of the diners had closed, and viewers \"now called it a record of a disappearing America.\" The closing of the diners is what changed how people saw the photos. Choice A contradicts the passage, which says Calder \"rarely argued the point in interviews.\" Choice C misuses the word \"monuments,\" and B isn't mentioned anywhere."},
 {id:"b-r37",s:"reading",t:"infer",d:"hard",p:"diners",q:"Calder's statement \"I wasn't trying to save anything\" most strongly suggests that she:",c:["regretted that so many diners had closed.", "wanted the remaining diners to be torn down.", "believed photography should not be considered art.", "rejected the idea that her work was mainly about preserving the past."],a:3,x:"She \"resisted that label as well,\" meaning she didn't want her work seen mainly as preserving a vanishing America.",xl:"The statement comes right after viewers call the work \"a record of a disappearing America,\" and the passage says Calder \"resisted that label as well.\" By saying she wasn't trying to save anything, only \"to look at it properly while it was there,\" she rejects the idea that her purpose was preservation. Her goal was careful attention to the present. Choice A may be true in real life, but it isn't what the quote expresses. Choices C and B aren't supported by the passage."},
 {id:"b-r38",s:"reading",t:"craft",d:"medium",p:"diners",q:"The author's attitude toward Calder's work is best described as:",c:["admiring and appreciative.", "dismissive and critical.", "confused and uncertain.", "amused and mocking."],a:0,x:"The author says critics \"missed\" her point and praises her for treating small tasks with the seriousness others gave monuments.",xl:"Look for evaluative words. The author says \"What critics missed was\" Calder's real subject, which sides with Calder against the critics. The author also praises how she treats ordinary tasks \"with the seriousness other photographers reserved for monuments.\" That's admiration. Choice B describes the early critics, not the author. Nothing in the passage is uncertain (C) or mocking (D). When the author corrects other people's views, the author usually shares the subject's perspective."},
 {id:"b-r39",s:"reading",t:"main",d:"medium",p:"tardi",q:"The main point of the passage is that tardigrades:",c:["are the only animals that have survived in outer space.", "can live only in hot springs and ocean sediments.", "are dangerous to the moss and lichens they live on.", "survive extreme conditions mainly by drying out into a tun, though they aren't truly indestructible."],a:3,x:"The passage explains the tun state and its amazing survival, then cautions that tardigrades are fragile when active.",xl:"The passage builds around the tun: paragraph 2 explains how tardigrades dry out into a tun, paragraph 3 lists the extremes they survive in that state, and paragraph 4 warns that calling them indestructible would be misleading. Choice D captures both the survival strategy and the warning. Choice A is too extreme (\"the only animals\"), C is never suggested, and B contradicts the statement that they live \"almost everywhere.\" A good main-idea answer includes the passage's twist, here the final paragraph's caution."},
 {id:"b-r40",s:"reading",t:"detail",d:"easy",p:"tardi",q:"According to the passage, tardigrades most commonly live:",c:["in the thin film of water that coats moss and lichens.", "deep inside glaciers.", "in the soil of farm fields.", "inside the bodies of larger animals."],a:0,x:"Paragraph 1 says they live \"most commonly, in the thin film of water that coats moss and lichens.\"",xl:"The first paragraph lists where tardigrades live: ocean sediments, hot springs, \"and, most commonly, in the thin film of water that coats moss and lichens.\" The words \"most commonly\" point directly to choice A. Glaciers (B), farm soil (C), and other animals (D) aren't mentioned. Watch for qualifying words like \"most commonly,\" \"usually\" or \"only,\" since questions often hinge on them."},
 {id:"b-r41",s:"reading",t:"detail",d:"medium",p:"tardi",q:"According to the passage, researchers believe special proteins help tardigrades survive by:",c:["heating the animal's body in cold temperatures.", "repairing the moss the animal lives on.", "helping the animal swim to safer water.", "forming a glass-like material that holds delicate molecules in place as water leaves."],a:3,x:"The passage says proteins form \"a glass-like material that holds delicate molecules in place as the water disappears.\"",xl:"Paragraph 3 explains that researchers believe special proteins protect tardigrade cells by \"forming a glass-like material that holds delicate molecules in place as the water disappears.\" That matches D. Nothing says the proteins produce heat (A), help with swimming (C), or affect the moss (B). For science passages, locate the sentence with the key term from the question (\"proteins\") and read it closely."},
 {id:"b-r42",s:"reading",t:"craft",d:"medium",p:"tardi",q:"The last paragraph mainly serves to:",c:["provide more examples of extreme conditions tardigrades survive.", "argue that scientists should stop studying tardigrades.", "explain how tardigrades reproduce.", "qualify the idea that tardigrades are indestructible."],a:3,x:"It says calling tardigrades indestructible \"would be misleading,\" since active tardigrades are fragile.",xl:"After two paragraphs about tardigrades' toughness, the last paragraph changes direction: \"It is tempting to call tardigrades indestructible, but that would be misleading.\" It then explains that active tardigrades are fragile and their toughness belongs mainly to the tun. That limits, or qualifies, the earlier praise, so D is right. Choice A describes paragraph 3 instead, and C and B aren't discussed. Words like \"but\" and \"misleading\" are strong signals that a paragraph is qualifying an earlier claim."},
 {id:"b-r43",s:"reading",t:"vocab",d:"medium",p:"tardi",q:"As it is used in the first sentence, the word \"appreciate\" most nearly means:",c:["be grateful for.", "increase in value.", "fully see and recognize.", "approve of."],a:2,x:"You'd need a microscope to \"appreciate\" tardigrades because you need one to see them clearly.",xl:"The sentence says you'd need a microscope to appreciate tardigrades. A microscope helps you see something, so \"appreciate\" here means to fully see or recognize their features. \"Be grateful for\" (A) is the most common meaning, but a microscope doesn't make you grateful. \"Increase in value\" (B) is the financial meaning, and \"approve of\" (D) doesn't connect to a microscope. The clue in the same sentence (\"microscope\") rules out the familiar meanings."},
 {id:"b-r44",s:"reading",t:"infer",d:"hard",p:"tardi",q:"Based on the passage, an active, fully hydrated tardigrade exposed to the vacuum of space would most likely:",c:["survive easily, since tardigrades survive space exposure.", "grow larger as a result.", "immediately reproduce.", "be unlikely to survive, because its toughness depends mainly on the tun state."],a:3,x:"The passage says active tardigrades are fragile and that their toughness \"belongs mainly to the dried-out tun.\"",xl:"This question tests whether you noticed the passage's key distinction. Tardigrades survived space \"in the tun state,\" and the final paragraph stresses that \"active, hydrated tardigrades are fairly fragile\" and that their toughness \"belongs mainly to the dried-out tun.\" So an active one would likely not survive. Choice A is the trap: it applies the space experiment's result without noticing the tardigrades were in the tun state. Choices C and B have no support. Inference questions often hinge on a condition like \"in the tun state.\""},
 {id:"b-r45",s:"reading",t:"main",d:"medium",p:"sleep",q:"The primary purpose of the passage is to:",c:["explain why teenagers tend to fall asleep later and discuss later school start times as a response.", "argue that teenagers should be allowed to skip school when tired.", "describe how melatonin is produced in the body.", "criticize parents for setting early bedtimes."],a:0,x:"The passage explains the biological shift in teen sleep, its effects with early schedules, and districts' later start times with their trade-offs.",xl:"Follow the passage's structure: paragraph 1 explains the shift in teens' internal clocks, paragraph 2 shows how it collides with early schedules, and paragraph 3 describes later start times and their complications. Choice A covers all of that. The passage never suggests skipping school (B), mentions melatonin only briefly (C), and doesn't criticize parents (D). For purpose questions, check that the answer includes the passage's major sections."},
 {id:"b-r46",s:"reading",t:"detail",d:"easy",p:"sleep",q:"According to the passage, health experts recommend that teenagers get how much sleep per night?",c:["About seven hours", "Six to eight hours", "Eight to ten hours", "At least eleven hours"],a:2,x:"The passage says seven hours is \"well short of the eight to ten hours health experts recommend for teenagers.\"",xl:"Paragraph 2 gives the recommendation directly: \"the eight to ten hours health experts recommend for teenagers.\" Choice A is the amount the example student actually gets, which the passage says is too little, a classic trap that reuses a number from the passage. Choices B and D aren't mentioned. On number questions, make sure the number you pick answers the exact question asked."},
 {id:"b-r47",s:"reading",t:"infer",d:"medium",p:"sleep",q:"The author would most likely agree with which statement?",c:["Teenagers who stay up late are usually just undisciplined.", "After-school sports are more important than sleep.", "School start times have no effect on attendance.", "A teenager's late bedtime may be caused partly by biology rather than only by choice."],a:3,x:"The passage says research suggests \"a different explanation\" than lack of discipline: teens' internal clocks shift later.",xl:"The first paragraph rejects the old assumption that late-night teens are \"simply undisciplined\" and explains that their internal clocks and melatonin timing shift later. So the author would agree that biology plays a role, which is choice D. Choice A is the view the author argues against. Choice C contradicts the report that attendance improved, and B isn't something the author claims, since sports are mentioned only as a scheduling complication."},
 {id:"b-r48",s:"reading",t:"vocab",d:"easy",p:"sleep",q:"As it is used in the second paragraph, the phrase \"collides with\" most nearly means:",c:["crashes into physically.", "replaces.", "agrees with.", "conflicts with."],a:3,x:"Teens' later internal clocks clash with early school schedules, so \"conflicts with\" fits.",xl:"The passage says teens' later sleep timing \"collides with early school schedules,\" then explains the problem: falling asleep at 11 and waking at 6 means too little sleep. Two things that don't fit together are in conflict, so D is right. \"Crashes into physically\" (A) is the literal meaning, but a sleep pattern can't physically hit a schedule. \"Agrees with\" (C) is the opposite, and \"replaces\" (B) doesn't fit. Figurative verbs on the ACT usually call for their non-literal meaning."},
 {id:"b-r49",s:"reading",t:"craft",d:"medium",p:"sleep",q:"The third paragraph mainly serves to:",c:["present the results of later start times along with practical difficulties.", "explain the science behind melatonin.", "argue that later start times have failed.", "describe the history of school bus systems."],a:0,x:"It reports encouraging results (more sleep, better attendance) and then lists complications like sports, buses and parents' schedules.",xl:"Paragraph 3 starts with what districts did (moved start times later), reports that results were \"generally encouraging,\" and then turns with \"Still\" to list complications. So it presents both results and difficulties, which is choice A. The science of melatonin (B) is in paragraph 1. Choice C contradicts the encouraging results, and buses (D) are just one example of a complication. Notice transition words like \"Still\" that show a paragraph has two parts."},
 {id:"b-r50",s:"reading",t:"detail",d:"medium",p:"sleep",q:"According to the passage, compared with younger children and adults, teenagers' melatonin levels:",c:["rise later in the evening.", "never rise at all.", "rise earlier in the evening.", "stay high throughout the day."],a:0,x:"The passage says melatonin \"begins to rise later in the evening for teenagers than for younger children or adults.\"",xl:"Paragraph 1 states that melatonin, which signals that it's time to sleep, \"begins to rise later in the evening for teenagers than for younger children or adults.\" That's choice A. Choice C reverses the comparison, which is a common trap on comparison questions. Choices B and D aren't supported, since the passage says teens do feel sleepy, just later. When a question compares two groups, double-check which group is \"more\" or \"later.\""},
 {id:"b-s18",s:"science",t:"data",d:"easy",p:"salt",q:"According to Table 1, what is the freezing point of the solution with 10 g of salt per 100 g of water?",c:["−3.0°C", "−6.1°C", "−9.3°C", "101.7°C"],a:1,x:"In the 10 g row, the freezing-point column reads −6.1°C.",xl:"Find the row for 10 g of salt, then read across to the freezing-point column: −6.1°C. Choice D, 101.7°C, is in the same row but in the boiling-point column, a common trap when a table has several columns. Choices A and C are the freezing points for 5 g and 15 g. Put your finger on the row and slide across carefully to the right column."},
 {id:"b-s19",s:"science",t:"data",d:"easy",p:"salt",q:"Based on Table 1, as the amount of dissolved salt increases, the freezing point:",c:["decreases and the boiling point increases.", "increases and the boiling point decreases.", "decreases and the boiling point decreases.", "stays the same and the boiling point increases."],a:0,x:"Freezing points drop from 0.0 to −12.6°C while boiling points rise from 100.0 to 103.5°C.",xl:"Read down each column as the salt amount increases. The freezing point goes 0.0, −3.0, −6.1, −9.3, −12.6, so it decreases (gets more negative). The boiling point goes 100.0, 100.8, 101.7, 102.6, 103.5, so it increases. That's choice A. Be careful with negative numbers: −12.6 is lower than −3.0, even though 12.6 looks bigger. Trend questions are easiest if you check the first and last values, then confirm the values in between move the same way."},
 {id:"b-s20",s:"science",t:"data",d:"medium",p:"salt",q:"Based on Table 1, the freezing point of a solution with 12.5 g of salt per 100 g of water would most likely be closest to:",c:["−4.5°C", "−6.0°C", "−7.7°C", "−9.5°C"],a:2,x:"12.5 g is halfway between 10 g (−6.1°C) and 15 g (−9.3°C), so the freezing point should be about halfway: around −7.7°C.",xl:"This is interpolation: estimating a value between two data points. 12.5 g falls halfway between 10 g and 15 g, so the freezing point should fall about halfway between −6.1°C and −9.3°C. The midpoint is (−6.1 + −9.3) ÷ 2 = −7.7°C. Choice B is barely below the 10 g value, and D is past the 15 g value, so neither fits between the two rows. Always check that your estimate lands between the two neighboring table values."},
 {id:"b-s21",s:"science",t:"data",d:"medium",p:"salt",q:"If the pattern in Table 1 continues, the boiling point of a solution with 25 g of salt per 100 g of water would most likely be closest to:",c:["102.0°C", "103.0°C", "104.4°C", "110.0°C"],a:2,x:"The boiling point rises about 0.9°C for each 5 g of salt, so 25 g should be about 103.5 + 0.9 = 104.4°C.",xl:"Extrapolation means extending the pattern past the table. Each extra 5 g of salt raises the boiling point by about 0.8 to 0.9°C (100.8, 101.7, 102.6, 103.5). Going from 20 g to 25 g should add about 0.9°C more: 103.5 + 0.9 = 104.4°C. Choices A and B are lower than the 20 g value, which would reverse the trend. Choice D jumps far more than the steady pattern supports."},
 {id:"b-s22",s:"science",t:"design",d:"easy",p:"salt",q:"In this study, the independent variable (the one the students deliberately changed) was:",c:["the amount of salt dissolved.", "the freezing point of the solution.", "the boiling point of the solution.", "the air pressure."],a:0,x:"The students chose different amounts of salt and then measured how the freezing and boiling points responded.",xl:"The independent variable is the one the experimenters choose and change, and the dependent variables are what they measure. The students picked the amounts of salt (0, 5, 10, 15 and 20 g), so salt is the independent variable. Freezing point and boiling point (B and C) were the results they measured. Air pressure (D) was held constant at 1 atmosphere. In tables, the independent variable is usually the left-hand column."},
 {id:"b-s23",s:"science",t:"models",d:"hard",p:"salt",q:"A town wants the water on its roads to stay liquid down to −8°C. Based on Table 1, the smallest amount of salt (per 100 g of water) that would achieve this is closest to:",c:["5 g", "10 g", "13 g", "20 g"],a:2,x:"−8°C falls between −6.1°C (10 g) and −9.3°C (15 g), so a bit more than 10 g is needed, about 13 g.",xl:"Water stays liquid if its freezing point is at or below −8°C. At 10 g the freezing point is −6.1°C, which isn't low enough, and at 15 g it's −9.3°C, which is more than enough. So the answer lies between 10 and 15 g. Since −8°C is a bit more than halfway from −6.1 to −9.3, about 13 g is needed. Choice D would work but isn't the smallest amount, and choices A and B don't lower the freezing point far enough."},
 {id:"b-s24",s:"science",t:"data",d:"easy",p:"light",q:"In Experiment 1, which light color produced the shortest seedlings?",c:["White", "Red", "Blue", "Green"],a:3,x:"Green light produced an average height of 6.1 cm, the smallest in the table.",xl:"Compare the heights in Experiment 1: white 12.5, red 14.2, blue 9.8, green 6.1 and darkness 18.9 cm. The smallest is green, at 6.1 cm. Choice C, blue, is the second shortest, so read all the values before deciding. Plants reflect most green light rather than absorbing it (that's why leaves look green), which helps explain why green light supported the least growth."},
 {id:"b-s25",s:"science",t:"models",d:"medium",p:"light",q:"A student concluded that darkness is the best condition for growing healthy bean plants because the seedlings in darkness were tallest. Which result from Experiment 1 most weakens this conclusion?",c:["The red-light seedlings were taller than the white-light seedlings.", "All groups received the same amount of water.", "The blue-light seedlings had dark green leaves.", "The seedlings grown in darkness had yellow leaves."],a:3,x:"Yellow leaves show the dark-grown seedlings lacked healthy green color, so being tallest doesn't mean being healthiest.",xl:"The student assumes that the tallest plants are the healthiest. But the dark-grown seedlings had yellow leaves, while healthy leaves are green from the chlorophyll plants use to make food. That suggests the tall, yellow seedlings were stretching in search of light, not thriving. Choices A and C describe other groups and don't address the darkness group. Choice B is a controlled condition, so it can't weaken the conclusion. To weaken a claim, look for evidence that its key assumption is wrong."},
 {id:"b-s26",s:"science",t:"design",d:"easy",p:"light",q:"Which of the following was NOT kept the same for every group in Experiment 1?",c:["Temperature", "Daily amount of water", "Color of light", "Type of soil"],a:2,x:"Light color was the variable being tested, so it changed from group to group.",xl:"The passage says every group was kept at 25°C, given 20 mL of water daily, and planted in the same soil. Those are the controlled variables. Light color was deliberately changed, since it's what Experiment 1 tested, so it's the one that was NOT kept the same. \"NOT\" questions are easy to misread, so circle that word and look for the choice that differs from the others."},
 {id:"b-s27",s:"science",t:"data",d:"medium",p:"light",q:"According to Experiment 2, as brightness increased from 25% to 100%, the seedlings':",c:["height increased and leaf mass increased.", "height decreased and leaf mass decreased.", "height increased and leaf mass decreased.", "height decreased and leaf mass increased."],a:3,x:"Height fell from 15.8 to 12.5 cm while leaf mass rose from 0.6 to 1.6 g.",xl:"Read each column of Experiment 2 from top to bottom. Height goes 15.8, 13.9, 12.5 cm, so it decreases as brightness increases. Leaf mass goes 0.6, 1.1, 1.6 g, so it increases. That's choice D. Many students assume brighter light makes everything grow more, but the data show the plants grew shorter while building heavier leaves. Trust the table, not your expectations."},
 {id:"b-s28",s:"science",t:"data",d:"medium",p:"light",q:"If a group of seedlings were grown under white light at 75% brightness, its average height would most likely be closest to:",c:["11.5 cm", "13.2 cm", "14.8 cm", "16.5 cm"],a:1,x:"75% is between 50% (13.9 cm) and 100% (12.5 cm), so the height should be between those values, about 13.2 cm.",xl:"75% brightness falls halfway between 50% and 100%, so the height should fall roughly halfway between 13.9 cm and 12.5 cm. The midpoint is about 13.2 cm. Choice A is shorter than the 100% group and D is taller than the 25% group, so both break the pattern. Choice C is taller than the 50% group, which would mean height went up as brightness increased. When estimating, find the two closest data points and stay between them."},
 {id:"b-s29",s:"science",t:"design",d:"medium",p:"light",q:"Why did the students grow 10 seedlings in each group and report the average, rather than growing just 1 seedling per group?",c:["To make the seedlings grow faster", "To make sure every seedling received the same color of light", "To reduce the effect of natural differences between individual seedlings", "To use up all the soil they had"],a:2,x:"Individual plants vary naturally. Averaging 10 makes it more likely that differences between groups come from the light, not chance.",xl:"Even under identical conditions, some seedlings grow taller than others just by chance, because of differences in the seeds. If each group had only one plant, one unusually strong or weak seed could make a condition look better or worse than it really is. Averaging 10 seedlings smooths out that random variation, making the results more reliable. The number of plants doesn't affect growth speed (A) or light color (B). Larger sample sizes and repeated trials are among the ACT's most common experimental-design ideas."},
 {id:"b-s30",s:"science",t:"models",d:"hard",p:"light",q:"A student hypothesized that bean seedlings grow taller in brighter light. Do the results of Experiment 2 support this hypothesis?",c:["Yes, because the seedlings at 100% brightness had the most leaf mass.", "No, because the seedlings grew shorter as brightness increased.", "Yes, because the seedlings at 25% brightness were the tallest.", "No, because brightness had no effect on the seedlings."],a:1,x:"Height went down (15.8 → 12.5 cm) as brightness went up, which is the opposite of the hypothesis.",xl:"The hypothesis is specifically about height. In Experiment 2, the seedlings were tallest at 25% brightness (15.8 cm) and shortest at 100% (12.5 cm), so brighter light went with shorter plants. That contradicts the hypothesis. Choice A is true, but leaf mass isn't what the hypothesis is about. Choice C states a correct fact but draws the wrong conclusion from it, and D is false because height and leaf mass both changed. Make sure the evidence matches the exact variable in the hypothesis."},
 {id:"b-s31",s:"science",t:"models",d:"medium",p:"trout",q:"Scientists 1 and 3 would most likely agree that the trout are harmed by:",c:["low levels of dissolved oxygen.", "smallmouth bass eating young trout.", "overfishing by anglers.", "rising phosphorus levels in shallow water only."],a:0,x:"Scientist 1 blames warm water holding less oxygen, and Scientist 3 blames bacteria using up oxygen in deep water. Both involve low oxygen.",xl:"Look for the common thread in the two explanations. Scientist 1 says warmer water holds less dissolved oxygen, squeezing trout into a small oxygen-rich zone. Scientist 3 says decomposing algae use up the oxygen in deep water. Different causes, but both say low oxygen harms the trout. Choice B is only Scientist 2's view, overfishing (C) is never mentioned, and D misstates Scientist 3, who focuses on deep water. For \"would agree\" questions, find an idea that appears in both viewpoints."},
 {id:"b-s32",s:"science",t:"models",d:"medium",p:"trout",q:"Which finding, if true, would most strengthen Scientist 2's explanation?",c:["Lake Arden's surface temperature rose by 3°C instead of 2°C.", "Trout in Lake Arden are found mostly in deep water during summer.", "Phosphorus levels in Lake Arden have risen even faster than reported.", "In a nearby lake with similar warming and runoff but no bass, the trout population stayed steady."],a:3,x:"A similar lake without bass but with the same warming and runoff kept its trout, pointing to bass as the key difference.",xl:"To strengthen one explanation, look for evidence that rules out the others. A nearby lake with the same warming and the same runoff but no bass would isolate the bass as the main difference. If that lake's trout stayed steady, it would suggest warming and runoff alone don't cause the decline, supporting Scientist 2. Choice A supports Scientist 1 and C supports Scientist 3. Choice B fits Scientists 1 and 3, who say trout seek cold deep water. A comparison that changes only one factor is the strongest kind of evidence."},
 {id:"b-s33",s:"science",t:"models",d:"easy",p:"trout",q:"Scientist 1 would most likely predict that if Lake Arden's summer temperatures continued to rise, the trout population would:",c:["recover quickly.", "stay about the same.", "continue to decline.", "be replaced entirely by bass."],a:2,x:"Scientist 1 blames warming for the decline, so more warming should mean more decline.",xl:"Scientist 1 says warmer water holds less oxygen and shrinks the cold, oxygen-rich zone trout need. If temperatures keep rising, that zone should shrink further, so Scientist 1 would predict the trout population keeps falling. Choices A and B contradict Scientist 1's reasoning. Choice D brings in bass, which is Scientist 2's idea, not Scientist 1's. For prediction questions, apply only the reasoning of the scientist named in the question."},
 {id:"b-s34",s:"science",t:"models",d:"medium",p:"trout",q:"Which finding would most weaken Scientist 3's explanation?",c:["Phosphorus levels in the lake have tripled in 20 years.", "Algae blooms have become larger in recent summers.", "Oxygen levels in the lake's deep water have not changed in 20 years.", "Smallmouth bass are now common in the lake."],a:2,x:"Scientist 3 says decaying algae use up deep-water oxygen. If deep-water oxygen hasn't changed, that mechanism isn't happening.",xl:"Scientist 3's explanation depends on a chain of events: fertilizer, algae blooms, decomposition, and then loss of oxygen in deep water. If deep-water oxygen levels haven't changed, the last link in the chain is broken, which seriously weakens the explanation. Choices A and B actually support Scientist 3. Choice D relates to Scientist 2, and bass being common doesn't disprove the runoff explanation. To weaken an explanation, attack the key step it depends on."},
 {id:"b-s35",s:"science",t:"design",d:"hard",p:"trout",q:"Which study would best test Scientist 3's explanation?",c:["Count the number of bass caught in the lake each year.", "Measure the lake's surface temperature every summer for 10 years.", "Measure deep-water oxygen levels before and after algae blooms, and compare trout numbers in nearby lakes with and without farm runoff.", "Count the number of trout eggs laid each spring."],a:2,x:"Scientist 3's claim links runoff and algae to lost deep-water oxygen, so the test should measure exactly those things.",xl:"A good test measures the factors the explanation depends on. Scientist 3 claims runoff causes algae blooms that use up oxygen in deep water. Checking whether deep-water oxygen drops after blooms tests the mechanism, and comparing lakes with and without runoff tests whether runoff matters for trout. Choice A tests Scientist 2's explanation, and B tests Scientist 1's. Choice D measures trout but doesn't connect the result to runoff at all."},
 {id:"b-s36",s:"science",t:"models",d:"easy",p:"trout",q:"Which scientist's explanation depends on a species that was introduced to Lake Arden?",c:["Scientist 1 only", "Scientist 2 only", "Scientist 3 only", "Scientists 2 and 3 only"],a:1,x:"Only Scientist 2 blames smallmouth bass, which were \"first found in Lake Arden 18 years ago.\"",xl:"Scientist 2's explanation centers on smallmouth bass, a fish first found in the lake 18 years ago, which makes it an introduced species. Scientist 1 blames warming, and Scientist 3 blames fertilizer and algae, which aren't described as newly introduced species. So only Scientist 2's explanation depends on one. Choice D is tempting because Scientist 3 mentions bacteria and algae, but those aren't described as new arrivals. Read each viewpoint and note its main cause in a word or two."},
 {id:"b-s37",s:"science",t:"models",d:"hard",p:"trout",q:"Suppose new measurements show that oxygen in Lake Arden's deep water has dropped sharply, while the lake's surface water has also warmed. These results are consistent with which scientists' explanations?",c:["Scientist 1 only", "Scientist 2 only", "Scientists 1 and 3 only", "Scientists 1, 2 and 3"],a:3,x:"Warming fits Scientist 1, deep-water oxygen loss fits Scientist 3, and nothing in the results rules out bass (Scientist 2).",xl:"\"Consistent with\" means the results don't contradict an explanation, not that they prove it. Surface warming fits Scientist 1, and a drop in deep-water oxygen fits Scientist 3. These results say nothing about bass, so they don't contradict Scientist 2 either; bass could still be harming trout. That makes the results consistent with all three explanations. Choice C is the trap: it picks the explanations the results directly support, but the question asks which ones they are consistent with. Read the exact wording of these questions carefully."},
 {id:"b-s38",s:"science",t:"data",d:"easy",p:"sound",q:"According to Table 1, what is the speed of sound in air at 20°C?",c:["319 m/s", "331 m/s", "343 m/s", "355 m/s"],a:2,x:"The 20°C row in Table 1 shows 343 m/s, matching the value for air in Figure 1.",xl:"Find 20°C in Table 1 and read across: 343 m/s. Figure 1 confirms this, since it lists air at 20°C as 343 m/s as well. The other choices are the speeds at −20°C, 0°C and 40°C. When a table and a graph share a value, use one to check the other."},
 {id:"b-s39",s:"science",t:"data",d:"medium",p:"sound",q:"Based on Table 1, the speed of sound in air at 30°C would most likely be closest to:",c:["337 m/s", "349 m/s", "355 m/s", "361 m/s"],a:1,x:"The speed rises 12 m/s for every 20°C, about 6 m/s per 10°C. So at 30°C it's about 343 + 6 = 349 m/s.",xl:"Table 1 shows the speed rising by exactly 12 m/s for every 20°C increase (319, 331, 343, 355). That's 6 m/s per 10°C. Since 30°C is 10°C above 20°C, add 6 to 343 to get 349 m/s. That also lands halfway between 343 (20°C) and 355 (40°C), as it should. Choice C is the 40°C value, and D goes past it."},
 {id:"b-s40",s:"science",t:"data",d:"easy",p:"sound",q:"According to Figure 1, sound travels fastest through which material?",c:["Air", "Water", "Glass", "Steel"],a:3,x:"Steel has the highest speed in Figure 1: 5,960 m/s.",xl:"Compare the speeds in Figure 1: air 343, water 1,480, glass 4,540, and steel 5,960 m/s. The greatest is steel. Sound generally travels fastest through stiff solids, more slowly through liquids, and slowest through gases, which matches this graph. For \"greatest\" or \"least\" questions, scan the entire column before choosing."},
 {id:"b-s41",s:"science",t:"data",d:"medium",p:"sound",q:"Based on Figure 1, sound travels through water about how many times as fast as it travels through air at 20°C?",c:["2", "4", "10", "17"],a:1,x:"1,480 ÷ 343 is about 4.3, so sound is roughly 4 times as fast in water.",xl:"\"How many times as fast\" calls for division: 1,480 ÷ 343. Estimating, 343 × 4 = 1,372, which is close to 1,480, so the answer is about 4. Choice C would require about 3,430 m/s, and D is closer to steel's speed compared with air (5,960 ÷ 343 ≈ 17). Rounding to friendly numbers (1,500 ÷ 350) makes these estimates quick."},
 {id:"b-s42",s:"science",t:"data",d:"medium",p:"sound",q:"At 20°C, about how long would it take sound to travel 686 m through air?",c:["0.5 s", "1 s", "2 s", "4 s"],a:2,x:"Time = distance ÷ speed = 686 ÷ 343 = 2 seconds.",xl:"Use time = distance ÷ speed. The speed of sound in air at 20°C is 343 m/s, so 686 m ÷ 343 m/s = 2 s. Notice that 686 is exactly 2 × 343, which makes the math easy. Choice A comes from dividing the other way (343 ÷ 686). Writing units on each number helps: m ÷ (m/s) leaves seconds, which is what you want."},
 {id:"b-s43",s:"science",t:"models",d:"medium",p:"sound",q:"A student claims that sound always travels faster in warmer air. Do the data in Table 1 support this claim?",c:["Yes, because the speed of sound increased each time the temperature increased.", "Yes, because sound travels fastest in steel.", "No, because the speed of sound decreased as temperature increased.", "No, because Table 1 does not include any temperatures above 0°C."],a:0,x:"Every increase in temperature in Table 1 comes with a higher speed: 319, 331, 343, 355 m/s.",xl:"To test the claim, check whether speed rises every time temperature rises. In Table 1, going from −20°C to 0°C to 20°C to 40°C, the speed goes 319, 331, 343 and 355 m/s, increasing at each step. So the data support the claim, at least for the temperatures tested. Choice B uses Table 2, which is about materials, not temperature. Choice C misreads the trend, and D is false because the table includes 20°C and 40°C."},
 {id:"b-s44",s:"science",t:"data",d:"easy",p:"enzyme",q:"In Experiment 1, the greatest volume of oxygen was produced at a pH of:",c:["3", "5", "7", "9"],a:2,x:"At pH 7, 16 mL of oxygen was produced, the most in Experiment 1.",xl:"Compare the oxygen volumes in Experiment 1: 2, 9, 16, 11 and 3 mL for pH 3, 5, 7, 9 and 11. The largest is 16 mL, at pH 7. Activity rises toward pH 7 and falls on either side, a typical pattern for enzymes, which work best at a particular pH. Choice D, pH 9, is the second highest, so check every row before answering."},
 {id:"b-s45",s:"science",t:"data",d:"easy",p:"enzyme",q:"In Experiment 2, which temperature produced the most oxygen?",c:["5°C", "25°C", "45°C", "65°C"],a:2,x:"45°C produced 19 mL, more than any other temperature tested.",xl:"In Experiment 2, the oxygen volumes are 6 mL at 5°C, 16 mL at 25°C, 19 mL at 45°C and 4 mL at 65°C. The highest is 19 mL at 45°C. Choice B is the standard condition used in the other experiments, which is a trap if you don't read the Experiment 2 table itself. The sharp drop at 65°C suggests the heat damaged the enzyme."},
 {id:"b-s46",s:"science",t:"data",d:"medium",p:"enzyme",q:"Based on Experiment 3, if 2 mL of potato extract were used, the volume of oxygen produced in 60 seconds would most likely be closest to:",c:["2 mL", "4 mL", "7 mL", "12 mL"],a:2,x:"2 mL is halfway between 1 mL (4 mL of oxygen) and 3 mL (10 mL of oxygen), so expect about 7 mL.",xl:"2 mL of extract falls halfway between the 1 mL and 3 mL trials, which produced 4 mL and 10 mL of oxygen. Halfway between 4 and 10 is 7 mL. Choice B matches the 1 mL trial, so it ignores the extra extract, and D is more than the 3 mL trial produced. For interpolation questions, find the two neighboring rows and pick a value between their results."},
 {id:"b-s47",s:"science",t:"design",d:"medium",p:"enzyme",q:"Which factors were held constant in Experiment 2?",c:["Temperature and pH", "pH and volume of potato extract", "Temperature and volume of potato extract", "Volume of oxygen and temperature"],a:1,x:"Experiment 2 changed only temperature, using the standard 5 mL of extract at pH 7.",xl:"The passage says each trial used 5 mL of extract at pH 7 and 25°C \"unless stated otherwise.\" Experiment 2 changed temperature, so pH (7) and extract volume (5 mL) stayed the same. That's choice B. Temperature can't be held constant in an experiment that varies it, ruling out A and C. The volume of oxygen (D) was the measured result. Read general setup sentences like \"unless stated otherwise\" carefully, since they define the controls."},
 {id:"b-s48",s:"science",t:"models",d:"hard",p:"enzyme",q:"A student hypothesized that increasing the temperature always increases catalase activity. Do the results of Experiment 2 support this hypothesis?",c:["Yes, because oxygen production increased from 5°C to 45°C.", "Yes, because 65°C produced the most oxygen.", "No, because oxygen production was the same at every temperature.", "No, because oxygen production dropped sharply from 45°C to 65°C."],a:3,x:"Activity rose up to 45°C but fell to 4 mL at 65°C, so higher temperature doesn't always increase activity.",xl:"The key word in the hypothesis is \"always.\" Oxygen production increased from 5°C to 45°C, but it fell sharply from 19 mL to 4 mL at 65°C. One clear counterexample is enough to show that \"always\" is false, so the results don't support the hypothesis. Choice A describes only part of the data and ignores the drop. Choice B misreads the table, and C is false. Enzymes usually work faster as temperature rises, up to a point where heat begins to damage them."},
 {id:"b-s49",s:"science",t:"design",d:"easy",p:"enzyme",q:"In Experiment 3, the independent variable was the:",c:["volume of potato extract.", "pH of the mixture.", "temperature of the mixture.", "volume of oxygen produced."],a:0,x:"Experiment 3 deliberately varied the volume of extract (1, 3, 5 and 7 mL).",xl:"The independent variable is what the experimenters chose to change. In Experiment 3, the students used 1, 3, 5 and 7 mL of potato extract, so extract volume is the independent variable. pH and temperature (B and C) stayed at the standard pH 7 and 25°C. The volume of oxygen (D) is the dependent variable, the result they measured. In each experiment's table, the left column is usually the independent variable."},
 {id:"b-s50",s:"science",t:"data",d:"hard",p:"enzyme",q:"Based on Experiments 1 and 2, which combination of conditions would most likely produce the most oxygen in 60 seconds, using 5 mL of extract?",c:["pH 7 and 45°C", "pH 9 and 25°C", "pH 7 and 65°C", "pH 3 and 45°C"],a:0,x:"pH 7 was best in Experiment 1, and 45°C was best in Experiment 2.",xl:"Combine the best result from each experiment. In Experiment 1, pH 7 produced the most oxygen (16 mL). In Experiment 2, 45°C produced the most (19 mL), while 65°C produced very little. So pH 7 at 45°C should give the most oxygen. Choice C pairs the right pH with a temperature that nearly stopped the reaction, and D pairs the right temperature with a pH that nearly stopped it. Choice B uses pH 9, which was worse than pH 7."}
);

/* ---------- English essays in ACT format (replace the old single-sentence questions) ---------- */
Object.assign(PASS,{
rings:`Reading the Rings

[1]
In 1904, an astronomer [[named Andrew Ellicott Douglass]] began studying the stumps of ponderosa pines in northern Arizona. He wasn't interested in the trees for their own [[sake; he]] wanted to know whether their growth rings held a record of sunspot cycles. A tree adds one ring each year, and wet years produce wide rings while dry years produce narrow ones. As a result, trees growing in the same region share the same pattern of wide and narrow rings.

[2]
Douglass never found a clear link to the sun. [[Instead,]] he discovered a method that would change several sciences. He realized that the pattern of rings could work like a bar code. By matching the rings of a living tree with [[that]] of an old beam or a buried log, a researcher could count backward and assign an exact calendar year to every ring.

[3]
The method soon proved its value. In 1929, Douglass's team found a charred beam at an archaeological site in eastern Arizona whose rings filled a gap in their records. For archaeologists, the discovery was [[kind of a huge deal]]. Within days, the team was able to date dozens of [[ancient pueblos that had been built long ago]], buildings that archaeologists had never been able to place in time.

[4]
Today, tree rings help scientists study everything from wildfires to droughts. Scars left in the rings by past fires [[showing]] how often forests burned before people began putting fires out. Long stretches of narrow rings reveal droughts that lasted for decades. Climate scientists [[carefully examine]] these records to understand how rainfall has changed over centuries.

[5]
Douglass never answered the question that first drew him to the forest. But by learning to read the rings, he gave scientists a calendar written in wood, one that grows longer every time a researcher measures a beam pulled from an old building.`,
nightmkt:`The Friday Night Market

[1]
Every Friday from June to September, the parking lot behind Larkin's old train station becomes a night market. By seven o'clock, more than sixty vendors have set up tables under strings of paper [[lanterns, and they sell]] everything from hand-pressed tortillas to secondhand records.

[2]
The market began five years ago as an experiment. The city council, worried that downtown emptied out after the offices closed, offered free permits to anyone willing to sell food or crafts on Friday nights. Only nine vendors signed up for the first market. [[For example,]] a local food writer posted photos of the crowded tables online, and within a month the waiting list for a spot was longer than the list of vendors.

[3]
Today the market [[has became]] one of the city's most popular events. On a warm evening, as many as four thousand people wander between the stalls. [[The lanterns are made of paper.]] Families share plates of dumplings at folding tables, while teenagers crowd around a man who repairs [[bicycles, guitars, and, radios]] for whatever customers can afford to pay.

[4]
Not every downtown business owner was pleased at first. Some restaurant owners worried that the market would steal [[there]] customers. The opposite happened. Visitors who arrive early often eat dinner at a nearby restaurant before the market opens, and many [[stay late, buying]] dessert at the café on the corner after the vendors pack up.

[5]
For Lena Ortiz, who sells handmade soap, the market has meant more than extra income. "I used to sell only online," she said. "Here, people pick up a bar, smell it, and tell me about their grandmother's garden." [[It's]] conversations like these, she explained, that keep her coming back every week.`,
sourdough:`The Living Loaf

[1]
Sourdough is one of the oldest kinds of leavened bread, [[yet]] it requires no store-bought yeast at all. Instead, bakers rely on a starter: a mixture of flour and water [[that has been left to sit and rest]] until it bubbles with life.

[2]
The bubbles come from microorganisms. Wild yeasts, which float in the air and live on the surface of [[grain feed]] on the sugars in the flour and release carbon dioxide gas. That gas becomes trapped in the dough and makes the bread rise. [[At the same time,]] bacteria in the starter produce lactic acid, which gives sourdough its tangy flavor.

[3]
Keeping a starter alive takes patience. A baker must "feed" it every day or two by discarding some of the mixture and adding fresh flour and water. [[If the starter is neglected, it grows weak and sluggish, and bread made from it turns out dense.]] Some bakers keep the same starter going for decades, and a few bakeries claim that [[its]] starters are more than a century old.

[4]
Because a starter works slowly, sourdough takes far longer to make than ordinary bread. A typical loaf rises for eight to twelve [[hours; compared with]] about two hours for bread made with commercial yeast. Many bakers, however, consider that slowness an advantage, since the long rise gives the bacteria time to develop flavor.

[5]
In recent years, sourdough has enjoyed a [[huge massive]] surge in popularity among home bakers. One reason may be that a starter feels less like an ingredient than like a pet: something to care for, name, and share. Bakers often give portions of their starters to friends, so a single jar of bubbling flour and water can [[give rise to]] dozens of loaves in kitchens across a town.`,
shelter:`What Biscuit Taught Me

[1]
The summer before tenth grade, I signed up to volunteer at the Cedar County Animal Shelter. I imagined spending my afternoons cuddling puppies. [[Instead,]] my first assignment was scrubbing kennels.

[2]
The shelter's manager, a soft-spoken woman named Ms. Okafor, [[blurted out]] that clean kennels kept the animals healthy. "Nobody adopts a sick dog," she said. She handed me rubber gloves, a bucket, and [[a brush that was stiff]]. For two weeks, that brush was my closest companion.

[3]
Slowly, I was given more responsibility. I learned to read a dog's [[body language: a]] lowered tail and flattened ears meant fear, while a loose, wagging body meant a dog was ready to play. I learned which cats liked to be held and which preferred to be left [[alone, I]] even learned to give medicine to a stubborn beagle named Biscuit by hiding the pill in a spoonful of peanut butter.

[4]
Biscuit had been at the shelter longer than any other dog. Visitors [[tends]] to walk past his kennel because he was nine years old and barked whenever someone came near. But I knew the bark was only nervousness. Once he trusted you, he would lean his whole body against your legs and sigh.

[5]
In August, a retired couple stopped to read the card on Biscuit's kennel. I told them about the peanut butter trick and the leaning. They came back the next day, and the day after that. [[On the third day;]] they took him home.

[6]
I still volunteer at the shelter every summer. [[I've scrubbed a lot of kennels since then.]] But whenever I think about why I keep going back, I remember Biscuit's tail waving like a flag as he climbed into the back seat of their car.`,
clocktower:`The Clock on the Green

[1]
For more than a century, the clock tower on the Hartwell town green has kept time for the town. Farmers once set their pocket watches by its chimes, and generations of students [[moseyed]] to class when they heard it strike eight.

[2]
By 2015, however, the clock had stopped. [[It's]] iron gears had rusted, and water leaking through the roof had warped the wooden face. Repairing it would cost more than [[$200,000, and the town's]] budget had no room for the expense.

[3]
[[Similarly,]] a group of high school students decided to help. They organized a fundraising campaign, selling T-shirts printed with the tower's image and recording interviews with older residents who remembered the clock's chimes. The interviews were posted online, and donations began arriving from former residents who had moved [[away; some]] as far as Alaska and Portugal.

[4]
It took three years to raise the money. A clockmaker from a neighboring state then spent eight months cleaning each gear by hand and replacing the parts that could not be saved. [[The clockmaker also repaired several church bells in the region.]]

[5]
On the morning the clock was restarted, nearly the entire town gathered on the green. When the tower struck nine, the crowd [[let out a cheer that was loud and that could be heard from far away]]. Some of the students who had started the campaign were in college by then, but they came home to hear it.`
