   Statistics & Probability 12-15%, Integrating Essential Skills 20%), and
   Reading follows ACT's categories (Key Ideas & Details 44-52%, Craft &

const PASS = {
bees:`~ SOCIAL SCIENCE: This passage is adapted from "Bees on the Roof," an original article written for ACT Study Lab. The people and the city in it are fictional.

On the roofs of a dozen office buildings downtown, honeybee hives now sit beside air-conditioning units. The city's rooftop beekeeping program began six years ago with two hives and a single volunteer, Rosa Delgado, a retired chemistry teacher who had kept bees on her family's farm as a child. Delgado assumed the project would last a season or two. Instead, building managers began calling her, asking whether their roofs could host hives as well.

The work itself is less glamorous than the rooftop views suggest. Each hive is a stack of wooden boxes, and every two weeks from April through September a volunteer climbs to the roof to inspect it: lifting out frames heavy with comb, looking for the queen's eggs, and watching for mites, the tiny parasites that are among the most serious threats to honeybee colonies. In late summer the volunteers harvest the extra honey, always leaving the bees enough to survive the winter. The program sells the honey in small jars at the downtown farmers' market, and the money pays for new equipment and for the protective suits the volunteers wear.

The program now has more than forty volunteers, many of whom had never seen a hive up close before they joined. Delgado trains each one herself. Her first lesson, she says, is not really about bees at all but about patience: a beekeeper who moves too quickly or bumps a frame against the box will soon have an angry colony. Several volunteers keep detailed notes on which flowers the bees visit each week, and the program shares those notes with the city's parks department. Office workers have started eating lunch near the hives, and a local elementary school now brings students to watch the volunteers through a glass door on one of the roofs.

Supporters point out that city bees often thrive. Parks, street trees, and balcony gardens bloom at different times, giving bees a steady supply of nectar from early spring to late fall. Some rural areas, by contrast, are planted with a single crop that flowers for only a few weeks. City honey even tastes different from one month to the next, because it reflects whatever happens to be blooming nearby: linden trees in June, clover in vacant lots, asters in the fall.

Not everyone is convinced the program helps. Dr. Aaron Pike, an entomologist at the state university, notes that honeybees are not native to North America and may compete with wild bee species for the same flowers. "Adding honeybees is a bit like opening a new restaurant in a neighborhood that already has plenty," he said. "If there isn't enough food to go around, someone goes hungry." Pike argues that cities would do more for pollinators by planting native flowers than by adding hives.

Some evidence supports Pike's worry. In a study of community gardens in another city, researchers counted wild bees on the same kinds of flowers for three summers. In the gardens closest to large groups of honeybee hives, they recorded fewer visits by wild bees than in similar gardens farther away. The researchers cautioned, however, that their study could not show whether the honeybees had pushed the wild bees out or whether wild bees had simply been less common in those neighborhoods to begin with. Pike says that uncertainty is exactly why cities should be careful. "We don't need to prove harm before we plant native flowers," he said. "Native flowers help every kind of bee."

Delgado does not dismiss the concern. This year, the program began requiring every building that hosts a hive to plant native wildflowers in nearby planters. "The bees got people's attention," she said. "Now we can use that attention to help all pollinators, not just ours."`,
seeds:`Students studied how temperature affects the germination of radish seeds. For each temperature, 50 seeds were placed on damp paper towels in a sealed container kept in the dark. After 5 days, the students counted how many seeds had sprouted. Figure 1 shows the results.

{{line Figure 1; x=Temperature (°C); y=Seeds germinated (%); : 10,12 15,46 20,78 25,90 30,84 35,40}}`

ice:`Two students explain why ice floats on liquid water.

 {id:"b-m13",s:"math",t:"func",d:"medium",q:"What is the minimum value of f(x) = x² − 6x + 5 ?",c:["−9","−4","3","5"],a:1,x:"The vertex is at x = −b/(2a) = 3, and f(3) = 9 − 18 + 5 = −4.",xl:"A parabola that opens upward (positive x² term) has its minimum at the vertex. The x-coordinate of the vertex is −b/(2a) = −(−6)/(2·1) = 3. Plug that in to get the minimum value: f(3) = 9 − 18 + 5 = −4. Choice 3 is the x-value where the minimum happens, not the minimum value itself, which is a common trap. Choice 5 is just the y-intercept, f(0)."},
 {id:"b-m14",s:"math",t:"func",d:"medium",q:"A town's population is 2,000 and doubles every 5 years. What will the population be in 15 years?",c:["6,000","8,000","16,000","32,000"],a:2,x:"15 years is three doubling periods: 2,000 → 4,000 → 8,000 → 16,000.",xl:"Exponential growth multiplies by the same factor each period instead of adding the same amount. Fifteen years contains 15 ÷ 5 = 3 doubling periods. So the population is 2,000 × 2³ = 2,000 × 8 = 16,000. Choice 6,000 comes from adding 2,000 three times (linear thinking), and 8,000 comes from doubling only twice. The formula P = P₀ · 2^(t/5) works for any number of years."},
 {id:"b-m15",s:"math",t:"alg",d:"medium",q:"A theater sold 50 tickets for a total of $520. Adult tickets cost $12 and child tickets cost $8. How many adult tickets were sold?",c:["20","25","30","35"],a:2,x:"Solve a + c = 50 and 12a + 8c = 520 to get a = 30.",xl:"Set up two equations: a + c = 50 for the number of tickets and 12a + 8c = 520 for the money. From the first equation, c = 50 − a. Substitute: 12a + 8(50 − a) = 520, which becomes 4a + 400 = 520, so a = 30. Check it: 30 adults × $12 = $360 and 20 children × $8 = $160, which add to $520. You can also test each answer choice, starting with the middle values, if setting up the system feels slow."},
 {id:"b-m16",s:"math",t:"alg",d:"hard",q:"Which of the following is the solution set of |2x − 3| < 7 ?",c:["−2 < x < 5","x < 5","−5 < x < 2","x < −2 or x > 5"],a:0,x:"|2x − 3| < 7 means −7 < 2x − 3 < 7, which simplifies to −2 < x < 5.",xl:"An absolute value less than a number means the expression is trapped between the negative and positive of that number. So |2x − 3| < 7 becomes −7 < 2x − 3 < 7. Add 3 to all three parts to get −4 < 2x < 10, then divide by 2 to get −2 < x < 5. Choice D is the answer for \"greater than,\" which splits into two separate pieces. Choice B forgets the negative side, and C flips the signs."},
 {id:"b-m17",s:"math",t:"geo",d:"medium",q:"What are the center and radius of the circle (x − 2)² + (y + 3)² = 25 ?",c:["Center (2, −3), radius 5","Center (−2, 3), radius 5","Center (2, −3), radius 25","Center (−2, 3), radius 25"],a:0,x:"In (x − h)² + (y − k)² = r², the center is (h, k) and the radius is √25 = 5.",xl:"The standard form of a circle is (x − h)² + (y − k)² = r², where (h, k) is the center. Because the formula subtracts h and k, (x − 2) means h = 2, and (y + 3) = (y − (−3)) means k = −3. The number on the right is r², not r, so the radius is √25 = 5. Choice B flips the signs of the center, and C and D forget to take the square root. Both traps are very common, so check signs and the square root every time."},
 {id:"b-m18",s:"math",t:"trig",d:"hard",q:"If sin θ = 3/5 and θ is in Quadrant II, what is cos θ ?",c:["−4/5","−3/4","3/4","4/5"],a:0,x:"A 3-4-5 triangle gives |cos θ| = 4/5, and cosine is negative in Quadrant II.",xl:"Start with the reference triangle: if sin θ = 3/5, the opposite side is 3 and the hypotenuse is 5, so the adjacent side is 4 (a 3-4-5 triangle). That makes the size of cos θ equal to 4/5. Now think about the sign: in Quadrant II, x-values are negative, and cosine follows x, so cos θ = −4/5. Choice D ignores the quadrant, and B and C are tangent values (opposite over adjacent). Remember \"All Students Take Calculus\": in Quadrants I through IV, the positive functions are all, sine, tangent and cosine."},
 {id:"b-m19",s:"math",t:"num",d:"hard",q:"If log₂(x) = 5, what is the value of x?",c:["7","10","25","32"],a:3,x:"log₂(x) = 5 means 2⁵ = x, so x = 32.",xl:"A logarithm asks what exponent you need: log₂(x) = 5 means \"2 raised to the 5th power equals x.\" Rewrite it in exponential form: x = 2⁵ = 2 × 2 × 2 × 2 × 2 = 32. Choice 10 comes from multiplying 2 × 5, 7 from adding them, and 25 from computing 5² instead of 2⁵. To convert, the base of the log becomes the base of the power, and the answer to the log becomes the exponent."},
 {id:"b-m20",s:"math",t:"stat",d:"hard",q:"Two fair six-sided dice are rolled. What is the probability that the sum is 8?",c:["1/9","5/36","1/6","7/36"],a:1,x:"There are 36 equally likely outcomes, and 5 of them sum to 8: (2,6), (3,5), (4,4), (5,3), (6,2).",xl:"With two dice there are 6 × 6 = 36 equally likely outcomes, because each die is separate. List the pairs that add to 8: (2,6), (3,5), (4,4), (5,3) and (6,2). That's 5 outcomes, so the probability is 5/36. A common mistake is counting (3,5) and (5,3) as the same, which gives 3 outcomes; another is assuming every sum is equally likely, which gives 1/11. Listing the combinations takes 20 seconds and prevents both errors."},
 {id:"b-m21",s:"math",t:"num",d:"hard",q:"Which of the following is equivalent to (3 + 2i)(1 − i), where i = √−1 ?",c:["1 − i","3 − 2i","5 + i","5 − i"],a:3,x:"FOIL gives 3 − 3i + 2i − 2i², and since i² = −1 that's 3 − i + 2 = 5 − i.",xl:"Multiply complex numbers the same way you FOIL binomials. First: 3·1 = 3. Outer: 3·(−i) = −3i. Inner: 2i·1 = 2i. Last: 2i·(−i) = −2i². Combine to get 3 − i − 2i², and since i² = −1, −2i² becomes +2, giving 5 − i. Choice 5 + i comes from a sign error on the i terms, and 1 − i comes from treating i² as +1."},
 {id:"b-m22",s:"math",t:"ies",d:"easy",q:"There are 12 inches in 1 foot. How many inches are in 4.5 feet?",c:["13.5","45","48","54"],a:3,x:"4.5 × 12 = 54 inches.",xl:"To change feet to inches, multiply by 12, since each foot has 12 inches. So 4.5 × 12 = 4 × 12 + 0.5 × 12 = 48 + 6 = 54. Choice 48 forgets the half foot, and 45 just moves the decimal point. Choice 13.5 divides instead of multiplying. When converting to a smaller unit, you should end up with a bigger number."},
 {id:"b-m23",s:"math",t:"stat",d:"medium",q:"The data set 3, 7, 8, 12, 15 has a median of 8. If the value 20 is added to the set, what is the new median?",c:["8","10","11","12"],a:1,x:"With six values, the median is the average of the middle two: (8 + 12) ÷ 2 = 10.",xl:"The median is the middle value of an ordered list. Adding 20 gives six values: 3, 7, 8, 12, 15, 20. With an even number of values there is no single middle, so you average the two middle ones, 8 and 12: (8 + 12) ÷ 2 = 10. Choice 8 is the old median, and 12 picks just one of the middle values. Choice 11 is the mean of the original five values, not a median."},
 {id:"b-m24",s:"math",t:"func",d:"medium",q:"If f(x) = 3x − 1 and g(x) = x² + 1, what is f(g(2)) ?",c:["10","12","14","26"],a:2,x:"Work inside out: g(2) = 5, then f(5) = 14.",xl:"For a composite function, start with the inside function and work outward. First find g(2) = 2² + 1 = 5. Then plug that result into f: f(5) = 3(5) − 1 = 14. Choice 26 is g(f(2)), which does the functions in the wrong order: f(2) = 5, then g(5) = 26. Always evaluate the function closest to the x first."},
 {id:"b-s6",s:"science",t:"data",d:"easy",p:"ice",q:"According to Table 1, which substance has the greatest density?",c:["Liquid water at 4°C","Liquid water at 0°C","Ice at 0°C, no bubbles","Vegetable oil at 20°C"],a:0,x:"Liquid water at 4°C has a density of 1.000 g/cm³, the largest value in the table.",xl:"Compare the numbers in the density column: 1.000, 0.9998, 0.917 and 0.920. The largest is 1.000 g/cm³, for liquid water at 4°C. Choice B is a close trap, since 0.9998 is very slightly smaller than 1.000. When values are this close, compare them digit by digit after the decimal point. Science questions like this reward reading the table carefully rather than knowing outside facts."},
 {id:"b-s7",s:"science",t:"models",d:"medium",p:"ice",q:"The density of bubble-free ice in Table 1 best supports which student's explanation?",c:["Student 1, because ice with no bubbles is less dense than liquid water.","Student 1, because ice with no bubbles is denser than liquid water.","Student 2, because ice with no bubbles is less dense than liquid water.","Student 2, because air bubbles increase the density of ice."],a:0,x:"Bubble-free ice (0.917) is still less dense than liquid water (0.9998), so it floats without air, as Student 1 says.",xl:"Student 2 claims ice floats only because of trapped air, so ice with no bubbles should sink. But Table 1 shows that bubble-free ice has a density of 0.917 g/cm³, less than liquid water's 0.9998 g/cm³, so it would still float. That supports Student 1, who says ice is simply less dense than water because of its open molecular structure. Choice B gets the comparison backward, and C pairs the correct fact with the wrong student. For conflicting-viewpoint questions, check both the student and the reason, since each can be wrong separately."},
 {id:"b-s8",s:"science",t:"models",d:"medium",p:"ice",q:"Student 2 would most likely predict that a cube of bubble-free ice placed in liquid water at 0°C would:",c:["sink.","float.","dissolve immediately.","float halfway submerged."],a:0,x:"Student 2 says ice floats only because of trapped air, so ice with no bubbles would sink.",xl:"This question asks what Student 2 would predict, not what actually happens. Student 2's last sentence says that ice with no air bubbles would sink in liquid water. So by Student 2's reasoning, a bubble-free cube would sink, which is A. Choice B is what really happens according to Table 1, which is the trap: the question is about the student's model, not the data. Always answer \"would predict\" questions using only that person's stated reasoning."},
 {id:"b-s9",s:"science",t:"data",d:"hard",p:"ice",q:"Based on Table 1, if a cube of bubble-free ice were placed in vegetable oil at 20°C, it would most likely initially:",c:["float, because the ice is slightly less dense than the oil.","sink, because the ice is denser than the oil.","float, because the ice is denser than the oil.","sink, because the oil is less dense than water."],a:0,x:"Ice (0.917 g/cm³) is slightly less dense than the oil (0.920 g/cm³), so it would float.",xl:"An object floats in a liquid when it is less dense than that liquid. Table 1 gives 0.917 g/cm³ for bubble-free ice and 0.920 g/cm³ for vegetable oil, so the ice is very slightly less dense and would float. Choice B misreads the comparison, and C states the floating rule backward: denser things sink. Choice D compares the oil to water, which doesn't tell you anything about the ice. Close numbers like 0.917 and 0.920 are deliberate, so compare them carefully."},
 {id:"b-s10",s:"science",t:"design",d:"hard",p:"ice",q:"Which experiment would best test Student 2's explanation?",c:["Freeze water that has had its dissolved air removed, then see whether the ice floats in liquid water.","Measure the density of liquid water at several different temperatures.","Freeze water in containers of several different shapes.","Compare how fast ice melts in vegetable oil and in liquid water."],a:0,x:"Student 2's key claim is that air bubbles make ice float, so the best test makes ice without air and checks whether it floats.",xl:"A good test of a hypothesis changes the one factor the hypothesis depends on. Student 2's whole explanation depends on trapped air, so the best experiment removes the air and sees whether the ice still floats. If bubble-free ice floats, Student 2 is wrong; if it sinks, Student 2 is supported. B tests liquid water only, C tests container shape, and D tests melting speed, and none of those involves air bubbles. When a question asks how to test someone's idea, find the specific cause they name and change only that."}

maps:`~ PAIRED PASSAGES: Passage A is adapted from "Keep the Map in Your Head," an original essay. Passage B is adapted from "My Father's Atlas," an original memoir. Both were written for ACT Study Lab.

Passage A

For most of history, travelers found their way by studying a map before they set out and checking it along the route. That habit, some researchers argue, did more than prevent wrong turns. In studies of London taxi drivers, who must memorize thousands of streets to earn a license, scientists found that a brain region linked to spatial memory grew larger as the drivers trained. People who follow turn-by-turn directions from a phone rarely build that kind of mental picture. Ask a GPS user to sketch the route they drove that morning, and many cannot. The phone has done the remembering for them.

The difference may come down to what a traveler pays attention to. Someone reading a paper map has to connect it to the world outside the window: the bridge on the page is the bridge ahead, so the next turn must come right after it. A person following spoken directions, by contrast, can simply wait to be told what to do. In one experiment, volunteers who walked through an unfamiliar neighborhood using a map later drew more accurate sketches of the area than volunteers who had followed step-by-step directions on a screen, even though both groups reached the same destinations. Researchers describe the first group as building a "cognitive map," a flexible mental model that lets a person find a shortcut or recover after a wrong turn.

Skills like this tend to fade when they go unused. A person who once knew a dozen phone numbers by heart may find, after years of tapping names in a contact list, that she can no longer recall even one. Some researchers worry that navigation works the same way.

None of this means people should throw away their phones. But a few minutes spent looking at the whole map before a trip, noticing which way the river runs or where the highway bends, may keep sharp a skill we are in danger of losing.

Passage B

When my family moved to a new city, my father refused to use the navigation app on his phone. He had driven for forty years with a road atlas, he said, and he wasn't about to stop. Within a week he had missed my sister's soccer game, circled the same hospital parking garage three times, and arrived an hour late to his first day at a new job.

It was my mother who finally installed the app, while he was in the shower, and set the voice to the calmest one she could find. The next morning he drove me to school without a single wrong turn. He didn't mention the app, and neither did we, but that evening I noticed he had moved the atlas from the passenger seat to the floor under his own.

Navigation apps are easy to mock, but they solve real problems. They reroute drivers around accidents, warn of closed roads, and let a nervous new driver focus on traffic instead of street signs. For people with poor eyesight or a weak sense of direction, they can mean the difference between going out and staying home. My grandmother, who stopped driving at night after her vision began to fail, now rides with a neighbor to her book club across town twice a month, calling out each turn from the app before the neighbor reaches it.

There were things my father missed about the old way. With the atlas, he said, you could see the whole state at once and imagine all the places you might go. The phone showed him only the next few blocks.

My father uses the app now, though he still keeps the atlas under his seat. "Just in case," he says. I suspect he likes knowing he could still find his way without it.`,

 {id:"b-m27",s:"math",t:"ies",d:"easy",q:"The ratio of boys to girls in a class of 40 students is 3 : 5. How many girls are in the class?",c:["15", "24", "25", "30"],a:2,x:"3 + 5 = 8 parts, so each part is 40 ÷ 8 = 5 students. Girls = 5 × 5 = 25.",xl:"A ratio of 3 : 5 means the class splits into 3 + 5 = 8 equal parts. Each part is 40 ÷ 8 = 5 students. The girls get 5 parts, so there are 5 × 5 = 25 girls (and 15 boys). Choice A is the number of boys, so watch which group the question asks about. Choice B comes from 3/5 of 40, which treats the ratio as a fraction of the whole class."},
 {id:"b-m29",s:"math",t:"alg",d:"medium",q:"Which of the following is the solution set of 3 − 2x > 11?",c:["x > −4", "x < −4", "x > 4", "x < 4"],a:1,x:"Subtract 3: −2x > 8. Dividing by −2 flips the sign: x < −4.",xl:"Solve it like an equation, with one extra rule. Subtract 3 from both sides to get −2x > 8. Now divide both sides by −2, and because you're dividing by a negative number, the inequality sign flips: x < −4. Choice A is what you get if you forget to flip the sign, which is by far the most common mistake. Check with a number: x = −5 gives 3 + 10 = 13, which is greater than 11, so it works."},
 {id:"b-m31",s:"math",t:"func",d:"medium",q:"What is the vertex of the parabola y = (x − 3)² + 2?",c:["(−3, 2)", "(3, 2)", "(3, −2)", "(2, 3)"],a:1,x:"In vertex form y = (x − h)² + k, the vertex is (h, k). Here h = 3 and k = 2.",xl:"This equation is in vertex form, y = (x − h)² + k, where the vertex is (h, k). Matching it up, h = 3 and k = 2, so the vertex is (3, 2). The trap is choice A: the minus sign inside the parentheses means h is positive 3, not −3. You can check by plugging in x = 3: y = 0 + 2 = 2, and since a square is never negative, 2 is the lowest y-value, so (3, 2) is the bottom of the parabola."},
 {id:"b-m32",s:"math",t:"geo",d:"medium",q:"A circle has a circumference of 10π. What is its area?",c:["5π", "10π", "20π", "25π"],a:3,x:"C = 2πr = 10π, so r = 5. Area = πr² = 25π.",xl:"Start with the circumference formula: C = 2πr. Setting 2πr = 10π gives r = 5. Then use the area formula: A = πr² = π(5)² = 25π. Choice A stops at the radius, and B just repeats the circumference. A common error is to use the diameter (10) in the area formula, which gives 100π. Write both circle formulas at the top of your work so you don't mix them up."},
 {id:"b-m34",s:"math",t:"trig",d:"medium",q:"In right triangle ABC, angle C is the right angle and sin A = 3/5. What is tan A?",c:["3/4", "4/5", "4/3", "5/3"],a:0,x:"sin A = 3/5 means opposite = 3 and hypotenuse = 5, so adjacent = 4 and tan A = 3/4.",xl:"Remember SOH CAH TOA: sine is opposite over hypotenuse, so the side opposite A is 3 and the hypotenuse is 5. By the Pythagorean theorem (or the 3-4-5 triangle you should know by heart), the adjacent side is 4. Tangent is opposite over adjacent, so tan A = 3/4. Choice B is cos A, and C is the tangent of the other acute angle, B. Sketching the triangle and labeling sides takes 10 seconds and prevents these mix-ups."},
 {id:"b-m36",s:"math",t:"stat",d:"hard",q:"A bag holds 4 red marbles and 6 blue marbles. Two marbles are drawn at random without replacement. What is the probability that both are red?",c:["2/15", "4/25", "1/5", "2/5"],a:0,x:"First draw: 4/10. Second draw (3 red left out of 9): 3/9. Multiply: 4/10 × 3/9 = 12/90 = 2/15.",xl:"\"Without replacement\" means the first marble stays out, so the second draw has fewer marbles. The chance the first is red is 4/10. If it was red, 3 red marbles remain out of 9, so the chance the second is also red is 3/9. Multiply the two: (4/10)(3/9) = 12/90 = 2/15. Choice B, 4/25, comes from (4/10)(4/10), which would be correct only with replacement. Choice D is just the chance of one red marble."},
 {id:"b-m37",s:"math",t:"geo",d:"hard",q:"What is the distance between the points (1, 2) and (7, 10) in the coordinate plane?",c:["8", "10", "14", "100"],a:1,x:"The horizontal change is 6 and the vertical change is 8, so the distance is √(6² + 8²) = √100 = 10.",xl:"The distance formula is the Pythagorean theorem in disguise. The horizontal change is 7 − 1 = 6, and the vertical change is 10 − 2 = 8. Those are the legs of a right triangle, so the distance is √(6² + 8²) = √(36 + 64) = √100 = 10. Choice C adds the legs (6 + 8), and D forgets the square root. Spotting a 3-4-5 triangle (here doubled to 6-8-10) can save you the calculation."},
 {id:"b-r11",s:"reading",t:"main",d:"medium",p:"maps",q:"The main purpose of Passage A is to:",c:["suggest that relying only on turn-by-turn directions may weaken a navigation skill worth keeping.", "argue that people should stop using navigation apps entirely.", "explain how London taxi drivers earn their licenses.", "describe the history of maps from ancient times to today."],a:0,x:"Passage A presents evidence that maps build spatial memory, then suggests studying the map before trips, without giving up phones.",xl:"Main-purpose questions need an answer that covers the whole passage, not just one part. Passage A uses the taxi-driver studies and the sketching example to show that maps build a mental picture that phones don't. Then it says people shouldn't throw away their phones but should glance at the whole map to keep the skill sharp. Choice B is too extreme, since the passage directly says not to give up phones. Choice C is just one supporting detail, and D describes something the passage barely touches."},
 {id:"b-r12",s:"reading",t:"vocab",d:"medium",p:"maps",q:"As it is used in the last paragraph of Passage A, the word \"sharp\" most nearly means:",c:["pointed.", "strong and ready to use.", "sudden.", "harsh."],a:1,x:"Keeping a skill \"sharp\" means keeping it in good working condition, so \"strong and ready to use\" fits.",xl:"Words-in-context questions test what a word means in this sentence, not its most common meaning. The passage says glancing at a map \"may keep sharp a skill we are in danger of losing,\" so \"sharp\" describes a skill that is well practiced instead of fading. \"Pointed\" (A) is the everyday meaning, for knives and pencils, but skills don't have points. \"Sudden\" (C) fits phrases like \"a sharp turn,\" and \"harsh\" (D) fits \"a sharp tone.\" Try plugging each choice into the sentence and see which one keeps the meaning."},
 {id:"b-r13",s:"reading",t:"detail",d:"easy",p:"maps",q:"According to Passage B, during his first week in the new city, the narrator's father:",c:["got lost driving to the airport.", "arrived an hour late to his first day at a new job.", "bought a new road atlas.", "asked his daughter for directions."],a:1,x:"The passage lists three mishaps, including arriving \"an hour late to his first day at a new job.\"",xl:"Detail questions are answered directly in the text, so go back and find the line. Passage B says that within a week the father \"missed my sister's soccer game, circled the same hospital parking garage three times, and arrived an hour late to his first day at a new job.\" Choice B matches the last item exactly. The passage never mentions an airport, a new atlas, or asking for directions. Wrong choices on detail questions often sound reasonable, so always confirm the answer in the passage."},
 {id:"b-r14",s:"reading",t:"infer",d:"medium",p:"maps",q:"The last paragraph of Passage B most strongly suggests that the father:",c:["still takes pride in his ability to navigate without technology.", "plans to stop using the navigation app soon.", "regrets ever having learned to read a map.", "believes the app is usually wrong."],a:0,x:"He keeps the atlas \"just in case,\" and the narrator suspects he likes knowing he could still find his way without the app.",xl:"Inference questions ask what the passage strongly suggests, so the answer still needs clear support in the text. The father uses the app now but keeps the atlas under his seat, and the narrator says, \"I suspect he likes knowing he could still find his way without it.\" That points to pride in his old skill. Choice B contradicts \"My father uses the app now,\" and nothing supports C or D. Pick the inference that needs the smallest leap from what's actually written."},
 {id:"b-r15",s:"reading",t:"integ",d:"medium",p:"maps",q:"Both passages agree that navigation apps:",c:["are useful in at least some situations.", "cause the brain to shrink.", "are less reliable than paper maps.", "should be used only by new drivers."],a:0,x:"Passage A says not to \"throw away\" phones, and Passage B lists problems apps solve, so both see some value in them.",xl:"For \"both passages agree\" questions, each part of the answer must be supported by both passages. Passage A says, \"None of this means people should throw away their phones,\" and Passage B says apps \"solve real problems\" like rerouting around accidents. So both authors accept that apps are useful at least some of the time. Choice B goes far beyond Passage A, which talks about a brain region growing in taxi drivers, not shrinking in app users. Choices C and D aren't claimed by either passage."},
 {id:"b-r16",s:"reading",t:"integ",d:"medium",p:"maps",q:"Which statement best describes a difference in how the two passages support their points?",c:["Passage A relies mainly on research and general observations, while Passage B relies mainly on a personal family story.", "Passage A relies mainly on a personal story, while Passage B relies mainly on scientific studies.", "Passage A uses statistics, while Passage B uses no examples at all.", "Both passages rely mainly on interviews with experts."],a:0,x:"Passage A cites studies of taxi drivers, while Passage B is built around the narrator's father.",xl:"This question is about the type of evidence each author uses. Passage A cites studies of London taxi drivers and makes a general observation about GPS users, so it relies on research. Passage B is told in the first person and centers on the narrator's father's experiences, a personal story. Choice B reverses the two passages, a common trap on comparison questions. Neither passage quotes expert interviews (D), and Passage B is full of examples (C)."},
 {id:"b-r17",s:"reading",t:"integ",d:"hard",p:"maps",q:"The father's habit of keeping the road atlas \"just in case\" (Passage B) most closely reflects which idea from Passage A?",c:["People can keep using their phones while still preserving their map-reading skills.", "Taxi drivers must memorize thousands of streets.", "Most GPS users cannot sketch the route they drove that morning.", "Maps were invented to prevent wrong turns."],a:0,x:"Passage A recommends keeping phones but staying in touch with maps, which is what the father does by using the app and keeping the atlas.",xl:"To connect the passages, describe the father's behavior in general terms first: he uses the app but holds on to his old map skills. Passage A's conclusion recommends almost exactly that: don't throw away your phone, but take a few minutes with the map to keep the skill sharp. Choices B and C are real details from Passage A, but they don't match what the father does. Choice D isn't stated in Passage A at all. On integration questions, match the idea, not just shared words like \"map.\""},
 {id:"b-s11",s:"science",t:"data",d:"easy",p:"pend",q:"In Experiment 1, what was the period of the pendulum with a 100 cm string?",c:["1.42 s", "2.00 s", "2.01 s", "2.46 s"],a:2,x:"The Experiment 1 table lists a period of 2.01 s for a length of 100 cm.",xl:"Find the right table first. Experiment 1 is the one where length was varied, and the 100 cm row shows a period of 2.01 s. Choice B, 2.00 s, appears in Experiment 2, where the 100 g bob was tested, so it's a trap for students who read the wrong table. Choices A and D are the periods for 50 cm and 150 cm. On Science questions, check which experiment the question names before reading any numbers."},
 {id:"b-s12",s:"science",t:"data",d:"hard",p:"pend",q:"Based on Experiment 1, the period of a pendulum with a 300 cm string, released under the same conditions, would most likely be closest to:",c:["2.9 s", "3.5 s", "4.3 s", "5.7 s"],a:1,x:"The period keeps rising with length, but by less each time (about 0.4 s per 50 cm near 200 cm), so 300 cm gives about 3.5 s.",xl:"Extending a trend means looking at how the values change, not just which way they go. From 150 to 200 cm, the period rose from 2.46 to 2.84 s, about 0.38 s, and the increases are getting smaller each time. Adding two more steps of a little under 0.38 s each takes you from 2.84 s to about 3.5 s at 300 cm. Choice A barely increases, while C and D assume the period grows as fast as or faster than length. You can also notice that 4 times the length (25 to 100 cm) doubles the period, so the period grows much more slowly than the length."},
 {id:"b-s13",s:"science",t:"data",d:"hard",p:"pend",q:"According to Experiment 1, when the string length was doubled from 50 cm to 100 cm, the period:",c:["stayed about the same.", "increased by a factor of about 1.4.", "doubled.", "quadrupled."],a:1,x:"The period went from 1.42 s to 2.01 s, and 2.01 ÷ 1.42 ≈ 1.4.",xl:"To find a factor, divide the new value by the old one: 2.01 ÷ 1.42 is about 1.4. So doubling the length did not double the period (C), which would have required about 2.84 s. In fact, 2.84 s is the period at 200 cm, so you need four times the length to double the period. Choice A is wrong because 1.42 to 2.01 is a clear increase. Questions about \"how much\" a value changes usually need a quick division, not just a comparison."},
 {id:"b-s14",s:"science",t:"design",d:"medium",p:"pend",q:"Why did the students time 10 full swings and divide by 10, rather than timing a single swing?",c:["To reduce the effect of small errors in starting and stopping the stopwatch", "To make the pendulum swing faster", "To keep the release angle the same in every trial", "To increase the period of the pendulum"],a:0,x:"Timing many swings spreads any stopwatch reaction error over 10 swings, so each period is more accurate.",xl:"Human reaction time adds an error of a fraction of a second every time you start or stop a stopwatch. A single swing lasts only 1 to 3 seconds, so that error would be a large part of the measurement. Timing 10 swings makes the total much longer while the reaction error stays about the same size, so dividing by 10 shrinks the error per swing. The method doesn't change how the pendulum swings (B, D), and it has nothing to do with the release angle (C). Repeating or extending measurements to reduce error is a common ACT design idea."},
 {id:"b-s15",s:"science",t:"design",d:"easy",p:"pend",q:"Which two variables were held constant in Experiment 2?",c:["Mass and string length", "String length and release angle", "Mass and release angle", "Period and mass"],a:1,x:"Experiment 2 kept the length at 100 cm and the release angle at 10° while changing the mass.",xl:"In a controlled experiment, one variable is changed on purpose and the others are kept the same. Experiment 2's description says \"Length 100 cm, released from 10°. Mass varied,\" so length and angle were held constant. Mass was the variable being changed, which rules out A, C and D. Period is what was measured (the result), so it can't be held constant either."},
 {id:"b-s16",s:"science",t:"models",d:"medium",p:"pend",q:"The results of Experiment 2 support the prediction of:",c:["Student A only, because the period increased as mass increased.", "Student B, because changing the mass had almost no effect on the period.", "both students, because the period changed slightly.", "neither student, because the period decreased as mass increased."],a:1,x:"Going from 50 g to 400 g, the period stayed at about 2.0 s, so mass didn't matter, as Student B predicted.",xl:"Student A predicted that heavier bobs would have longer periods, and Student B predicted that mass wouldn't matter. In Experiment 2, the mass increased eightfold, from 50 g to 400 g, but the period stayed between 2.00 and 2.01 s. A change of 0.01 s is within measurement error, so the results show no real effect of mass, which supports Student B. Choice A misreads the table, and choice D is false because the period didn't consistently decrease. Treat tiny wobbles in data as \"no change\" unless the values follow a clear trend."},
 {id:"b-s17",s:"science",t:"models",d:"hard",p:"pend",q:"Do the results of Experiment 3 fully support Student B's prediction?",c:["Yes, because the period was the same at every release angle.", "Yes, because release angle is a type of length.", "No, because the period increased noticeably at larger release angles.", "No, because the period decreased at larger release angles."],a:2,x:"Student B said only length matters, but at 60° the period rose to 2.15 s, so release angle had some effect.",xl:"Student B claimed that only the string length affects the period. In Experiment 3 the length stayed at 100 cm, yet the period rose from 2.01 s at 10° to 2.15 s at 60°. That increase follows a steady trend, so it isn't just measurement error, and it shows release angle matters too, at least for large angles. Choice A misreads the table, and D gets the direction wrong. Watch for the word \"only\" in a hypothesis: one counterexample is enough to show it isn't fully supported."}
);

clock:`~ LITERARY NARRATIVE: This passage is adapted from "The Dent," an original short story written for ACT Study Lab.

Nadia had promised herself she would not cry at the repair shop, and she didn't, though it was close. The clerk, an older man with reading glasses pushed up into his gray hair, turned her grandmother's mantel clock over in his hands as if it were a sleeping animal.

The clock had stood on her grandmother's bookshelf for as long as Nadia could remember, between a jar of buttons and a photograph of a fishing boat that nobody could identify. When her grandmother moved into the small apartment above Nadia's aunt's garage that spring, most of the furniture went to cousins or to the thrift store. Nadia had asked for only the clock. It had stopped two days after she brought it home, as if it had noticed the move, and for a month she had left it silent on her kitchen table, unable to decide whether a broken clock was worth fixing.

The clerk opened the back panel with a tool no bigger than a toothpick and peered inside for a long time, nudging a tiny wheel with the tip of his finger. Nadia watched his face for some sign of good or bad news and found none.

"Mainspring," he said finally. "And the escapement's worn. Fifty years of ticking will do that."

"Can you fix it?"

He looked at her over the counter for a long moment. "I can. The question is whether you want me to."

Nadia didn't understand, and she said so.

He set the clock down gently. "Some people bring these in and want them to look new. Polish the brass, replace the face, the whole thing. When they get it back, it runs perfectly, and it doesn't feel like theirs anymore." He tapped a small dent near the base. "That's from something. You know what?"

She did. Her grandmother had knocked the clock off the shelf the night Nadia's mother was born, rushing to answer the phone. The family had told the story so many times that it had worn as smooth as the brass.

"Leave the dent," Nadia said.

"Good," said the clerk, and for the first time he smiled. "I'll fix what makes it run. The rest is yours."

He wrote out a ticket in pencil, slowly, asking her to spell her last name twice. While he wrote, Nadia looked around the shop. Clocks covered every wall: cuckoo clocks with carved leaves, a tall clock in a dark wooden case, dozens of small alarm clocks lined up on a shelf like students waiting to be called on. Most of them were ticking, and none of them agreed. It should have been maddening, she thought, but it was oddly comforting instead, like a room full of people talking quietly at once.

For the next two weeks, Nadia checked the time on her phone more often than she ever had. Twice she nearly called the shop to ask whether the clock was ready, and twice she put the phone down. Her grandmother, when Nadia visited on Sunday, asked about the clock before she asked about anything else. "Did he try to make it shiny?" she wanted to know. When Nadia told her about the dent, her grandmother laughed so hard she had to set down her tea. "That dent is older than your mother," she said, wiping her eyes.

Two weeks later she carried the clock home on the bus, holding it on her lap the whole way. That night she set it on her own shelf and wound it, and the ticking filled the small apartment, steady and a little loud, exactly as she remembered. She hadn't realized how quiet the place had been.`,
diners:`~ HUMANITIES: This passage is adapted from "Waiting for Breakfast," an original article written for ACT Study Lab. Ines Calder is a fictional photographer.

When the photographer Ines Calder began her series on small-town diners in the 1970s, critics dismissed the project as nostalgic. Diners, they said, were relics, and photographing them was like photographing a typewriter: charming, perhaps, but not art.

Calder disagreed, though she rarely argued the point in interviews. Instead, she kept working. Over twelve years she photographed more than two hundred diners in nineteen states, almost always at the same hour, just after dawn, before the breakfast crowd arrived. The timing was deliberate. In the early light, the chrome counters and empty stools seemed to be waiting for something, and that sense of waiting, Calder later wrote, was her real subject.

What critics missed was that Calder was not recording buildings so much as recording a kind of attention. Many of her photographs include a single figure: a cook tying an apron, a waitress refilling a sugar jar. These people are rarely looking at the camera. They are absorbed in small, repeated tasks, and Calder treats those tasks with the seriousness other photographers reserved for monuments.

Calder grew up above her parents' hardware store, and she later said that she learned to see by watching customers. A man buying a single hinge, she noticed, would often turn it over in his hand for a full minute, as if the decision mattered a great deal. She came to believe that ordinary routines were where people revealed the most about themselves.

Her method made that seriousness possible. Calder worked with a large-format camera on a tripod, the kind that requires a photographer to load a single sheet of film for each picture and to stand still under a dark cloth while focusing. One photograph could take twenty minutes to set up. The slowness meant that cooks and waitresses quickly stopped noticing her, and it also meant she could make only a handful of images each morning. She often returned to the same diner several times, sometimes years apart, to photograph the same stool or the same window in a different season.

The prints themselves are large, some nearly four feet wide, and they reward close looking. In one, the reflection of a waitress appears in the curved side of a coffee urn, stretched like a figure in a fun-house mirror, while the waitress herself stands just outside the frame. In another, a handwritten sign taped to the register announces that pie is "gone till Tuesday." Calder never cropped out such details; she seemed to treasure them.

Calder also worked only in black and white, a choice that puzzled some of her admirers, since diners were famous for their red stools, turquoise booths, and neon signs. She explained that color would have made the pictures about decoration. Without it, the viewer notices light instead: the glare on a countertop, the soft gray of steam rising from a coffee cup.

Not every critic came around. One reviewer, writing when the full series was first shown, complained that two hundred photographs of nearly identical rooms amounted to "a catalog, not a vision." Calder, characteristically, did not reply. The repetition that bothered him, however, is exactly what many later viewers admire. Seen together, the photographs reveal small differences, such as the angle of a menu board or the pattern worn into a floor, that no single image could show.

By the time the series was exhibited in full, about a third of the diners had closed. Viewers who had once called the work sentimental now called it a record of a disappearing America. Calder resisted that label as well. "I wasn't trying to save anything," she said. "I was trying to look at it properly while it was there."`,
tardi:`~ NATURAL SCIENCE: This passage is adapted from "The Toughest Animal You've Never Seen," an original article written for ACT Study Lab.

Tardigrades are among the toughest animals on Earth, though you would need a microscope to appreciate them. Most are less than a millimeter long, with eight stubby legs ending in tiny claws, which is why they are sometimes called "water bears." They live almost everywhere: in ocean sediments, in hot springs, and, most commonly, in the thin film of water that coats moss and lichens.

The animals were first described in 1773 by a German pastor, Johann August Ephraim Goeze, who called them "little water bears" after watching them lumber across a drop of water under his microscope. Since then, scientists have identified more than 1,300 species. Some feed on plant cells, piercing them with needle-like mouthparts and sucking out the contents; others hunt even smaller animals. Because tardigrades are so small and so widespread, a pinch of damp moss from a backyard or a crack in a city sidewalk will often contain dozens of them.

That film of water is the key to their survival. When moss dries out, a tardigrade does not die. Instead, it pulls in its legs, curls into a shape scientists call a tun, and loses nearly all the water in its body. Its metabolism slows until it is almost impossible to detect. In this state, a tardigrade can survive for years. When water returns, it rehydrates and, within hours, begins to walk and feed again.

The process is not automatic, however. Tardigrades need time to prepare: if moss dries out too quickly, many die before they can form a tun. In laboratory studies, tardigrades that were dried slowly over several hours survived far more often than those dried in minutes, which suggests that the animals must build up their protective molecules before the water is gone.

Reviving a tun is surprisingly simple. Researchers add a drop of water and wait. Under the microscope, the shriveled body slowly swells, the legs unfold, and within minutes to hours the animal begins to move. In one widely reported case, tardigrades recovered from a sample of moss that had been kept frozen for about 30 years were revived, and one of them went on to lay eggs.

In the tun state, tardigrades have survived conditions that would kill nearly any other animal: temperatures close to absolute zero, high doses of radiation, and even exposure to the vacuum of space during a 2007 experiment in orbit. Researchers believe that special proteins help protect the animal's cells, forming a glass-like material that holds delicate molecules in place as the water disappears.

Scientists are still working out exactly how that protection works. In 2017, a team of researchers reported that tardigrades make a group of proteins not known in any other animal, and that the animals produce more of them as they begin to dry out. When the researchers gave yeast and bacteria the genes for these proteins, those organisms became noticeably better at surviving drying. Another team identified a tardigrade protein that seems to shield DNA, and human cells grown with it in the laboratory suffered less damage from X-rays. The findings have drawn attention far outside biology. Medical researchers hope that a similar approach might one day keep vaccines and other medicines stable without refrigeration, making them far easier to ship to remote places.

It is tempting to call tardigrades indestructible, but that would be misleading. Active, hydrated tardigrades are fairly fragile, and studies suggest that many handle prolonged heat poorly. Their famous toughness belongs mainly to the dried-out tun, a strategy for waiting out bad conditions rather than thriving in them.`,
sleep:`~ SOCIAL SCIENCE: This passage is adapted from "Why Teens Can't Fall Asleep," an original article written for ACT Study Lab. The school district and the data in Table 1 are invented for practice.

For years, parents and teachers assumed that teenagers who stayed up late were simply undisciplined. Research over the past few decades suggests a different explanation. During adolescence, the body's internal clock shifts later. The hormone melatonin, which helps signal that it is time to sleep, begins to rise later in the evening for teenagers than for younger children or adults. As a result, many teens genuinely do not feel sleepy until around 11 p.m.

That shift collides with early school schedules. A student who falls asleep at 11 p.m. and must wake at 6 a.m. gets about seven hours of sleep, well short of the eight to ten hours health experts recommend for teenagers. Over weeks and months, the shortfall adds up. Sleep-deprived students are more likely to struggle with attention and mood, and teen drivers who are short on sleep face a higher risk of crashes.

In response, some school districts have moved their start times later. Results have generally been encouraging: in several districts, students slept longer on school nights and attendance improved. Still, the change is rarely simple. Later start times can push back after-school sports, complicate bus schedules shared with elementary schools, and conflict with parents' work hours.

One district that made the switch moved its high school start time from 7:30 a.m. to 8:30 a.m. after three years of public meetings at which parents, coaches, and bus drivers all raised concerns. Researchers surveyed students and collected attendance records for a year before and a year after the change. Some parents had predicted that students would simply stay up an hour later. That is not what happened. Bedtimes shifted only slightly, so most of the extra hour in the morning became extra sleep. Teachers also reported fewer students dozing off in first-period classes. The number of students who visited the school nurse in the morning complaining of headaches or stomachaches also dropped. Table 1 summarizes the results.

Critics point out that results like these are not guaranteed. In districts where classes already began after 8:00 a.m., moving the start time later had smaller effects. Some families found that a later dismissal left teenagers less time for after-school jobs that helped support their households. Coaches reported that athletes missed more class time, because games against schools with earlier schedules still began at the same hour. A policy that helps one community, the critics argue, may not fit another.

Schools can also help in smaller ways. Scheduling tests later in the morning, limiting very early practices, and teaching students how bright screens at night can delay sleepiness all cost little. None of these steps erases the mismatch between teenage biology and early bells, but each can narrow it.

None of these obstacles means the research is wrong. They mean that a school schedule, like a teenager's sleep, is shaped by many forces at once.

Table 1
Measure | Year before (7:30 a.m. start) | Year after (8:30 a.m. start)
Average bedtime on school nights | 10:55 p.m. | 11:05 p.m.
Average sleep on school nights | 6 hr 50 min | 7 hr 40 min
Average first-period attendance | 88% | 93%
Students who said they felt alert in first period | 32% | 51%`,

trout:`Over the past 20 years, the number of lake trout in Lake Arden has fallen by about 60%. Lake trout need cold water with high levels of dissolved oxygen. Three scientists propose explanations for the decline.

Scientist 1: The decline is caused by warming water. Lake Arden's average summer surface temperature has risen by 2°C over 20 years, and warmer water holds less dissolved oxygen. In summer, trout are squeezed into a shrinking zone of deep, cold, oxygen-rich water, where food is scarce.

Scientist 2: The decline is caused by smallmouth bass, a fish first found in Lake Arden 18 years ago. Bass eat young trout and compete with adult trout for the same small fish. The trout decline began shortly after the bass arrived, and trout have also declined in other lakes after bass were introduced.

Scientist 3: The decline is caused by fertilizer runoff from nearby farms. Fertilizer feeds large algae blooms. When the algae die and sink, bacteria break them down and use up the oxygen in deep water, the very zone where trout go to stay cool. Water samples show that phosphorus, a main ingredient in fertilizer, has tripled in the lake over 20 years.`,
