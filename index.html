 {id:"b-e51",s:"english",t:"punct",d:"easy",p:"nightmkt",q:"By seven o'clock, more than sixty vendors have set up tables under strings of paper [[lanterns, and they sell]] everything from hand-pressed tortillas to secondhand records.",c:["NO CHANGE", "lanterns and, they sell", "lanterns, and, they sell", "lanterns; and they sell"],a:0,x:"A comma before \"and\" correctly joins two complete clauses. No other commas are needed.",xl:"\"More than sixty vendors have set up tables\" and \"they sell everything\" are both complete clauses, and the standard way to join them is a comma followed by \"and,\" exactly as written. Choices B and C add a comma right after \"and,\" which separates the conjunction from its clause for no reason. Choice D pairs a semicolon with \"and,\" which the ACT treats as an error, since a semicolon replaces the conjunction rather than joining it. When the original follows the comma + FANBOYS pattern correctly, NO CHANGE is the answer."},
 {id:"b-e52",s:"english",t:"trans",d:"medium",p:"nightmkt",q:"Only nine vendors signed up for the first market. [[For example,]] a local food writer posted photos of the crowded tables online, and within a month the waiting list for a spot was longer than the list of vendors.",c:["NO CHANGE", "However,", "Similarly,", "In other words,"],a:1,x:"The market started small, but then it suddenly became popular. That's a contrast, so \"However\" fits.",xl:"Read the sentences on both sides of the underlined word. The first says the market started with only nine vendors, and the second describes it becoming so popular that the waiting list outgrew the vendor list. That shift from a small start to sudden popularity is a contrast, which \"However\" signals. \"For example\" (A) would make the food writer's post an example of only nine vendors signing up, which makes no sense. \"Similarly\" (C) and \"In other words\" (D) signal matching or restated ideas, but these two ideas point in opposite directions."},
 {id:"b-e53",s:"english",t:"usage",d:"easy",p:"nightmkt",q:"Today the market [[has became]] one of the city's most popular events.",c:["NO CHANGE", "have become", "becoming", "has become"],a:3,x:"After \"has,\" the verb needs its past participle, \"become.\" The subject \"market\" is singular, so \"has\" stays.",xl:"The present perfect tense uses \"has\" or \"have\" plus the past participle, and the past participle of \"become\" is \"become,\" not \"became.\" So \"has became\" (A) is a verb-form error. The subject \"market\" is singular, which rules out \"have become\" (B). \"Becoming\" (C) isn't a complete verb and would leave the sentence without a main verb. \"Has become\" is the only choice that is both the right form and agrees with \"market.\""},
 {id:"b-e54",s:"english",t:"adddel",d:"medium",p:"nightmkt",q:"The writer is considering deleting the underlined sentence in Paragraph 3 (\"The lanterns are made of paper.\"). Should the writer make this deletion?",c:["Yes, because it repeats a detail from Paragraph 1 and interrupts the paragraph's description of the crowd.", "Yes, because it contradicts the description of the lanterns in Paragraph 1.", "No, because it explains why the market has become so popular.", "No, because it provides a necessary description of the market's setting."],a:0,x:"Paragraph 1 already says the lanterns are paper, and the sentence breaks up a description of people at the market.",xl:"Paragraph 1 already mentions \"strings of paper lanterns,\" so this sentence repeats information. It also sits between two sentences about the crowd (four thousand visitors, then families and teenagers), interrupting that description. That makes deletion the better choice, for the reason in A. Choice B is wrong because the sentence agrees with Paragraph 1 rather than contradicting it. Choices C and D overstate what the sentence does, since paper lanterns don't explain the market's popularity, and the setting was already described."},
 {id:"b-e55",s:"english",t:"punct",d:"easy",p:"nightmkt",q:"Families share plates of dumplings at folding tables, while teenagers crowd around a man who repairs [[bicycles, guitars, and, radios]] for whatever customers can afford to pay.",c:["NO CHANGE", "bicycles guitars, and radios", "bicycles, guitars, and radios", "bicycles, guitars and, radios"],a:2,x:"Items in a list are separated by commas, but no comma belongs right after \"and.\"",xl:"In a list of three or more items, put a comma after each item except the last; the comma before \"and\" is optional on the ACT but never wrong. What's never allowed is a comma right after \"and,\" which choices A and D both include. Choice B leaves out the comma between \"bicycles\" and \"guitars,\" running two items together. Choice C punctuates the list correctly."},
 {id:"b-e56",s:"english",t:"usage",d:"easy",p:"nightmkt",q:"Some restaurant owners worried that the market would steal [[there]] customers.",c:["NO CHANGE", "their", "they're", "its"],a:1,x:"The customers belong to the restaurant owners, so the possessive \"their\" is needed.",xl:"\"There\" (A) refers to a place, \"they're\" (C) means \"they are,\" and \"their\" shows that something belongs to a group. The customers belong to the restaurant owners, so \"their\" is correct. \"Its\" (D) is singular, but the owners are plural. Test \"they're\" by expanding it: \"steal they are customers\" makes no sense, which rules it out quickly."},
 {id:"b-e57",s:"english",t:"sent",d:"medium",p:"nightmkt",q:"Visitors who arrive early often eat dinner at a nearby restaurant before the market opens, and many [[stay late, buying]] dessert at the café on the corner after the vendors pack up.",c:["NO CHANGE", "stay late. Buying", "stay late; buying", "stay late buying,"],a:0,x:"\"Buying dessert ...\" is a descriptive phrase, so it attaches to \"stay late\" with a comma.",xl:"\"Buying dessert at the café on the corner\" can't stand alone as a sentence, because it has no subject or main verb. A comma correctly attaches it to \"many stay late,\" telling what those visitors do. A period (B) or semicolon (C) would turn the phrase into a fragment. Choice D removes the needed comma and adds one after \"buying,\" which splits the verb from its object. The original is correct."},
 {id:"b-e58",s:"english",t:"punct",d:"medium",p:"nightmkt",q:"[[It's]] conversations like these, she explained, that keep her coming back every week.",c:["NO CHANGE", "Its", "Its'", "They're"],a:0,x:"\"It's\" means \"it is\": \"It is conversations like these ... that keep her coming back.\"",xl:"Expand the contraction to test it: \"It is conversations like these that keep her coming back\" is a correct, natural sentence, so \"It's\" is right. \"Its\" (B) is possessive and would need a noun to own something, which doesn't happen here. \"Its'\" (C) is never correct in English. \"They're\" (D) means \"they are,\" and \"they are conversations like these that keep her coming back\" is awkward and changes the sentence's structure. When \"it's\" is underlined, always try the \"it is\" substitution."},
 {id:"b-e59",s:"english",t:"purpose",d:"medium",p:"nightmkt",q:"Suppose the writer's primary purpose had been to compare the night markets of several different cities. Would this essay accomplish that purpose?",c:["Yes, because it describes a market with more than sixty vendors.", "Yes, because it includes the perspective of a vendor.", "No, because it focuses on a single market in one city rather than comparing several.", "No, because it focuses mainly on restaurant owners' complaints."],a:2,x:"The essay is entirely about Larkin's market. It never mentions any other city.",xl:"A comparison of several cities' markets would need information about more than one market, but this essay describes only the Larkin night market. So the answer is No, and the reason has to be accurate. Choice C gives the right reason. Choice D says No, but restaurant owners appear in only one paragraph, and their worries turned out to be wrong. Choices A and B say Yes for reasons that have nothing to do with comparing cities."},
 {id:"b-e60",s:"english",t:"org",d:"hard",p:"nightmkt",q:"The writer wants to add the following sentence to the essay:\n\"By the end of that first summer, the council had to open a second parking lot.\"\nThe sentence would most logically be placed at the end of:",c:["Paragraph 1.", "Paragraph 2.", "Paragraph 3.", "Paragraph 5."],a:1,x:"Paragraph 2 tells how the market grew in its first season, so a sentence about growth \"by the end of that first summer\" belongs there.",xl:"Look for clues in the new sentence. \"That first summer\" refers to the market's first season, and \"had to open a second parking lot\" describes rapid growth. Paragraph 2 describes the first market and how quickly the waiting list grew, so the sentence makes a natural ending for it. Paragraph 1 describes the market today, Paragraph 3 covers current crowds, and Paragraph 5 is about one vendor, so none of them fits the timeline. Words like \"that\" and \"first\" usually tie a sentence to something specific already mentioned."},
 {id:"b-e61",s:"english",t:"trans",d:"medium",p:"sourdough",q:"Sourdough is one of the oldest kinds of leavened bread, [[yet]] it requires no store-bought yeast at all.",c:["NO CHANGE", "so", "because", "and therefore"],a:0,x:"It's surprising that a risen bread needs no yeast from a store, and \"yet\" signals that contrast.",xl:"The first clause says sourdough is a leavened (risen) bread, and the second says it uses no store-bought yeast. A reader would expect a risen bread to need yeast, so the second idea is a contrast, and \"yet\" expresses it correctly. \"So\" (B) and \"and therefore\" (D) claim the bread needs no yeast because it is old, which is illogical. \"Because\" (C) reverses the logic in a similar way. Decide whether ideas agree, contrast or show cause before choosing a connecting word."},
 {id:"b-e62",s:"english",t:"concise",d:"easy",p:"sourdough",q:"Instead, bakers rely on a starter: a mixture of flour and water [[that has been left to sit and rest]] until it bubbles with life.",c:["NO CHANGE", "that has been left to rest", "that has been left sitting to rest and sit", "that, having been left, has sat and rested"],a:1,x:"\"Sit\" and \"rest\" mean the same thing here, so one is enough.",xl:"In this sentence, \"sit\" and \"rest\" express the same idea, so using both is redundant. \"That has been left to rest\" keeps the full meaning in fewer words. Choice C repeats the redundancy and adds even more words, and D is wordy and awkward. On the ACT, when choices mean the same thing, the shortest grammatically correct one is usually right."},
 {id:"b-e63",s:"english",t:"punct",d:"hard",p:"sourdough",q:"Wild yeasts, which float in the air and live on the surface of [[grain feed]] on the sugars in the flour and release carbon dioxide gas.",c:["NO CHANGE", "grain, feed", "grain; feed", "grain: feed"],a:1,x:"The clause \"which float ... grain\" opens with a comma, so it must close with one before the verb \"feed.\"",xl:"\"Which float in the air and live on the surface of grain\" is extra information about wild yeasts, so it is set off by commas on both sides. The sentence already has the opening comma after \"yeasts,\" so a closing comma is needed after \"grain\" before the main verb \"feed.\" Leaving it out (A) makes the reader think \"grain feed\" is a single thing. A semicolon (C) or colon (D) would split the subject \"Wild yeasts\" from its verb. Remember: an interrupting phrase that opens with a comma must close with one."},
 {id:"b-e64",s:"english",t:"trans",d:"medium",p:"sourdough",q:"That gas becomes trapped in the dough and makes the bread rise. [[At the same time,]] bacteria in the starter produce lactic acid, which gives sourdough its tangy flavor.",c:["NO CHANGE", "Instead,", "For example,", "On the other hand,"],a:0,x:"The yeast and the bacteria work during the same process, so \"At the same time\" fits.",xl:"The paragraph describes two things happening in the starter: yeasts make gas, and bacteria make acid. They happen together, which \"At the same time\" expresses. \"Instead\" (B) suggests the bacteria replace the yeasts, and \"On the other hand\" (D) signals a contrast, but the two processes work together. \"For example\" (C) would make the bacteria an example of rising bread, which doesn't fit. NO CHANGE is correct."},
 {id:"b-e65",s:"english",t:"adddel",d:"medium",p:"sourdough",q:"The writer is considering deleting the underlined sentence in Paragraph 3 (\"If the starter is neglected, it grows weak and sluggish, and bread made from it turns out dense.\"). Should the writer make this deletion?",c:["Yes, because it contradicts the claim that starters can last for decades.", "Yes, because it shifts the focus to commercial yeast.", "No, because it explains what happens when a starter isn't fed, supporting the point that keeping one alive takes patience.", "No, because it explains how bacteria give sourdough its flavor."],a:2,x:"The sentence shows the cost of neglect, which supports the paragraph's opening claim that starters take patience.",xl:"Paragraph 3 begins by saying that keeping a starter alive takes patience, then describes daily feeding. The underlined sentence explains what happens if you don't feed it: the starter weakens and the bread turns out dense. That shows why the patience matters, so the sentence should stay, for the reason in C. Choice A is wrong because a neglected starter weakening doesn't contradict well-fed starters lasting decades. Choice D describes Paragraph 2, not this sentence."},
 {id:"b-e66",s:"english",t:"usage",d:"medium",p:"sourdough",q:"Some bakers keep the same starter going for decades, and a few bakeries claim that [[its]] starters are more than a century old.",c:["NO CHANGE", "it's", "their", "there"],a:2,x:"The pronoun refers to \"bakeries,\" which is plural, so it should be \"their.\"",xl:"A pronoun must agree with the noun it refers to. Here the starters belong to \"a few bakeries,\" which is plural, so the plural possessive \"their\" is needed. \"Its\" (A) is singular, and \"it's\" (B) means \"it is.\" \"There\" (D) refers to a place, not ownership. Find the noun the pronoun replaces and check that they match in number."},
 {id:"b-e67",s:"english",t:"sent",d:"medium",p:"sourdough",q:"A typical loaf rises for eight to twelve [[hours; compared with]] about two hours for bread made with commercial yeast.",c:["NO CHANGE", "hours, compared with", "hours. Compared with", "hours compared, with"],a:1,x:"\"Compared with about two hours ...\" isn't a complete sentence, so it attaches with a comma.",xl:"A semicolon must have a complete sentence on each side, but \"compared with about two hours for bread made with commercial yeast\" has no subject or main verb. That rules out A, and a period (C) would leave the same words as a fragment. A comma correctly attaches the comparison to the main sentence. Choice D puts the comma in the middle of the phrase \"compared with,\" splitting it apart."},
 {id:"b-e68",s:"english",t:"concise",d:"easy",p:"sourdough",q:"In recent years, sourdough has enjoyed a [[huge massive]] surge in popularity among home bakers.",c:["NO CHANGE", "massively huge", "huge, massive", "huge"],a:3,x:"\"Huge\" and \"massive\" mean the same thing. One adjective is enough.",xl:"Using \"huge\" and \"massive\" together repeats the same idea, which is redundant. Choices B and C keep both words, just rearranged or with a comma. \"Huge\" alone says everything needed. When two words in an underlined portion mean the same thing, look for the choice that keeps just one."},
 {id:"b-e69",s:"english",t:"word",d:"medium",p:"sourdough",q:"Bakers often give portions of their starters to friends, so a single jar of bubbling flour and water can [[give rise to]] dozens of loaves in kitchens across a town.",c:["NO CHANGE", "give up", "give in to", "give out on"],a:0,x:"\"Give rise to\" means to produce or lead to, which fits a jar of starter leading to many loaves.",xl:"The sentence describes one jar of starter, shared among friends, leading to many loaves. \"Give rise to\" means to cause or produce, which is exactly that meaning, and it's also a clever play on bread rising. \"Give up\" (B) means to quit, \"give in to\" (C) means to surrender, and \"give out on\" (D) means to fail. On word-choice questions, plug in each option and make sure it means what the sentence needs."},
 {id:"b-e70",s:"english",t:"purpose",d:"medium",p:"sourdough",q:"Suppose the writer's goal had been to explain how sourdough bread can rise without store-bought yeast. Would this essay accomplish that goal?",c:["Yes, because it explains that wild yeasts in a starter release gas that makes the dough rise.", "Yes, because it describes bakeries with century-old starters.", "No, because it focuses mainly on the popularity of sourdough among home bakers.", "No, because it never explains where the bubbles in a starter come from."],a:0,x:"Paragraph 2 explains that wild yeasts release carbon dioxide, which gets trapped and makes the bread rise.",xl:"The goal is to explain how sourdough rises without store-bought yeast. Paragraphs 1 and 2 do exactly that: the starter contains wild yeasts, which feed on sugars and release carbon dioxide that makes the dough rise. So the answer is Yes, for the reason in A. Choice B says Yes, but century-old starters don't explain rising. Choice D is false, because Paragraph 2 explains the bubbles directly, and C overstates the role of the last paragraph."},
 {id:"b-e71",s:"english",t:"trans",d:"easy",p:"shelter",q:"I imagined spending my afternoons cuddling puppies. [[Instead,]] my first assignment was scrubbing kennels.",c:["NO CHANGE", "Similarly,", "As a result,", "For instance,"],a:0,x:"What the narrator expected (cuddling puppies) is replaced by what actually happened (scrubbing kennels), and \"Instead\" signals that.",xl:"The first sentence describes what the narrator expected, and the second describes something quite different. \"Instead\" is the right transition when reality replaces an expectation. \"Similarly\" (B) signals that the two ideas match, which they don't. \"As a result\" (C) would mean imagining puppies caused the kennel assignment, and \"For instance\" (D) would make scrubbing an example of cuddling. NO CHANGE is correct."},
 {id:"b-e72",s:"english",t:"word",d:"medium",p:"shelter",q:"The shelter's manager, a soft-spoken woman named Ms. Okafor, [[blurted out]] that clean kennels kept the animals healthy.",c:["NO CHANGE", "hollered", "griped", "explained"],a:3,x:"Ms. Okafor is described as soft-spoken and calm, so \"explained\" fits her tone. The other verbs suggest loud or sudden speech.",xl:"Word-choice questions often hinge on clues in the same sentence. Ms. Okafor is called \"a soft-spoken woman,\" and she is calmly teaching a new volunteer why clean kennels matter. \"Explained\" matches that calm, informative tone. \"Blurted out\" (A) means to say something suddenly, \"hollered\" (B) means to shout, and \"griped\" (C) means to complain, and none of these fit a soft-spoken person giving instructions. Look for descriptive words near the underline that point to the right tone."},
 {id:"b-e73",s:"english",t:"concise",d:"easy",p:"shelter",q:"She handed me rubber gloves, a bucket, and [[a brush that was stiff]].",c:["NO CHANGE", "a stiff brush", "a brush, which was stiff", "a brush having stiffness"],a:1,x:"\"A stiff brush\" says the same thing in fewer words and matches the other short items in the list.",xl:"All three versions mean the same thing, but \"a stiff brush\" is the shortest and clearest. It also matches the simple pattern of the other items in the list (\"rubber gloves,\" \"a bucket\"). Choices C and D are wordy, and D is awkward. When the choices differ only in length, choose the most concise version that is still correct."},
 {id:"b-e74",s:"english",t:"punct",d:"medium",p:"shelter",q:"I learned to read a dog's [[body language: a]] lowered tail and flattened ears meant fear, while a loose, wagging body meant a dog was ready to play.",c:["NO CHANGE", "body language a", "body language, a", "body, language: a"],a:0,x:"A colon follows the complete clause \"I learned to read a dog's body language\" and introduces the explanation that follows.",xl:"A colon is correct when a complete sentence comes before it and the words after it explain or illustrate it. \"I learned to read a dog's body language\" is complete, and what follows explains what that body language meant, so the colon works. Removing it (B) runs two ideas together, and a comma (C) joins two complete sentences, creating a comma splice. Choice D puts a comma inside the phrase \"body language,\" which splits it."},
 {id:"b-e75",s:"english",t:"sent",d:"medium",p:"shelter",q:"I learned which cats liked to be held and which preferred to be left [[alone, I]] even learned to give medicine to a stubborn beagle named Biscuit by hiding the pill in a spoonful of peanut butter.",c:["NO CHANGE", "alone, I,", "alone. I", "alone I"],a:2,x:"Two complete sentences are joined with only a comma, which is a comma splice. A period fixes it.",xl:"\"I learned which cats liked to be held and which preferred to be left alone\" and \"I even learned to give medicine to a stubborn beagle\" are both complete sentences. Joining them with just a comma (A) creates a comma splice, and adding a second comma (B) doesn't help. Removing the comma (D) creates a run-on. A period correctly separates the two sentences."},
 {id:"b-e76",s:"english",t:"usage",d:"easy",p:"shelter",q:"Visitors [[tends]] to walk past his kennel because he was nine years old and barked whenever someone came near.",c:["NO CHANGE", "tended", "tends to have", "has tended"],a:1,x:"The subject \"Visitors\" is plural, and the rest of the sentence is in the past tense, so \"tended\" is correct.",xl:"Two things must match here. First, the subject \"Visitors\" is plural, but \"tends\" (A), \"tends to have\" (C) and \"has tended\" (D) are singular forms. Second, the rest of the sentence uses past tense (\"was nine years old,\" \"barked\"), and the whole story takes place in the past. \"Tended\" is past tense and works with a plural subject, so it fixes both problems."},
 {id:"b-e77",s:"english",t:"adddel",d:"medium",p:"shelter",q:"At this point in Paragraph 4, after the sentence ending \"barked whenever someone came near,\" the writer is considering adding the following sentence:\n\"Beagles were originally bred to hunt rabbits.\"\nShould the writer make this addition?",c:["Yes, because it explains why Biscuit barked at visitors.", "Yes, because it adds a useful detail about the history of Biscuit's breed.", "No, because it interrupts the description of Biscuit with an unrelated fact about his breed.", "No, because it contradicts the claim that Biscuit was nine years old."],a:2,x:"The paragraph explains why visitors passed Biscuit by and what he was really like. Breed history doesn't help with either.",xl:"Paragraph 4 explains why visitors walked past Biscuit and reveals that his barking hid a gentle nature. A general fact about what beagles were bred for doesn't connect to that point, so the addition would distract the reader. Choice A claims the sentence explains the barking, but the paragraph says the bark came from nervousness, not hunting instincts. Choice B gives a reason, but an interesting fact isn't helpful if it's off-topic. Choice D is wrong because the sentence says nothing about Biscuit's age."},
 {id:"b-e78",s:"english",t:"org",d:"medium",p:"shelter",q:"For the sake of logic and cohesion, Paragraph 4 should be placed:",c:["where it is now.", "before Paragraph 2.", "before Paragraph 3.", "after Paragraph 5."],a:0,x:"Paragraph 3 introduces Biscuit, Paragraph 4 describes him, and Paragraph 5 tells how he was adopted, so the order works.",xl:"Paragraph 4 opens with \"Biscuit had been at the shelter longer than any other dog,\" which assumes the reader already knows who Biscuit is. He is introduced at the end of Paragraph 3, so Paragraph 4 must come after it, ruling out B and C. Paragraph 5 describes his adoption, which only makes sense after we learn why visitors had ignored him, so D doesn't work either. The paragraph is already in the right place."},
 {id:"b-e79",s:"english",t:"punct",d:"easy",p:"shelter",q:"They came back the next day, and the day after that. [[On the third day;]] they took him home.",c:["NO CHANGE", "On the third day,", "On, the third day,", "On the third day:"],a:1,x:"An introductory phrase is followed by a comma, not a semicolon or colon.",xl:"\"On the third day\" is a short introductory phrase, not a complete sentence, so it can't come before a semicolon (A). The standard punctuation after an introductory phrase is a comma, which makes B correct. Choice C adds an unnecessary comma inside the phrase, and a colon (D) must follow a complete sentence. When a sentence opens with a time phrase, follow it with a comma."},
 {id:"b-e80",s:"english",t:"adddel",d:"hard",p:"shelter",q:"The writer is considering deleting the underlined sentence in Paragraph 6 (\"I've scrubbed a lot of kennels since then.\"). Should the sentence be kept or deleted?",c:["Kept, because it links the narrator's continued volunteering to the kennel scrubbing described at the beginning of the essay.", "Kept, because it explains why the couple adopted Biscuit.", "Deleted, because it contradicts the claim that the narrator still volunteers.", "Deleted, because it repeats information from Paragraph 5."],a:0,x:"The sentence calls back to the narrator's first job, connecting the beginning and end of the essay with a touch of humor.",xl:"The essay opens with the narrator scrubbing kennels instead of cuddling puppies. This sentence in the final paragraph calls back to that beginning, showing that the narrator still does the unglamorous work years later, which sets up the \"But\" in the next sentence. That connection makes it worth keeping, as A says. It has nothing to do with the adoption (B), it supports rather than contradicts the narrator's volunteering (C), and Paragraph 5 never mentions scrubbing (D)."},
 {id:"b-e81",s:"english",t:"word",d:"medium",p:"clocktower",q:"Farmers once set their pocket watches by its chimes, and generations of students [[moseyed]] to class when they heard it strike eight.",c:["NO CHANGE", "strolled", "wandered", "raced"],a:3,x:"Hearing the clock strike eight meant class was starting, so students would hurry. \"Raced\" fits that urgency.",xl:"The sentence suggests the chime warned students they were about to be late, so the verb should show hurrying. \"Raced\" does that. \"Moseyed\" (A), \"strolled\" (B) and \"wandered\" (C) all describe slow, relaxed walking, which contradicts the urgency of the moment. Look for the situation the sentence describes, not just whether a word is grammatically correct, since all four choices are grammatical here."},
 {id:"b-e82",s:"english",t:"usage",d:"easy",p:"clocktower",q:"By 2015, however, the clock had stopped. [[It's]] iron gears had rusted, and water leaking through the roof had warped the wooden face.",c:["NO CHANGE", "Its", "Its'", "Their"],a:1,x:"The gears belong to the clock, so the possessive \"Its\" (no apostrophe) is needed.",xl:"\"It's\" means \"it is\" or \"it has,\" and \"It is iron gears had rusted\" makes no sense. The gears belong to the clock, so the sentence needs the possessive \"its,\" which never has an apostrophe. \"Its'\" (C) isn't a real word. \"Their\" (D) is plural, but it refers to the single clock. When you see \"it's,\" try reading it as \"it is\" to check."},
 {id:"b-e83",s:"english",t:"sent",d:"medium",p:"clocktower",q:"Repairing it would cost more than [[$200,000, and the town's]] budget had no room for the expense.",c:["NO CHANGE", "$200,000, the town's", "$200,000 the town's", "$200,000, and, the town's"],a:0,x:"Two complete clauses are correctly joined by a comma and \"and.\"",xl:"\"Repairing it would cost more than $200,000\" and \"the town's budget had no room for the expense\" are both complete clauses. A comma plus \"and\" is a correct way to join them, so NO CHANGE works. Removing \"and\" (B) leaves only a comma, creating a comma splice, and removing the punctuation too (C) creates a run-on. Choice D adds an unnecessary comma after \"and.\""},
 {id:"b-e84",s:"english",t:"trans",d:"medium",p:"clocktower",q:"[[Similarly,]] a group of high school students decided to help.",c:["NO CHANGE", "For example,", "In response,", "In other words,"],a:2,x:"The students acted because the town couldn't afford the repairs, so \"In response\" shows that connection.",xl:"Paragraph 2 ends with the town unable to pay for repairs, and Paragraph 3 begins with students stepping in to help. Their action is a reaction to that problem, so \"In response\" is the logical transition. \"Similarly\" (A) would mean the students did something like the town's budget problem, which makes no sense. \"For example\" (B) and \"In other words\" (D) introduce an example or a restatement, and the students' decision is neither."},
 {id:"b-e85",s:"english",t:"punct",d:"hard",p:"clocktower",q:"The interviews were posted online, and donations began arriving from former residents who had moved [[away; some]] as far as Alaska and Portugal.",c:["NO CHANGE", "away, some", "away. Some", "away some"],a:1,x:"\"Some as far as Alaska and Portugal\" isn't a complete sentence, so it attaches with a comma.",xl:"A semicolon (A) or period (C) must be followed by a complete sentence, but \"some as far as Alaska and Portugal\" has no verb. A comma correctly attaches this phrase, which adds detail about how far the residents had moved. With no punctuation (D), the sentence reads as if they moved \"away some,\" which is confusing. Check whether the words after a semicolon could stand alone; if not, a comma is usually the fix."},
 {id:"b-e86",s:"english",t:"adddel",d:"easy",p:"clocktower",q:"The writer is considering deleting the underlined sentence in Paragraph 4 (\"The clockmaker also repaired several church bells in the region.\"). Should the writer make this deletion?",c:["Yes, because it adds a detail about the clockmaker that is unrelated to restoring the Hartwell clock.", "Yes, because it contradicts the claim that the clockmaker came from a neighboring state.", "No, because it explains how the clock's gears were cleaned.", "No, because it shows why the restoration took eight months."],a:0,x:"The essay is about restoring the Hartwell clock. The clockmaker's other jobs are off-topic.",xl:"Paragraph 4 describes how long it took to raise money and to restore the clock. The clockmaker's work on church bells elsewhere doesn't help explain the Hartwell restoration, so the sentence should be deleted, for the reason in A. Choice B is wrong because the sentence doesn't contradict anything. Choices C and D claim the sentence does things it doesn't, since it says nothing about gears or the eight months. Off-topic details about a minor character are a common thing to delete on the ACT."},
 {id:"b-e87",s:"english",t:"concise",d:"medium",p:"clocktower",q:"When the tower struck nine, the crowd [[let out a cheer that was loud and that could be heard from far away]].",c:["NO CHANGE", "let out a loud cheer that was loud enough to be heard far away", "let out a cheer that could be heard across town", "cheered a cheer that was loud"],a:2,x:"A cheer that could be heard across town is obviously loud, so \"loud\" is unnecessary. Choice C says it all concisely.",xl:"The original says the cheer was loud and could be heard far away, but a cheer heard from far away is already loud, so that's repetitive. Choice B repeats \"loud\" twice. Choice D (\"cheered a cheer\") is redundant and drops the detail about distance. \"Let out a cheer that could be heard across town\" keeps the vivid detail without repeating ideas."},
 {id:"b-e88",s:"english",t:"org",d:"medium",p:"clocktower",q:"The writer wants to add the following sentence to the essay:\n\"Many donors included notes describing where they had been standing when they first heard the clock.\"\nThe sentence would most logically be placed at the end of:",c:["Paragraph 1.", "Paragraph 2.", "Paragraph 3.", "Paragraph 5."],a:2,x:"Paragraph 3 ends with donations arriving from former residents, so a sentence about those donors' notes follows naturally.",xl:"The new sentence is about \"donors,\" so it belongs right after the essay first mentions donations. Paragraph 3 ends with \"donations began arriving from former residents who had moved away,\" which sets up the notes perfectly. Paragraph 1 is about the clock's history, Paragraph 2 is about the damage, and Paragraph 5 is about the restart, and none of them mentions donors. Match key words in the new sentence (here, \"donors\") with where that idea is introduced."},
 {id:"b-e89",s:"english",t:"purpose",d:"easy",p:"clocktower",q:"Suppose the writer's goal had been to describe how a community effort saved a local landmark. Would this essay accomplish that goal?",c:["Yes, because it describes students raising money from current and former residents to restore the clock tower.", "Yes, because it focuses mainly on the clockmaker's methods for cleaning gears.", "No, because the clock tower was repaired by a professional clockmaker.", "No, because the essay is mostly about students going to college."],a:0,x:"Students organized a campaign, residents donated, and the clock was restored, which is a community saving a landmark.",xl:"The essay follows a landmark that fell into disrepair and the town effort that brought it back: students organized a campaign, and current and former residents donated. That is a clear example of a community effort saving a landmark, so the answer is Yes, for the reason in A. Choice B says Yes, but the clockmaker's methods take up only one sentence. Choice C misses that the community paid for the repair, and D distorts a minor detail in the last paragraph."},
 {id:"b-e90",s:"english",t:"punct",d:"medium",p:"rings",q:"In 1904, an astronomer [[named Andrew Ellicott Douglass]] began studying the stumps of ponderosa pines in northern Arizona.",c:["NO CHANGE", "named, Andrew Ellicott Douglass,", "named Andrew Ellicott Douglass,", "named, Andrew Ellicott Douglass"],a:0,x:"The name is essential: it tells which astronomer. Essential information takes no commas.",xl:"\"Andrew Ellicott Douglass\" identifies which astronomer the sentence is about, so it is essential (restrictive) and should not be set off with commas. Choice B wraps the name in commas as if it were extra information, and it also separates \"named\" from its object. Choice C adds a single comma between the subject and the verb \"began,\" which the ACT treats as an error. Choice D splits \"named\" from the name it introduces. With no commas, the sentence reads correctly."},
 {id:"b-e91",s:"english",t:"punct",d:"hard",p:"rings",q:"He wasn't interested in the trees for their own [[sake; he]] wanted to know whether their growth rings held a record of sunspot cycles.\nWhich of the following alternatives to the underlined portion would NOT be acceptable?",c:["sake. He", "sake—he", "sake, he", "sake: he"],a:2,x:"A comma alone can't join two complete sentences. \"Sake, he\" creates a comma splice.",xl:"Both halves of this sentence are independent clauses: \"He wasn't interested in the trees for their own sake\" and \"he wanted to know whether....\" A semicolon, a period, a dash, or a colon (because the second clause explains the first) can all correctly join or separate them. A comma by itself cannot, so \"sake, he\" creates a comma splice. On NOT questions, test each choice in the sentence and look for the one that breaks a rule."},
 {id:"b-e92",s:"english",t:"trans",d:"medium",p:"rings",q:"Douglass never found a clear link to the sun. [[Instead,]] he discovered a method that would change several sciences.\nWhich of the following alternatives to the underlined portion would be LEAST acceptable?",c:["However,", "Even so,", "Nevertheless,", "Therefore,"],a:3,x:"The sentences contrast what Douglass failed to find with what he found. \"Therefore\" signals a result, not a contrast.",xl:"The first sentence says Douglass's original search failed, and the second says he found something valuable anyway, so the transition must show contrast. \"However,\" \"Even so,\" and \"Nevertheless\" all express that kind of contrast, so each would be acceptable. \"Therefore\" means the second idea is caused by the first, which would claim he discovered the method because he failed to find a link to the sun. That cause-and-effect relationship isn't what the writer means, so \"Therefore\" is the least acceptable choice."},
 {id:"b-e93",s:"english",t:"usage",d:"medium",p:"rings",q:"By matching the rings of a living tree with [[that]] of an old beam or a buried log, a researcher could count backward and assign an exact calendar year to every ring.",c:["NO CHANGE", "those", "it", "them"],a:1,x:"The pronoun stands for \"rings,\" which is plural, so it should be \"those.\"",xl:"The underlined pronoun refers back to \"the rings,\" a plural noun, so it must also be plural. \"Those of an old beam\" means \"the rings of an old beam,\" which is the intended meaning. \"That\" (A) and \"it\" (C) are singular and don't agree with \"rings.\" \"Them\" (D) is plural, but \"them of an old beam\" isn't idiomatic English. When a pronoun stands in for a noun followed by \"of,\" use \"that of\" for singular nouns and \"those of\" for plural ones."},
 {id:"b-e94",s:"english",t:"word",d:"easy",p:"rings",q:"For archaeologists, the discovery was [[kind of a huge deal]].",c:["NO CHANGE", "a breakthrough", "a thing that was really good", "super important"],a:1,x:"The essay's tone is formal and informative. \"A breakthrough\" fits that tone and is precise.",xl:"The rest of the essay is written in a clear, formal style, so slang like \"kind of a huge deal\" (A) and \"super important\" (D) doesn't match its tone. \"A thing that was really good\" (C) is vague and wordy. \"A breakthrough\" precisely describes a discovery that suddenly solved a long-standing problem, and it matches the essay's style. On tone questions, choose the wording that sounds like the rest of the passage."},
 {id:"b-e95",s:"english",t:"concise",d:"easy",p:"rings",q:"Within days, the team was able to date dozens of [[ancient pueblos that had been built long ago]], buildings that archaeologists had never been able to place in time.",c:["NO CHANGE", "ancient pueblos", "ancient pueblos from long ago in the past", "pueblos that were ancient and also old"],a:1,x:"\"Ancient\" already means \"built long ago,\" so the extra words are redundant.",xl:"\"Ancient\" means very old, so adding \"that had been built long ago\" says the same thing twice. Choice C repeats the idea three times (\"ancient,\" \"from long ago,\" \"in the past\"), and D pairs \"ancient\" with \"old.\" \"Ancient pueblos\" expresses the full meaning in the fewest words. When all the choices mean the same thing and are grammatically correct, the ACT usually rewards the shortest one."},
 {id:"b-e96",s:"english",t:"sent",d:"medium",p:"rings",q:"Scars left in the rings by past fires [[showing]] how often forests burned before people began putting fires out.",c:["NO CHANGE", "which show", "show", "having shown"],a:2,x:"The sentence needs a main verb for its subject, \"Scars.\" \"Show\" provides it.",xl:"The subject of this sentence is \"Scars\" (described by \"left in the rings by past fires\"), but \"showing\" isn't a complete verb, so the original is a fragment. \"Which show\" (B) turns the rest of the sentence into a description, which still leaves \"Scars\" without a main verb. \"Having shown\" (D) is also not a main verb. \"Show\" is a plural present-tense verb that agrees with \"Scars\" and completes the sentence."},
 {id:"b-e97",s:"english",t:"word",d:"medium",p:"rings",q:"Climate scientists [[carefully examine]] these records to understand how rainfall has changed over centuries.\nWhich of the following alternatives to the underlined portion would NOT be acceptable?",c:["closely study", "analyze in detail", "scrutinize", "glance over"],a:3,x:"\"Glance over\" means to look quickly and casually, the opposite of a careful examination.",xl:"The sentence describes scientists examining tree-ring records carefully in order to understand centuries of rainfall. \"Closely study,\" \"analyze in detail,\" and \"scrutinize\" all keep that meaning of careful attention, so each is acceptable. \"Glance over\" means to look at something briefly, which changes the meaning and doesn't fit serious research. On NOT questions, the right answer is the one that changes the meaning or breaks a rule."},
 {id:"b-e98",s:"english",t:"adddel",d:"medium",p:"rings",q:"The writer is considering adding the following sentence after the first sentence of Paragraph 1:\n\"Ponderosa pines can grow to more than 200 feet tall.\"\nShould the writer make this addition there?",c:["Yes, because it explains why Douglass chose to study ponderosa pines.", "Yes, because it shows how old the trees Douglass studied were.", "No, because it gives a detail about the trees' height that is unrelated to the paragraph's focus on Douglass's research into tree rings.", "No, because it contradicts the claim that trees add one ring each year."],a:2,x:"The paragraph is about what Douglass was looking for in the rings. Tree height is off topic.",xl:"Paragraph 1 introduces Douglass and explains what he hoped to learn from growth rings and how the rings form. A sentence about how tall ponderosa pines grow doesn't connect to either point, so it would distract the reader. It doesn't explain why he chose the trees (A) or tell how old they were (B), since height says nothing about age here. It doesn't contradict anything either (D); it's simply irrelevant, which is why it shouldn't be added."},
 {id:"b-e99",s:"english",t:"org",d:"hard",p:"rings",q:"The writer wants to add the following sentence to the essay:\n\"Each ring is made of a pale band of wood that grows in spring and a darker band that grows in late summer.\"\nThe sentence would most logically be placed:",c:["after the first sentence of Paragraph 1.", "after the third sentence of Paragraph 1.", "at the end of Paragraph 3.", "at the end of Paragraph 5."],a:1,x:"The third sentence of Paragraph 1 introduces rings (\"A tree adds one ring each year\"), so a description of a ring fits right after it.",xl:"The new sentence describes what a single ring looks like, so it belongs where the essay first explains rings. The third sentence of Paragraph 1 says a tree adds one ring each year and describes wide and narrow rings, so placing the new sentence after it builds naturally on that explanation. After the first sentence (A), rings haven't been mentioned yet. Paragraph 3 is about dating an archaeological site, and Paragraph 5 is the conclusion, so the sentence would interrupt both."},
 {id:"b-e100",s:"english",t:"purpose",d:"medium",p:"rings",q:"Suppose the writer's primary purpose had been to explain how one scientist's research led to a method used in several fields. Would this essay accomplish that purpose?",c:["Yes, because it traces how Douglass's study of tree rings became a dating method used in archaeology and climate science.", "Yes, because it explains in detail how sunspot cycles affect the growth of trees.", "No, because it focuses mainly on the history of the pueblos in Arizona.", "No, because it describes several scientists whose work was unrelated."],a:0,x:"The essay follows Douglass from his original question to the uses of tree-ring dating in archaeology and climate science.",xl:"The essay starts with Douglass's research, explains how he discovered tree-ring dating, and then shows the method used in archaeology (Paragraph 3) and in studying fires and droughts (Paragraph 4). That matches the stated purpose, so the answer is Yes for the reason in A. B is wrong because the essay says Douglass never found a link to the sun. C overstates the pueblos, which appear in only one paragraph, and D is false because the essay centers on one scientist."},
 {id:"b-m51",s:"math",t:"ies",d:"medium",q:"A cylindrical water tank has a radius of 3 feet and a height of 8 feet. What is the volume of the tank, in cubic feet?",c:["24π", "48π", "72π", "288π"],a:2,x:"V = πr²h = π(3²)(8) = 72π cubic feet.",xl:"The volume of a cylinder is the area of its circular base times its height: V = πr²h. Here r = 3 and h = 8, so V = π(9)(8) = 72π. Choice B (48π) is the area of the curved side (2πrh), not the volume. Choice A forgets to square the radius, and D uses the diameter, 6, instead of the radius. ACT gives you volume formulas less often than it used to, so know V = πr²h."},
 {id:"b-m52",s:"math",t:"ies",d:"medium",q:"A closed rectangular box is 6 inches long, 4 inches wide, and 2 inches tall. What is the total surface area of the box, in square inches?",c:["40", "44", "48", "88"],a:3,x:"SA = 2(lw + lh + wh) = 2(24 + 12 + 8) = 88 square inches.",xl:"A closed box has six faces in three matching pairs: top and bottom (6 × 4 = 24 each), front and back (6 × 2 = 12 each), and two ends (4 × 2 = 8 each). Adding one of each gives 24 + 12 + 8 = 44, and doubling for the matching faces gives 88. Choice B (44) forgets to double, C (48) is the volume (6 × 4 × 2), and A (40) counts only the four side faces. Surface area is measured in square units, while volume is in cubic units."},
 {id:"b-m53",s:"math",t:"alg",d:"medium",q:"At a bakery, 3 muffins and 2 coffees cost $13.00, and 1 muffin and 2 coffees cost $7.00. What is the price of 1 muffin?",c:["$2.00", "$3.00", "$3.50", "$5.00"],a:1,x:"Subtract the second order from the first: 2 muffins = $6.00, so 1 muffin = $3.00.",xl:"Write a system: 3m + 2c = 13 and m + 2c = 7. Both orders include 2 coffees, so subtracting the second equation from the first cancels them: 2m = 6, which gives m = 3. A muffin costs $3.00 (and then a coffee costs $2.00, the trap in choice A). Choice D, $5.00, is the cost of one muffin plus one coffee. Look for terms that cancel when you subtract or add equations."},
 {id:"b-m54",s:"math",t:"alg",d:"hard",q:"What is the solution set of √(x + 7) = x − 5 ?",c:["{2}", "{9}", "{2, 9}", "The equation has no real solutions."],a:1,x:"Squaring gives x = 2 or x = 9, but only 9 checks: √16 = 4 = 9 − 5.",xl:"Square both sides: x + 7 = x² − 10x + 25, so x² − 11x + 18 = 0, which factors as (x − 2)(x − 9) = 0. Squaring can create false (extraneous) solutions, so check each one. For x = 9: √16 = 4 and 9 − 5 = 4, so it works. For x = 2: √9 = 3 but 2 − 5 = −3, so it fails. The solution set is {9}, and choice C is the trap for skipping the check."},
 {id:"b-m55",s:"math",t:"func",d:"medium",q:"The function f is defined by f(x) = 2x + 1 when x < 3 and f(x) = x² − 4 when x ≥ 3. What is the value of f(3) − f(−2) ?",c:["5", "7", "8", "10"],a:2,x:"f(3) uses x² − 4 (since 3 ≥ 3): 5. f(−2) uses 2x + 1: −3. So 5 − (−3) = 8.",xl:"For a piecewise function, first decide which rule applies to each input. Since 3 ≥ 3, f(3) = 3² − 4 = 5. Since −2 < 3, f(−2) = 2(−2) + 1 = −3. Then f(3) − f(−2) = 5 − (−3) = 8. Choice D comes from using 2x + 1 for f(3), and choice A from using x² − 4 for f(−2). Pay close attention to whether the boundary value uses < or ≥."},
 {id:"b-m56",s:"math",t:"func",d:"medium",q:"If log₃(x) + log₃(9) = 5, what is the value of x?",c:["3", "27", "81", "243"],a:1,x:"log₃(9) = 2, so log₃(x) = 3, and x = 3³ = 27.",xl:"Since 3² = 9, log₃(9) = 2. Subtracting gives log₃(x) = 3, and rewriting in exponential form gives x = 3³ = 27. You can also combine the logs: log₃(9x) = 5, so 9x = 3⁵ = 243 and x = 27. Choice D (243) forgets to divide by 9, and A confuses the exponent with the answer. Remember that log_b(x) = n means bⁿ = x."},
 {id:"b-m57",s:"math",t:"func",d:"medium",q:"What is the domain of the function g(x) = √(2x − 6) + 1 ?",c:["x ≥ −3", "x ≥ 1", "x ≥ 2", "x ≥ 3"],a:3,x:"The expression under the square root can't be negative: 2x − 6 ≥ 0, so x ≥ 3.",xl:"A square root of a negative number isn't a real number, so the domain is every x that makes 2x − 6 ≥ 0. Adding 6 gives 2x ≥ 6, and dividing by 2 gives x ≥ 3. The \"+ 1\" outside the root shifts the graph up and affects the range, not the domain, so x ≥ 1 (B) mixes the two up. Choice A comes from a sign error. For domain questions about radicals, set what's under the root greater than or equal to 0."},
 {id:"b-m58",s:"math",t:"stat",d:"medium",q:"The table below shows the results of a survey of 80 students.\n\nGrade | Plays an instrument | Does not play\nJunior | 18 | 22\nSenior | 12 | 28\n\nIf a student who plays an instrument is chosen at random, what is the probability that the student is a junior?",c:["9/40", "3/8", "9/20", "3/5"],a:3,x:"Only students who play count: 18 + 12 = 30. Of those, 18 are juniors, so 18/30 = 3/5.",xl:"\"A student who plays an instrument\" limits the group to the instrument column: 18 juniors + 12 seniors = 30 students. Of those 30, 18 are juniors, so the probability is 18/30 = 3/5. Choice A (18/80) divides by all 80 students, C (18/40) divides by all juniors, and B (30/80) is the chance that any student plays an instrument. For conditional probability, find the given group first and make it your denominator."},
 {id:"b-m59",s:"math",t:"num",d:"easy",q:"Matrix A has 2 rows and 3 columns, and matrix B has 3 rows and 4 columns. What are the dimensions of the product AB?",c:["2 × 4", "3 × 3", "4 × 2", "The product AB is undefined."],a:0,x:"A (2 × 3) times B (3 × 4) works because the inside numbers match (3), and the result takes the outside numbers: 2 × 4.",xl:"A matrix product AB is defined only when the number of columns of A equals the number of rows of B. Here A is 2 × 3 and B is 3 × 4, so the inner numbers (3 and 3) match and the product exists, ruling out D. The product has as many rows as A and as many columns as B: 2 × 4. Choice C reverses the order, which would be the dimensions of a different product."},
 {id:"b-m60",s:"math",t:"num",d:"medium",q:"Vector u = ⟨3, −2⟩ and vector v = ⟨−1, 6⟩. What is u + 2v ?",c:["⟨1, 10⟩", "⟨2, 4⟩", "⟨5, 2⟩", "⟨5, −14⟩"],a:0,x:"2v = ⟨−2, 12⟩, so u + 2v = ⟨3 + (−2), −2 + 12⟩ = ⟨1, 10⟩.",xl:"Multiply each component of v by 2 to get 2v = ⟨−2, 12⟩. Then add matching components: 3 + (−2) = 1 and −2 + 12 = 10, giving ⟨1, 10⟩. Choice B is u + v (forgetting the 2), C is 2u + v (doubling the wrong vector), and D is u − 2v. Vector operations work one component at a time."},
 {id:"b-r51",s:"reading",t:"integ",d:"hard",p:"bees",q:"The passage presents the study of community gardens as evidence that:",c:["proves honeybees drove wild bees out of the gardens closest to the hives.", "is consistent with Pike's concern but does not show what caused the difference.", "contradicts Pike's claim that honeybees compete with wild bees.", "shows that rooftop hives produce more honey than hives in gardens."],a:1,x:"Gardens near hives had fewer wild bee visits, which fits Pike's concern, but the researchers said they couldn't tell what caused it.",xl:"The passage says the study \"supports Pike's worry\" because gardens near many hives had fewer wild-bee visits. It then adds the researchers' caution: the study \"could not show whether the honeybees had pushed the wild bees out\" or whether wild bees were simply less common there. So the evidence is consistent with Pike's concern without proving cause, which rules out A. C reverses the evidence, and D is about honey, which the study didn't measure."},
 {id:"b-r52",s:"reading",t:"integ",d:"medium",p:"bees",q:"Which finding, if true, would most directly weaken Pike's argument that adding hives may harm wild bees?",c:["Rooftop hives in the city produce more honey each year than hives on rural farms.", "Many office workers enjoy eating lunch near the rooftop hives.", "Honeybee colonies in the city are often affected by mites.", "Over five years, wild bee counts near the rooftop hives stayed the same while the number of hives grew."],a:3,x:"Pike worries honeybees take food from wild bees. Steady wild-bee numbers as hives increase would cut against that.",xl:"Pike's argument is that honeybees compete with wild bees for flowers, so more hives could mean fewer wild bees. Evidence that wild-bee counts stayed steady while hives increased directly challenges that prediction. Honey production (A), office workers' enjoyment (B), and mites (C) don't say anything about wild bees. To weaken an argument, look for a fact that contradicts its prediction or its main claim."},
 {id:"b-r53",s:"reading",t:"craft",d:"medium",p:"bees",q:"The details about volunteers inspecting hives for mites and harvesting honey mainly serve to:",c:["show the practical, ongoing work involved in running the program.", "argue that beekeeping is too dangerous for volunteers.", "explain why honeybees are not native to North America.", "suggest that the program will soon end."],a:0,x:"The paragraph says the work is \"less glamorous\" than it looks and describes the regular tasks volunteers do.",xl:"The paragraph opens by saying \"the work itself is less glamorous than the rooftop views suggest,\" then lists routine jobs: inspections every two weeks, checking for mites, harvesting honey, and selling it to pay for equipment. Together, these details show the everyday work behind the program. Nothing suggests the work is dangerous (B) or that the program is ending (D), and native species are discussed only later, by Pike (C)."},
 {id:"b-r54",s:"reading",t:"infer",d:"medium",p:"bees",q:"Delgado's first lesson for new volunteers most strongly suggests that she believes:",c:["volunteers should study the chemistry of honey first.", "most new volunteers will quit within a season.", "beekeeping requires calm, careful handling.", "bees are calmer on rooftops than on farms."],a:2,x:"Her first lesson is patience, because rushing or bumping a frame makes the colony angry.",xl:"The passage says Delgado's first lesson is \"about patience\": a beekeeper who \"moves too quickly or bumps a frame\" will \"soon have an angry colony.\" That shows she believes good beekeeping depends on calm, careful handling. Her chemistry background (A) isn't part of the lesson, nothing suggests volunteers quit (B), and the passage never compares rooftop and farm bees' temperaments (D)."},
 {id:"b-r55",s:"reading",t:"integ",d:"medium",p:"maps",q:"The father's complaint that the phone \"showed him only the next few blocks\" (Passage B) is most similar to which point made in Passage A?",c:["Taxi drivers in London must memorize thousands of streets.", "Spoken directions let a traveler wait to be told what to do instead of picturing the whole area.", "Skills such as remembering phone numbers fade when they go unused.", "Travelers once studied a map before setting out."],a:1,x:"Both point out that turn-by-turn directions show only the next step, not the big picture.",xl:"The father misses seeing \"the whole state at once,\" while the phone shows \"only the next few blocks.\" Passage A makes a similar point: someone following spoken directions \"can simply wait to be told what to do\" rather than building a picture of the area. Choice A is a detail about taxi drivers, C is about skills fading, and D is about travel in the past. None of these describes the narrow view the father complains about."},
 {id:"b-r56",s:"reading",t:"integ",d:"hard",p:"maps",q:"The author of Passage A would most likely respond to the grandmother's experience described in Passage B by:",c:["arguing that she should return to using a paper atlas.", "claiming that the app will weaken her memory of every route she rides.", "acknowledging that apps can be useful, as Passage A does when it says people shouldn't throw away their phones.", "pointing out that she should memorize the streets as taxi drivers do."],a:2,x:"Passage A says \"None of this means people should throw away their phones,\" so its author would accept the app helping her.",xl:"Passage A's author is concerned about losing navigation skills but explicitly says \"None of this means people should throw away their phones,\" recommending only a few minutes with a map before a trip. The grandmother uses the app because her vision makes night driving hard, which is the kind of real benefit Passage A accepts. Nothing in Passage A suggests demanding a return to paper maps (A) or taxi-driver memorization (D), and B overstates its claims."},
 {id:"b-r57",s:"reading",t:"craft",d:"medium",p:"clock",q:"The description of the clocks in the repair shop, where \"none of them agreed,\" mainly serves to:",c:["convey that Nadia finds the crowded, ticking room unexpectedly comforting.", "show that the clerk is careless about his work.", "suggest that Nadia regrets bringing the clock to the shop.", "explain why the repair will take two weeks."],a:0,x:"The narrator says the noise \"should have been maddening\" but was \"oddly comforting\" to Nadia.",xl:"After describing the clocks that \"none of them agreed,\" the passage says it \"should have been maddening\" but was \"oddly comforting instead, like a room full of people talking quietly at once.\" The description builds to Nadia's surprising reaction. Nothing suggests the clerk is careless (B) or that Nadia regrets coming (C), and the scene doesn't explain the length of the repair (D). It also sets up the contrast with the quiet apartment at the end."},
 {id:"b-r58",s:"reading",t:"detail",d:"easy",p:"clock",q:"According to the passage, when Nadia tells her grandmother about the dent, the grandmother:",c:["asks Nadia to have the dent removed.", "laughs so hard that she has to set down her tea.", "says she never liked the clock.", "offers to pay for the repair."],a:1,x:"The passage says her grandmother \"laughed so hard she had to set down her tea.\"",xl:"On Sunday, Nadia tells her grandmother about the dent, and \"her grandmother laughed so hard she had to set down her tea.\" She then says, \"That dent is older than your mother.\" The grandmother never asks for the dent to be removed (A); in fact she worried the clerk would make the clock \"shiny.\" Choices C and D are not mentioned. For detail questions, find the exact sentence before choosing."},
 {id:"b-r59",s:"reading",t:"integ",d:"hard",p:"diners",q:"The reviewer's claim that the series was \"a catalog, not a vision\" is answered in the passage mainly by:",c:["the argument that the repetition he disliked reveals differences no single photograph could show.", "a quotation in which Calder defends her choice of subjects.", "evidence that the series sold more prints than Calder's other work.", "a description of the critics who first called the project nostalgic."],a:0,x:"The author says the repetition is what later viewers admire, because together the photographs show small differences.",xl:"Right after the reviewer's complaint, the author writes that \"the repetition that bothered him... is exactly what many later viewers admire,\" because the photographs, seen together, reveal differences \"that no single image could show.\" That is the passage's response to the claim. Calder herself \"did not reply\" (B), sales are never mentioned (C), and the earlier critics (D) made a different complaint. Evaluating an argument means finding how the author counters it."},
 {id:"b-r60",s:"reading",t:"detail",d:"easy",p:"diners",q:"According to the passage, the people in Calder's photographs quickly stopped noticing her because:",c:["she photographed only after the diners had closed.", "she hid her camera beneath the counter.", "her large camera took a long time to set up, so she stayed in one place for a while.", "she worked as a waitress in several of the diners."],a:2,x:"The passage says \"the slowness\" of her large-format camera meant cooks and waitresses \"quickly stopped noticing her.\"",xl:"The passage explains that each photograph could take twenty minutes to set up on a tripod, and that \"the slowness meant that cooks and waitresses quickly stopped noticing her.\" She photographed just after dawn, not after closing (A), and nothing suggests she hid her camera (B) or worked in the diners (D). Detail questions are answered by a specific sentence, so find it before choosing."},
 {id:"b-r61",s:"reading",t:"integ",d:"medium",p:"tardi",q:"Which finding described in the passage provides the most direct evidence that tardigrades' special proteins help living things survive drying?",c:["Tardigrades have survived exposure to the vacuum of space.", "More than 1,300 species of tardigrades have been identified.", "Yeast and bacteria given the genes for the proteins became better at surviving drying.", "Active, hydrated tardigrades handle prolonged heat poorly."],a:2,x:"Adding the protein genes to other organisms improved their survival, which directly links the proteins to the effect.",xl:"To show that the proteins themselves cause better survival, you need a test that adds the proteins and measures the result. The 2017 experiment did exactly that: yeast and bacteria given the genes became \"noticeably better at surviving drying.\" Surviving space (A) shows tardigrades are tough but doesn't isolate the proteins. The number of species (B) and heat sensitivity (D) don't involve the proteins at all."},
 {id:"b-r62",s:"reading",t:"craft",d:"medium",p:"tardi",q:"The mention of vaccines and other medicines mainly serves to:",c:["suggest that tardigrades could be used to cure diseases.", "explain how tardigrades survive radiation.", "criticize scientists for focusing on medicine.", "show why the research on tardigrade proteins interests people outside biology."],a:3,x:"The passage says the findings \"have drawn attention far outside biology,\" then gives the medicine example.",xl:"Just before the vaccine example, the passage says \"the findings have drawn attention far outside biology.\" The example of keeping medicines stable without refrigeration illustrates that wider interest. The passage doesn't claim tardigrades cure diseases (A), radiation survival is a separate point (B), and nothing in the tone is critical (C). When a detail follows a general statement, it usually serves as an example of that statement."},
 {id:"b-r63",s:"reading",t:"detail",d:"easy",p:"tardi",q:"According to the passage, compared with tardigrades dried in minutes, tardigrades that were dried slowly over several hours:",c:["survived far more often.", "never formed a tun.", "lost their legs.", "grew noticeably larger."],a:0,x:"The passage says slowly dried tardigrades \"survived far more often than those dried in minutes.\"",xl:"The passage states that \"tardigrades that were dried slowly over several hours survived far more often than those dried in minutes.\" It explains this as the animals needing time to build up protective molecules. The other choices are not supported: the slowly dried animals are the ones that could form a tun (B), and nothing describes them losing legs (C) or growing (D)."},
 {id:"b-r64",s:"reading",t:"integ",d:"easy",p:"sleep",q:"According to Table 1, after the district changed its start time, average sleep on school nights increased by:",c:["10 minutes.", "40 minutes.", "50 minutes.", "60 minutes."],a:2,x:"Sleep went from 6 hr 50 min to 7 hr 40 min, an increase of 50 minutes.",xl:"Find the \"Average sleep on school nights\" row: 6 hr 50 min before and 7 hr 40 min after. From 6:50 to 7:40 is 50 minutes. Choice A (10 minutes) is the change in bedtime, not sleep, and D assumes the full extra hour became sleep. Read the row label carefully on table questions so you use the right numbers."},
 {id:"b-r65",s:"reading",t:"integ",d:"medium",p:"sleep",q:"The data in Table 1 most directly support which claim made in the passage?",c:["Later start times can complicate bus schedules shared with elementary schools.", "Teen drivers who are short on sleep face a higher risk of crashes.", "Melatonin rises later in the evening for teenagers than for adults.", "Students did not simply stay up an hour later after the start time changed."],a:3,x:"Average bedtime moved only from 10:55 to 11:05 p.m., just 10 minutes later.",xl:"Table 1 shows average bedtime moving from 10:55 p.m. to 11:05 p.m., only 10 minutes later, while sleep increased by 50 minutes. That directly supports the claim that students didn't just stay up an hour later. The table has no information about buses (A), driving (B), or melatonin (C). On graphic questions, choose the claim the numbers actually measure."},
 {id:"b-r66",s:"reading",t:"integ",d:"hard",p:"sleep",q:"Based on the passage and Table 1, which statement about the district is best supported?",c:["Students went to bed an hour later, so they got no more sleep than before.", "Most of the extra hour became sleep, and both attendance and alertness in first period rose.", "First-period attendance fell because after-school practices ended later.", "Fewer than a third of students felt alert in first period after the change."],a:1,x:"Sleep rose 50 minutes, attendance rose from 88% to 93%, and alertness rose from 32% to 51%.",xl:"The passage says \"most of the extra hour in the morning became extra sleep,\" and Table 1 confirms it: sleep rose by 50 minutes while bedtime moved only 10 minutes. Attendance rose from 88% to 93%, and students feeling alert rose from 32% to 51%. Choice A contradicts the bedtime data, C says attendance fell, and D uses the before value (32%) instead of the after value (51%). Combining text and table is the key skill these questions test."}

/* Daily streak: days in a row the app was opened (local time) */
const dayStr=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const shiftDay=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return dayStr(new Date(y,m-1,d+n,12));};
function checkIn(announce){
  const today=dayStr(Date.now());
  if(P.lastDay===today) return false;
  const prev=P.dayStreak||0;
  P.dayStreak = P.lastDay===shiftDay(today,-1) ? prev+1 : 1;
  P.bestDay=Math.max(P.bestDay||0,P.dayStreak);
  P.lastDay=today;
  P.days=(Array.isArray(P.days)?P.days:[]).filter(d=>d>=shiftDay(today,-13)).concat(today);
  if(announce){
    if(P.dayStreak>1) toast("🔥",P.dayStreak+"-day streak!","You've opened ACT Study Lab "+P.dayStreak+" days in a row");
    else if(prev>1) toast("🔥","New streak started","Your last streak was "+prev+" days. Come back tomorrow to build it up");
  }
  checkBadges(announce); saveProfile(); showDay(); return true;
}
function showDay(){
  const el=document.getElementById("day"); if(!el) return;
  const live=P.lastDay===dayStr(Date.now());
  document.getElementById("dayN").textContent=live?(P.dayStreak||0):0;
  el.classList.toggle("off",!live);
  el.setAttribute("aria-label",(live?P.dayStreak||0:0)+" day streak");
}

  BADGES.forEach(b=>{ const val=b.k==="c"?c:b.k==="s"?P.best:(P.bestDay||0); if(!P.badges[b.id] && val>=b.v){ P.badges[b.id]=Date.now(); fresh.push(b);} });
  if(announce) fresh.forEach((b,i)=>setTimeout(()=>toast(b.ic,"Badge earned: "+b.n,b.d),i*2600));
  return fresh.length;
}

/* Keep the session you're in if the page reloads or the phone closes the tab. */
const SKEY="actlab.session";
function saveSession(){
  try{
    if(!session){ localStorage.removeItem(SKEY); return; }
    localStorage.setItem(SKEY, JSON.stringify(Object.assign({}, session, {ans:session.ans.map(a=>Object.assign({},a,{q:undefined})), saved:Date.now()})));
  }catch(e){}
}
function loadSession(){
  try{
    const s=JSON.parse(localStorage.getItem(SKEY)||"null");
    if(!s||!Array.isArray(s.qs)||!s.qs.length||Date.now()-(s.saved||0)>36*3600e3) return null;
    const live=new Map(BUILTIN.concat(P.gen||[],CUSTOM).map(q=>[q.id,q]));
    s.qs=s.qs.map(q=>live.get(q.id)||q);
    s.ans=(s.ans||[]).map((a,k)=>Object.assign(a,{q:s.qs[k]}));
    if(!s.done&&s.i>=s.qs.length) return null;
    s.elim=s.elim||[];
    return s;
  }catch(e){ return null; }
}
function resumeSession(){ const s=loadSession(); if(s){ session=s; tab=s.home||"practice"; if(!s.done) setTimeout(()=>toast("↩️","Picked up where you left off",s.label),300); } }

const gPick=a=>a[Math.floor(Math.random()*a.length)];
const gGcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const gNum=v=>{const r=Math.round(v*100)/100;return (r<0?"−":"")+Math.abs(r).toLocaleString("en-US",{maximumFractionDigits:2});};
const gSup=n=>String(n).split("").map(ch=>ch==="-"?"⁻":"⁰¹²³⁴⁵⁶⁷⁸⁹"[ch]).join("");
const gPlus=v=>v<0?"− "+gNum(-v):"+ "+gNum(v);
const gN=(v,f)=>({v,s:f?f(v):gNum(v)});
const gF=(n,d)=>{if(d<0){n=-n;d=-d;} const g=gGcd(n,d); n/=g; d/=g; return {v:n/d,s:d===1?gNum(n):(n<0?"−":"")+Math.abs(n)+"/"+d};};
const gUp=s=>s.charAt(0).toUpperCase()+s.slice(1);
/* Build 4 choices sorted smallest to largest from the answer and likely wrong answers. */
function gChoices(ans,wrong,fmt){
  const out=[ans], seen=new Set([ans.s]);
  const add=w=>{ if(w&&isFinite(w.v)&&!seen.has(w.s)&&out.length<4){seen.add(w.s);out.push(w);} };
  wrong.forEach(add);
  if(out.length<4&&Number.isInteger(ans.v)){
    const step=Math.max(1,Math.round(Math.abs(ans.v)*0.1));
    [1,-1,2,-2,3,-3].forEach(k=>add(gN(ans.v+k*step,fmt)));
  }
  if(out.length<4) return null;
  out.sort((a,b)=>a.v-b.v);
  return {c:out.map(o=>o.s), a:out.indexOf(ans)};
}
/* For word choices: shuffle the order, track where the right answer lands. */
function gShuffle(c,a){
  const idx=c.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return {c:idx.map(i=>c[i]), a:idx.indexOf(a)};
}

const GEN_TOPIC=new Map();   // template -> topic it produces (learned by running it once)
function templatesFor(s,t){
  const list=GEN_T[s]||[];
  list.forEach(fn=>{ for(let k=0;k<20&&!GEN_TOPIC.has(fn);k++){ try{const o=fn(); if(o) GEN_TOPIC.set(fn,o.t);}catch(e){} } });

function makeQuestion(s,t){
  const list=templatesFor(s,t); if(!list.length) return null;
  for(let tries=0; tries<40; tries++){
    let o=null; try{ o=gPick(list)(); }catch(e){ o=null; }
    if(!o) continue;
    if(!Array.isArray(o.c)||o.c.length!==4||new Set(o.c).size!==4||!(o.a>=0&&o.a<4)) continue;
    const id="g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const nq=Object.assign({id,s,gen:true,created:Date.now()},o,o.passage?{pid:id}:{});
    if(actCheck(nq).ok) return nq;   // every new question must pass the ACT-style checker
  }

}
function validGenQ(o){ return o&&typeof o.q==="string"&&Array.isArray(o.c)&&o.c.length===4&&Number.isInteger(o.a)&&o.a>=0&&o.a<4; }

    const id="g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const nq={id,s,t,d:LEVELS[o.d]?o.d:d,q:String(o.q),c:o.c.map(String),a:o.a,x:String(o.x||""),xl:String(o.xl||""),passage:typeof o.passage==="string"?o.passage:"",pid:o.passage?id:"",gen:true,ai:true,created:Date.now()};

  if(isCustomQ(q)) return "";
  P.retired=P.retired||{}; P.gen=P.gen||[];
  if(q.gen){ P.gen=P.gen.filter(g=>g.id!==q.id); delete P.seen[q.id]; } else P.retired[q.id]=Date.now();
  const name=BP[q.s].name;
  if(AI_ENDPOINT){
    aiQuestion(q.s,q.t,levelOf(q)).then(nq=>{ nq=nq||makeQuestion(q.s,q.t); if(nq){P.gen.push(nq);saveProfile();} });
    return `✨ Solved! A brand-new ${name} question is being added to your bank.`;
  }
  const nq=makeQuestion(q.s,q.t);
  if(nq){ P.gen.push(nq); return `✨ Solved! It's been swapped for a brand-new ${name} question.`; }
  const left=BUILTIN.filter(b=>b.s===q.s&&!P.retired[b.id]).length;
  const lv=levelOf(q), leftLv=BUILTIN.filter(b=>b.s===q.s&&levelOf(b)===lv&&!P.retired[b.id]).length;
  if(left>=REFILL_AT&&leftLv===0){   // ran out at this difficulty: bring back the solved ones at this level
    Object.keys(P.retired).forEach(id=>{const b=BUILTIN.find(x=>x.id===id); if(b&&b.s===q.s&&levelOf(b)===lv) delete P.retired[id];});
    return `✓ Solved! You've worked through every ${LEVELS[lv]} ${name} question, so those are back for review.`;
  }
  if(left<REFILL_AT){
    Object.keys(P.retired).forEach(id=>{const b=BUILTIN.find(x=>x.id===id); if(b&&b.s===q.s) delete P.retired[id];});
    return `✓ Solved! You've worked through almost every ${name} question, so your solved ones are back for review.`;
  }
  return `✓ Solved! This one is set aside. Your solved ${name} questions come back after ${left-REFILL_AT+1} more.`;
}

/* ---------- ACT-style checker ----------
   Every question the app makes (templates now, AI later) must pass this before it enters a bank, and every
   built-in question was screened with it. The rules follow the published format of the enhanced ACT
   (2025 onward): four answer choices in every section; English = revising/editing questions tied to a
   passage, with "NO CHANGE" as the first choice for underlined portions; Math = 45 questions on skills up to
   the start of grade 12, numeric choices listed in order; Reading = questions about a passage (or a pair of
   passages); Science = questions answered from a passage of experiments, data or viewpoints.
   It checks format and style only. It can't judge whether a question is good, and it never uses real
   ACT questions. Open the app with #check at the end of the address to see a report for the whole bank. */
const ACT_BANNED = /\b(all|none) of the (above|these)\b|\bboth [A-D] and [A-D]\b|\btrue or false\b|\bwhich of the following is NOT true\b/i;
function wordCount(s){ return (String(s||"").match(/[A-Za-z0-9’'-]+/g)||[]).length; }
function choiceValue(c){
  const s=String(c).replace(/−/g,"-").replace(/,/g,"").replace(/^\$/,"").trim();
  let m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+)$/); if(m) return +m[1]/+m[2];
  m=s.match(/^(-?\d+(?:\.\d+)?)\s*(?:%|°C?|π|[a-z ]*)$/i); if(m) return +m[1];
  return null;
}
function actCheck(q){
  const hard=[], soft=[];
  const sec=BP[q.s], pass=passageOf(q);
  if(!sec) return {ok:false,hard:["unknown section"],soft};
  if(!sec.topics.some(t=>t[0]===q.t)) hard.push("topic isn't part of the ACT blueprint");
  if(!Array.isArray(q.c)||q.c.length!==4) hard.push("needs exactly 4 answer choices (enhanced ACT)");
  else {
    if(q.c.some(c=>!String(c).trim())) hard.push("has an empty answer choice");
    if(new Set(q.c.map(c=>String(c).trim().toLowerCase())).size!==4) hard.push("has duplicate answer choices");
    if(q.c.some(c=>ACT_BANNED.test(c))) hard.push("uses an answer style the ACT doesn't use (all/none of the above, true/false)");
  }
  if(!(Number.isInteger(q.a)&&q.a>=0&&q.a<4)) hard.push("needs one correct answer");
  if(!String(q.q||"").trim()) hard.push("has no question text");
  if(!String(q.x||"").trim()&&!XL[q.id]&&!String(q.xl||"").trim()) hard.push("has no explanation");
  const underlined=/\[\[.+?\]\]/.test(q.q||"")||/\[\[.+?\]\]/.test(pass);
  if(q.s==="english"){
    if(!pass) hard.push("English questions must revise or edit a passage, not a lone sentence");
    else if(wordCount(pass)<60) hard.push("passage is too short to be an ACT English text");
    else if(wordCount(pass)<150) soft.push("shorter than a typical ACT English passage");
    const notQ=/\b(NOT|LEAST)\b/.test(q.q||"");   // "Which alternative would NOT/LEAST be acceptable?"
    if(notQ&&q.c&&q.c.includes("NO CHANGE")) hard.push("NOT/LEAST questions list only alternatives, never NO CHANGE");
    if(!notQ&&/\[\[.+?\]\]/.test(q.q||"")&&q.c&&q.c[0]!=="NO CHANGE") hard.push("underlined-portion questions must list NO CHANGE first");
    if(!underlined&&!/Sentence|paragraph|essay|writer|passage/i.test(q.q||"")) soft.push("doesn't point to an underlined portion, sentence or the essay");
  }
  if(q.s==="reading"){
    if(!pass) hard.push("Reading questions must be about a passage");
    else if(wordCount(pass)<200) hard.push("passage is too short for ACT Reading");
    else if(wordCount(pass)<500) soft.push("shorter than a typical ACT Reading passage (about 600-750 words)");
  }
  if(q.s==="science"){
    if(!pass) hard.push("Science questions must be answered from a passage (experiment, data or viewpoints)");
    else if(!/\|/.test(pass)&&!/\{\{(line|bar)\s/.test(pass)&&!/(Scientist|Student|Hypothesis|Study|Experiment)\s*\d*\s*:/i.test(pass)) hard.push("Science passage needs data (a table or graph) or described experiments/viewpoints");
  }
  if(q.s==="math"&&Array.isArray(q.c)&&q.c.length===4){
    const v=q.c.map(choiceValue);
    if(v.every(x=>x!==null)&&v.some((x,i)=>i&&x<v[i-1])) hard.push("numeric choices must be listed from least to greatest");
    if(pass&&wordCount(pass)>0) soft.push("ACT Math questions rarely come with a reading passage");
  }
  if(!/[?:.]$|_{2,}$/.test(String(q.q||"").trim())&&!/\[\[.+?\]\]/.test(q.q||"")) soft.push("question doesn't end like an ACT question (? or :)");
  return {ok:!hard.length, hard, soft};
}
function renderCheckReport(){
  const all=BUILTIN.concat(P.gen||[]), bad=[], warn=[];
  all.forEach(q=>{const r=actCheck(q); if(!r.ok) bad.push([q,r]); else if(r.soft.length) warn.push([q,r]);});
  const sample=[]; ["math","science"].forEach(s=>BP[s].topics.forEach(([t])=>{for(let k=0;k<20;k++){const g=makeQuestion(s,t); if(g) sample.push(g);}}));
  const sampleBad=sample.filter(g=>!actCheck(g).ok);
  let h=`<div class="card"><h2>ACT-style check</h2><p class="mute">Checks every question against the enhanced ACT's published format. It can't judge whether a question is good, only whether it's built like an ACT question.</p>
   <div class="row"><span>Starting + generated questions checked</span><b>${all.length}</b></div>
   <div class="row"><span>Failing (not ACT-style)</span><b>${bad.length}</b></div>
   <div class="row"><span>Passing with notes</span><b>${warn.length}</b></div>
   <div class="row"><span>Fresh generated samples failing</span><b>${sampleBad.length} / ${sample.length}</b></div></div>`;
  const list=(title,arr)=>{ if(!arr.length) return ""; let s=`<div class="card"><h2>${title}</h2>`; arr.slice(0,80).forEach(([q,r])=>{s+=`<div class="qitem"><b>${esc(q.id)}</b> · ${esc(BP[q.s].name)} · ${esc(topicName(q.s,q.t))}<div class="mute small">${esc(r.hard.concat(r.soft).join("; "))}</div></div>`;}); return s+`</div>`; };
  h+=list("Failing",bad)+list("Notes",warn);
  V.innerHTML=h;
}

/* ---------- Prediction model ---------- */
function officialCounts(sec){
  const qs=CUSTOM.filter(q=>q.s===sec&&q.origin==="official");
  const m={}; qs.forEach(q=>m[q.t]=(m[q.t]||0)+1);
  return {n:qs.length,m};
}
// Blend ACT's blueprint with the topics you see on real tests once you've logged 10+ official questions
function weight(sec,t){
  const base=(BP[sec].topics.find(x=>x[0]===t)||[0,0,5])[2];
  const oc=officialCounts(sec);
  if(oc.n<10) return base;
  return 0.5*base + 0.5*(100*(oc.m[t]||0)/oc.n);
}
function acc(key){const s=P.stats[key];return s?(s.r+1)/(s.t+2):0.5;}
function rawAcc(key){const s=P.stats[key];return s&&s.t?s.r/s.t:null;}
function priorities(secs){
  const out=[];
  secs.forEach(s=>BP[s].topics.forEach(([t,name])=>{
    out.push({s,t,name,w:weight(s,t),p:weight(s,t)*(1-acc(s+"."+t))});
  }));
